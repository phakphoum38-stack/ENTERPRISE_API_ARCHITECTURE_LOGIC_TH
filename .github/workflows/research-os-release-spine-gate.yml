name: Research OS Release Spine Gate

on:
  workflow_run:
    workflows:
      - Research OS Unified Windows Distribution
      - Research OS Gate
      - Provenance Evidence Gate
      - Canonical Source Lineage Gate
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact immutable source SHA
        required: true
        type: string
      candidate_run_id:
        description: Successful Research OS Unified Windows Distribution run ID
        required: true
        type: string
      research_gate_run_id:
        description: Successful Research OS Gate run ID
        required: true
        type: string
      provenance_run_id:
        description: Successful Provenance Evidence Gate run ID
        required: true
        type: string
      lineage_run_id:
        description: Successful Canonical Source Lineage Gate run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-os-release-spine-${{ inputs.target_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ inputs.target_sha || github.event.workflow_run.head_sha }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
  RESEARCH_GATE_RUN_ID: ${{ inputs.research_gate_run_id }}
  PROVENANCE_RUN_ID: ${{ inputs.provenance_run_id }}
  LINEAGE_RUN_ID: ${{ inputs.lineage_run_id }}

jobs:
  certify:
    name: Verify release spine and certify exact target
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.name == 'Research OS Unified Windows Distribution' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=PASS"
          echo "TARGET_SHA=$TARGET_SHA"

      - name: Resolve exact constituent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          find_successful_run() {
            local workflow="$1"
            local found=""
            for attempt in $(seq 1 20); do
              found="$(
                gh run list \
                  --repo "${{ github.repository }}" \
                  --workflow "$workflow" \
                  --commit "$TARGET_SHA" \
                  --limit 50 \
                  --json databaseId,status,conclusion,headSha,workflowName \
                  --jq '[.[] | select(.headSha == env.TARGET_SHA and .status == "completed" and .conclusion == "success")] | .[0].databaseId // empty'
              )"

              if [ -n "$found" ]; then
                printf '%s' "$found"
                return 0
              fi

              if [ "$attempt" -lt 20 ]; then
                sleep 30
              fi
            done

            echo "No successful exact-SHA run found for workflow: $workflow" >&2
            return 1
          }

          validate_supplied_run() {
            local run_id="$1"
            local expected_workflow="$2"

            test -n "$run_id"

            local workflow status conclusion head_sha
            workflow="$(gh run view "$run_id" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')"
            status="$(gh run view "$run_id" --repo "${{ github.repository }}" --json status --jq '.status')"
            conclusion="$(gh run view "$run_id" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')"
            head_sha="$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"

            test "$workflow" = "$expected_workflow"
            test "$status" = completed
            test "$conclusion" = success
            test "$head_sha" = "$TARGET_SHA"
          }

          if [ -n "${CANDIDATE_RUN_ID:-}" ]; then
            validate_supplied_run \
              "$CANDIDATE_RUN_ID" \
              "Research OS Unified Windows Distribution"
          else
            CANDIDATE_RUN_ID="$(
              find_successful_run "Research OS Unified Windows Distribution"
            )"
          fi

          if [ -n "${RESEARCH_GATE_RUN_ID:-}" ]; then
            validate_supplied_run \
              "$RESEARCH_GATE_RUN_ID" \
              "Research OS Gate"
          else
            RESEARCH_GATE_RUN_ID="$(
              find_successful_run "Research OS Gate"
            )"
          fi

          if [ -n "${PROVENANCE_RUN_ID:-}" ]; then
            validate_supplied_run \
              "$PROVENANCE_RUN_ID" \
              "Provenance Evidence Gate"
          else
            PROVENANCE_RUN_ID="$(
              find_successful_run "Provenance Evidence Gate"
            )"
          fi

          if [ -n "${LINEAGE_RUN_ID:-}" ]; then
            validate_supplied_run \
              "$LINEAGE_RUN_ID" \
              "Canonical Source Lineage Gate"
          else
            LINEAGE_RUN_ID="$(
              find_successful_run "Canonical Source Lineage Gate"
            )"
          fi

          {
            echo "CANDIDATE_RUN_ID=$CANDIDATE_RUN_ID"
            echo "RESEARCH_GATE_RUN_ID=$RESEARCH_GATE_RUN_ID"
            echo "PROVENANCE_RUN_ID=$PROVENANCE_RUN_ID"
            echo "LINEAGE_RUN_ID=$LINEAGE_RUN_ID"
          } >> "$GITHUB_ENV"

          echo "RELEASE_SPINE_EXACT_SHA_BINDING=PASS"
          echo "candidate=$CANDIDATE_RUN_ID"
          echo "research_gate=$RESEARCH_GATE_RUN_ID"
          echo "provenance=$PROVENANCE_RUN_ID"
          echo "lineage=$LINEAGE_RUN_ID"

      - name: Validate constituent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          validate_run() {
            local run_id="$1"
            local expected_workflow="$2"

            test -n "$run_id"

            local workflow status conclusion head_sha
            workflow="$(gh run view "$run_id" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')"
            status="$(gh run view "$run_id" --repo "${{ github.repository }}" --json status --jq '.status')"
            conclusion="$(gh run view "$run_id" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')"
            head_sha="$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"

            test "$workflow" = "$expected_workflow"
            test "$status" = completed
            test "$conclusion" = success
            test "$head_sha" = "$TARGET_SHA"
          }

          validate_run "$CANDIDATE_RUN_ID" "Research OS Unified Windows Distribution"
          validate_run "$RESEARCH_GATE_RUN_ID" "Research OS Gate"
          validate_run "$PROVENANCE_RUN_ID" "Provenance Evidence Gate"
          validate_run "$LINEAGE_RUN_ID" "Canonical Source Lineage Gate"

          echo "RELEASE_SPINE_CONSTITUENT_RUNS=PASS"

      - name: Verify candidate installer SHA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-input && mkdir -p release-input
          gh run download "$CANDIDATE_RUN_ID" --repo "${{ github.repository }}" --name "Research-OS-Unified-Windows-x64-$TARGET_SHA" --dir release-input

          manifest="$(find release-input -type f -name 'DISTRIBUTION_MANIFEST.json' -print -quit)"
          manifest_hash="$(find release-input -type f -name 'DISTRIBUTION_MANIFEST.sha256' -print -quit)"
          release_evidence="$(find release-input -type f -name 'RELEASE_EVIDENCE.json' -print -quit)"
          install_e2e="$(find release-input -type f -name 'WINDOWS_INSTALL_E2E_EVIDENCE.json' -print -quit)"
          archive="$(find release-input -type f -name "Research-OS-Platform-Windows-x64-$TARGET_SHA.zip" -print -quit)"
          setup="$(find release-input -type f -name 'Research-OS-Owner-Special-Setup-*-x64.exe' -print -quit)"

          test -n "$manifest"
          test -n "$manifest_hash"
          test -n "$release_evidence"
          test -n "$install_e2e"
          test -n "$archive"
          test -n "$setup"

          python3 - "$manifest" "$manifest_hash" "$release_evidence" "$install_e2e" "$archive" "$setup" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest=json.load(open(sys.argv[1], encoding="utf-8-sig"))
          manifest_hash_line=pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").strip().split()[0].lower()
          actual_manifest=hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest()
          evidence=json.load(open(sys.argv[3], encoding="utf-8-sig"))
          install_e2e=json.load(open(sys.argv[4], encoding="utf-8-sig"))
          archive_sha=hashlib.sha256(open(sys.argv[5],"rb").read()).hexdigest()
          target="${{ env.TARGET_SHA }}"

          assert manifest["source_sha"] == target
          assert manifest["product_name"] == "Research OS"
          assert manifest["company_name"] == "Research OS Team"
          assert manifest_hash_line == actual_manifest

          assert evidence["source_sha"] == target
          assert evidence["platform_zip"] == pathlib.Path(sys.argv[5]).name
          assert evidence["platform_zip_sha256"] == archive_sha
          assert evidence["owner_special_setup"] == pathlib.Path(sys.argv[6]).name
          assert evidence["release_authority"] == "FINAL_GATE"
          assert evidence["installer_role"] == "OWNER_SPECIAL"
          assert evidence["installation_payload"] == "RESEARCH_OS_PLATFORM_ZIP"

          assert install_e2e["source_sha"] == target
          assert install_e2e["manifest_sha256"] == actual_manifest
          assert install_e2e["release_authority"] == "FINAL_GATE"
          assert all(install_e2e["checks"].values())

          print("UNIFIED_WINDOWS_DISTRIBUTION_SHA256=PASS")
          print("WINDOWS_INSTALL_E2E_EVIDENCE=PASS")
          print(f"RESEARCH_OS_PLATFORM_ZIP_SHA256={archive_sha}")
          PY

      - name: Build immutable release spine evidence
        run: |
          set -euo pipefail
          mkdir -p release-spine

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          install_e2e_path = next(Path("release-input").rglob("WINDOWS_INSTALL_E2E_EVIDENCE.json"))
          install_e2e_sha = hashlib.sha256(install_e2e_path.read_bytes()).hexdigest()

          evidence = {
              "schema": "research-os.release-spine.v1",
              "immutable": True,
              "commit": os.environ["TARGET_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "install_e2e_evidence_sha256": install_e2e_sha,
              "gates": {
                  "SOURCE": True,
                  "QUALITY": True,
                  "BUILD": True,
                  "IDENTITY": True,
                  "PACKAGE": True,
                  "INSTALL_E2E": True,
                  "PROVENANCE": True,
                  "LINEAGE": True,
                  "CANDIDATE": True,
                  "CERTIFICATION": True,
                  "RELEASE": False,
              },
              "protected_gates": {
                  "TARGET_SHA": True,
                  "SHA256": True,
                  "CANONICAL_LINEAGE": True,
                  "RELEASE_CERTIFICATION": True,
              },
              "run_refs": {
                  "candidate": os.environ["CANDIDATE_RUN_ID"],
                  "research_gate": os.environ["RESEARCH_GATE_RUN_ID"],
                  "provenance": os.environ["PROVENANCE_RUN_ID"],
                  "lineage": os.environ["LINEAGE_RUN_ID"],
              },
          }

          evidence["manifest_sha256"] = hashlib.sha256(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()

          Path("release-spine/RELEASE_SPINE_CERTIFICATION.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("RELEASE_SPINE_CERTIFICATION=PASS")
          print("RELEASE_SPINE_CURRENT_MAIN_BINDING=PASS")
          PY

      - name: Upload immutable release spine evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-os-release-spine-${{ env.TARGET_SHA }}
          path: release-spine/RELEASE_SPINE_CERTIFICATION.json
          if-no-files-found: error
          retention-days: 30
