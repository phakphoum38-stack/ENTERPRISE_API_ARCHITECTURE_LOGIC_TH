name: Research OS Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/research_os_flutter/**"
      - "tools/research_os_api/**"
      - "tools/research_os_service/**"
      - "tools/research_curator/**"
      - "scripts/*research-os*.ps1"
      - "installer/**"
      - ".github/workflows/0*-*.yml"
      - ".github/workflows/research-os-windows-desktop.yml"
  pull_request:
    paths:
      - "apps/research_os_flutter/**"
      - "tools/research_os_api/**"
      - "tools/research_os_service/**"
      - "tools/research_curator/**"
      - "scripts/*research-os*.ps1"
      - "installer/**"
      - ".github/workflows/0*-*.yml"
      - ".github/workflows/research-os-windows-desktop.yml"

permissions:
  contents: read

concurrency:
  group: research-os-build-windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout target revision into short Windows path
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: src

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Stage Flutter app at short path
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\apps\research_os_flutter'
          $short = 'D:\w'
          if (Test-Path $short) { Remove-Item $short -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $short | Out-Null
          Copy-Item (Join-Path $source '*') $short -Recurse -Force
          Write-Host "Flutter source staged at $short"
          Write-Host "Candidate SHA: $env:TARGET_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform shell
        working-directory: D:\w
        shell: pwsh
        run: flutter create --platforms=windows --project-name=research_os_flutter .

      - name: Apply Research OS branding
        working-directory: D:\w
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python "$env:GITHUB_WORKSPACE\src\scripts\apply-research-os-branding.py" --app-root "D:\w" --platform windows

      - name: Install Flutter dependencies
        working-directory: D:\w
        shell: pwsh
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: D:\w
        shell: pwsh
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: D:\w
        shell: pwsh
        run: flutter test

      - name: Build Windows desktop
        working-directory: D:\w
        shell: pwsh
        run: |
          flutter build windows --release --verbose
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            throw "Flutter Windows native build failed with exit code $code. See MSVC/CMake diagnostics above."
          }

      - name: Verify desktop executable
        shell: pwsh
        run: |
          $exe = "D:\w\build\windows\x64\runner\Release\research_os_flutter.exe"
          if (-not (Test-Path $exe)) { throw "Desktop executable missing: $exe" }

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-windows-app-${{ env.TARGET_SHA }}
          path: D:/w/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14
