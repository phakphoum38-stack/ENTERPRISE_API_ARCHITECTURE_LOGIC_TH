name: Research OS Build Windows App

# Dedicated native build gate: no analyze/test work is duplicated here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/research_os_flutter/**"
      - ".github/workflows/01-build-windows-app.yml"
  pull_request:
    paths:
      - "apps/research_os_flutter/**"
      - ".github/workflows/01-build-windows-app.yml"

permissions:
  contents: read

concurrency:
  group: research-os-build-windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build Windows app only
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1

      - name: Purge cached secure-storage packages
        shell: pwsh
        run: |
          $hosted = Join-Path $env:PUB_CACHE "hosted\pub.dev"
          if (Test-Path $hosted) {
            Get-ChildItem $hosted -Directory -Filter "flutter_secure_storage*" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Generate Windows platform shell
        working-directory: apps/research_os_flutter
        shell: pwsh
        run: flutter create --platforms=windows --project-name=research_os_flutter .

      - name: Clean Flutter build state
        working-directory: apps/research_os_flutter
        shell: pwsh
        run: flutter clean

      - name: Install Flutter dependencies fresh
        working-directory: apps/research_os_flutter
        shell: pwsh
        run: flutter pub get

      - name: Verify Flutter plugin registration
        working-directory: apps/research_os_flutter
        shell: pwsh
        run: |
          $cmake = "windows\flutter\generated_plugins.cmake"
          $registrant = "windows\flutter\generated_plugin_registrant.cc"
          $plugin = "windows\flutter\ephemeral\.plugin_symlinks\flutter_secure_storage_windows\windows"
          $publicHeader = Join-Path $plugin "include\flutter_secure_storage_windows\flutter_secure_storage_windows_plugin.h"
          $sourceHeader = Join-Path $plugin "flutter_secure_storage_windows_plugin.h"

          $cmakeExists = Test-Path $cmake
          $registrantExists = Test-Path $registrant
          $pluginExists = Test-Path $plugin
          $publicHeaderExists = Test-Path $publicHeader
          $sourceHeaderExists = Test-Path $sourceHeader

          "cmake_exists=$cmakeExists" >> $env:GITHUB_OUTPUT
          "registrant_exists=$registrantExists" >> $env:GITHUB_OUTPUT
          "plugin_exists=$pluginExists" >> $env:GITHUB_OUTPUT
          "public_header_exists=$publicHeaderExists" >> $env:GITHUB_OUTPUT
          "source_header_exists=$sourceHeaderExists" >> $env:GITHUB_OUTPUT

          Write-Host "=== generated_plugins.cmake ==="
          if ($cmakeExists) {
            Get-Content $cmake
            if (-not (Select-String -Path $cmake -Pattern "flutter_secure_storage_windows" -Quiet)) {
              throw "flutter_secure_storage_windows missing from generated_plugins.cmake"
            }
          } else {
            throw "generated_plugins.cmake missing"
          }

          Write-Host "=== generated_plugin_registrant.cc ==="
          if ($registrantExists) {
            Get-Content $registrant
            if (-not (Select-String -Path $registrant -Pattern "flutter_secure_storage_windows" -Quiet)) {
              throw "flutter_secure_storage_windows missing from generated_plugin_registrant.cc"
            }
          } else {
            throw "generated_plugin_registrant.cc missing"
          }

          Write-Host "=== secure-storage plugin files ==="
          if (-not $pluginExists) {
            throw "flutter_secure_storage_windows plugin link missing: $plugin"
          }
          Get-ChildItem $plugin -Recurse | Select-Object FullName

          if (-not $publicHeaderExists) {
            throw "Secure-storage public header missing: $publicHeader"
          }
          if (-not $sourceHeaderExists) {
            throw "Secure-storage source header missing: $sourceHeader"
          }

          Write-Host "Secure-storage registration and headers verified."
        id: plugin-check

      - name: Record plugin diagnostics
        if: always()
        shell: pwsh
        run: |
          @"
          # Windows Plugin Diagnostics
          - commit: ${{ github.sha }}
          - flutter: $(flutter --version | Select-Object -First 1)
          - generated_plugins.cmake: ${{ steps.plugin-check.outputs.cmake_exists }}
          - generated_plugin_registrant.cc: ${{ steps.plugin-check.outputs.registrant_exists }}
          - plugin symlink: ${{ steps.plugin-check.outputs.plugin_exists }}
          - public header: ${{ steps.plugin-check.outputs.public_header_exists }}
          - source header: ${{ steps.plugin-check.outputs.source_header_exists }}
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Verify Visual Studio ATL is available
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if (-not $install) {
            throw "Visual Studio C++ ATL component is required by flutter_secure_storage_windows but is not installed on this runner."
          }
          Write-Host "ATL available at $install"

      - name: Build Windows desktop
        working-directory: apps/research_os_flutter
        shell: pwsh
        run: flutter build windows --release

      - name: Verify desktop executable
        shell: pwsh
        run: |
          $exe = "apps\research_os_flutter\build\windows\x64\runner\Release\research_os_flutter.exe"
          if (-not (Test-Path $exe)) { throw "Desktop executable missing: $exe" }

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-windows-app-${{ github.sha }}
          path: apps/research_os_flutter/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14
