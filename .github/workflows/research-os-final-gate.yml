name: Research OS Final Gate

on:
  push:
    branches:
      - feature/research-os-completion
      - feature/research-os-final-integration
      - fix/living-house-e2e
      - coord/v3.5-flex-final-gates
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Final evidence must be allowed to finish; do not cancel an in-flight gate.
concurrency:
  group: research-os-final-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  python-gate:
    name: Python build test analyze e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Research OS
        run: python -m compileall -q v3/research_os_v3 v3/tests

      - name: Run Research OS test suite
        env:
          PYTHONPATH: v3
        run: python -m unittest discover -s v3/tests -p 'test_*.py' -v

      - name: Run V3.5 recovery evidence gate
        env:
          PYTHONPATH: v3
        run: python -m unittest v3.tests.test_worker_recovery_evidence -v

      - name: Static import smoke
        env:
          PYTHONPATH: v3
        run: python -c "import research_os_v3; print('research_os_v3 import OK')"

  flutter-gate:
    name: Flutter Windows build analyze test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Canonical V3 Windows source gate
        working-directory: v3/flutter_app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          $required = @(
            'windows/CMakeLists.txt',
            'windows/runner/CMakeLists.txt',
            'windows/runner/main.cpp'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Canonical V3 Windows source missing: $path"
            }
          }
          Write-Host 'CANONICAL_V3_WINDOWS_SOURCE_GATE=PASS'

      - name: Flutter dependencies
        working-directory: v3/flutter_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: v3/flutter_app
        run: flutter analyze

      - name: Flutter tests
        working-directory: v3/flutter_app
        run: flutter test

      - name: Flutter build smoke
        working-directory: v3/flutter_app
        run: flutter build windows --release
