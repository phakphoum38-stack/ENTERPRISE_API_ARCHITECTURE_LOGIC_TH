name: Research OS Final Gate

on:
  push:
    branches:
      - feature/research-os-completion
      - feature/research-os-final-integration
      - fix/living-house-e2e
      - coord/v3.5-flex-final-gates
      - fix/friend-github-tool
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Final evidence must be allowed to finish; do not cancel an in-flight gate.
concurrency:
  group: research-os-final-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  python-gate:
    name: Python build test analyze e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Research OS
        run: python -m compileall -q v3/research_os_v3 v3/tests

      - name: Run Research OS test suite
        env:
          PYTHONPATH: v3
        run: python -m unittest discover -s v3/tests -p 'test_*.py' -v

      - name: Run V3.5 recovery evidence gate
        env:
          PYTHONPATH: v3
        run: python -m unittest v3.tests.test_worker_recovery_evidence -v

      - name: Static import smoke
        env:
          PYTHONPATH: v3
        run: python -c "import research_os_v3; print('research_os_v3 import OK')"

  flutter-gate:
    name: Flutter Windows build analyze test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate V3 Flutter source contract
        working-directory: v3/flutter_app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'pubspec.yaml' -PathType Leaf)) { throw 'V3 Flutter pubspec.yaml missing.' }
          if (-not (Test-Path 'lib' -PathType Container)) { throw 'V3 Flutter lib source missing.' }
          if (-not (Test-Path 'test' -PathType Container)) { throw 'V3 Flutter test source missing.' }
          Write-Host 'V3_FLUTTER_SOURCE_CONTRACT=PASS'

      - name: Flutter dependencies
        working-directory: v3/flutter_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: v3/flutter_app
        run: flutter analyze

      - name: Flutter tests
        working-directory: v3/flutter_app
        run: flutter test

      - name: Bootstrap isolated Windows build workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          $source = Join-Path $env:GITHUB_WORKSPACE 'v3\flutter_app'
          $work = Join-Path $env:RUNNER_TEMP 'research-os-v3-flutter-windows'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Copy-Item (Join-Path $source '*') $work -Recurse -Force
          Push-Location $work
          try {
            flutter create --platforms=windows --project-name=research_os_v3_flutter .
            if ($LASTEXITCODE -ne 0) { throw 'Isolated Flutter Windows bootstrap failed.' }
          }
          finally { Pop-Location }
          "V3_FLUTTER_WINDOWS_WORKSPACE=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Flutter Windows build smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:V3_FLUTTER_WINDOWS_WORKSPACE
          try {
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw 'Flutter pub get failed in isolated Windows workspace.' }
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows release build failed.' }
          }
          finally { Pop-Location }
          $exe = Get-ChildItem (Join-Path $env:V3_FLUTTER_WINDOWS_WORKSPACE 'build\windows') -Filter 'research_os_v3_flutter.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Research OS V3 executable was not produced.' }
          Write-Host "V3_FLUTTER_EXE=$($exe.FullName)"
