name: Research OS Resilience Nightly

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "tools/research_os_api/**"
      - "tools/research_curator/**"
      - ".github/workflows/research-os-resilience-nightly.yml"
  schedule:
    - cron: "43 19 * * *"

permissions:
  contents: read

concurrency:
  group: research-os-resilience-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    name: Retry, timeout and API resilience
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RESEARCH_OS_PROVIDER: mock
      RESEARCH_OS_DATA_DIR: ${{ runner.temp }}/ResearchOSData
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Research OS API regression tests
        run: python -m unittest discover -s tools/research_os_api -p "test_*.py" -v

      - name: Simulate transient Gemini 503 then recovery
        working-directory: tools/research_os_api
        run: |
          python - <<'PY'
          import io
          import urllib.error
          from unittest.mock import patch
          import providers

          class FakeResponse:
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def read(self): return b'{"ok": true}'

          attempts={'n': 0}
          def fake_urlopen(request, timeout=60):
              attempts['n'] += 1
              if attempts['n'] < 3:
                  raise urllib.error.HTTPError(
                      request.full_url, 503, 'busy', {}, io.BytesIO(b'{"error":"busy"}')
                  )
              return FakeResponse()

          with patch.object(providers.urllib.request, 'urlopen', side_effect=fake_urlopen), \
               patch.object(providers.time, 'sleep', return_value=None):
              payload=providers._post_json('https://example.invalid', {'x': 1}, {'Content-Type':'application/json'})

          assert payload == {'ok': True}, payload
          assert attempts['n'] == 3, attempts
          print('503 retry and recovery passed.')
          PY

      - name: Verify non-retryable provider error fails immediately
        working-directory: tools/research_os_api
        run: |
          python - <<'PY'
          import io
          import urllib.error
          from unittest.mock import patch
          import providers

          attempts={'n': 0}
          def fake_urlopen(request, timeout=60):
              attempts['n'] += 1
              raise urllib.error.HTTPError(
                  request.full_url, 400, 'bad request', {}, io.BytesIO(b'{"error":"bad"}')
              )

          try:
              with patch.object(providers.urllib.request, 'urlopen', side_effect=fake_urlopen), \
                   patch.object(providers.time, 'sleep', return_value=None):
                  providers._post_json('https://example.invalid', {'x': 1}, {})
          except providers.ProviderError:
              pass
          else:
              raise SystemExit('Expected ProviderError')

          assert attempts['n'] == 1, attempts
          print('Non-retryable 400 fails immediately.')
          PY

      - name: Inject local storage failure
        working-directory: tools/research_os_api
        run: |
          python - <<'PY'
          from pathlib import Path
          from unittest.mock import patch
          from v2_observability import storage_readiness

          with patch.object(Path, 'mkdir', side_effect=PermissionError('injected storage denial')):
              state = storage_readiness('/tmp/research-os-injected-denial')
          assert state['ready'] is False, state
          assert state['writable'] is False, state
          assert state['error'] == 'PermissionError', state
          print('Storage failure injection reported unavailable without crashing.')
          PY

      - name: Inject runtime interruption and verify durable resume
        working-directory: tools/research_os_api
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from agent_orchestrator import AgentOrchestrator
          from agent_runtime import AgentEventBus, AgentTaskQueue, SharedContextStore

          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              state=root/'agents'/'orchestrations.json'
              runtime=AgentTaskQueue(event_bus=AgentEventBus(), context_store=SharedContextStore(tmp))
              orchestrator=AgentOrchestrator(runtime=runtime, storage_path=state)
              run=orchestrator.create_run('runtime interruption injection', [{
                  'step_id':'research',
                  'objective':'research runtime interruption evidence',
                  'requested_agent':'research',
              }])
              run_id=run['run_id']

              payload=json.loads(state.read_text(encoding='utf-8'))
              payload['runs'][0]['status']='running'
              payload['runs'][0]['steps'][0]['status']='running'
              payload['runs'][0]['steps'][0]['task_id']='injected-stale-task'
              state.write_text(json.dumps(payload), encoding='utf-8')

              recovered=AgentOrchestrator(
                  runtime=AgentTaskQueue(event_bus=AgentEventBus(), context_store=SharedContextStore(tmp)),
                  storage_path=state,
              )
              interrupted=recovered.get(run_id)
              assert interrupted['status']=='interrupted', interrupted
              assert interrupted['steps'][0]['status']=='planned', interrupted
              completed=recovered.execute(run_id)
              assert completed['run_id']==run_id, completed
              assert completed['status']=='completed', completed
              print('Injected runtime interruption recovered and resumed:', run_id)
          PY

      - name: Verify diagnostics redaction under injected secrets
        working-directory: tools/research_os_api
        env:
          RESEARCH_OS_TEST_TOKEN: never-print-this-value
        run: |
          python - <<'PY'
          import json
          from v2_observability import diagnostics_bundle
          text=json.dumps(diagnostics_bundle(), sort_keys=True)
          assert 'never-print-this-value' not in text
          assert '[REDACTED]' in text
          print('Diagnostics secret redaction passed.')
          PY

      - name: Verify retry policy bounds
        working-directory: tools/research_os_api
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('providers.py').read_text(encoding='utf-8')
          assert 'max_attempts = 4' in text
          assert 'min(delay, 8.0)' in text
          print('Retry attempts and backoff cap are bounded.')
          PY

      - name: Write resilience summary
        if: always()
        run: |
          {
            echo "# Research OS Resilience V2"
            echo "- API regression suite: executed"
            echo "- Provider 503 recovery and non-retryable behavior: tested"
            echo "- Local storage failure injection: tested"
            echo "- Runtime interruption and durable resume: tested"
            echo "- Diagnostics secret redaction: tested"
            echo "- Retry/backoff bounds: verified"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
