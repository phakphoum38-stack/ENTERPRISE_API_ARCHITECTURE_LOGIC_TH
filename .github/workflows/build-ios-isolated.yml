name: Research OS Build iOS Isolated

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: research-os-ios-isolated-${{ inputs.target_ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned iOS app bundle and IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || 'main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform shell
        working-directory: apps/research_os_flutter
        run: flutter create --platforms=ios --project-name=research_os_flutter .

      - name: Enable iOS local network API access
        shell: python
        run: |
          import plistlib
          from pathlib import Path
          path = Path('apps/research_os_flutter/ios/Runner/Info.plist')
          with path.open('rb') as f:
              data = plistlib.load(f)
          data['NSLocalNetworkUsageDescription'] = (
              'Research OS searches your local network for a Research OS API endpoint and reconnects automatically.'
          )
          ats = data.setdefault('NSAppTransportSecurity', {})
          ats['NSAllowsLocalNetworking'] = True
          with path.open('wb') as f:
              plistlib.dump(data, f, sort_keys=False)

      - name: Install dependencies
        working-directory: apps/research_os_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/research_os_flutter
        run: flutter analyze

      - name: Test
        working-directory: apps/research_os_flutter
        run: flutter test

      - name: Build unsigned iOS release
        working-directory: apps/research_os_flutter
        run: flutter build ios --release --no-codesign

      - name: Stage unsigned IPA and app bundle
        run: |
          mkdir -p dist/ios/Payload
          APP_PATH="apps/research_os_flutter/build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" dist/ios/Payload/ResearchOS.app
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/ios/Research-OS-iOS-app-unsigned.zip
          (cd dist/ios && zip -qry Research-OS-iOS-unsigned.ipa Payload)
          rm -rf dist/ios/Payload
          shasum -a 256 dist/ios/Research-OS-iOS-unsigned.ipa dist/ios/Research-OS-iOS-app-unsigned.zip > dist/ios/SHA256SUMS.txt

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-ios-unsigned-${{ github.run_id }}
          path: dist/ios/**
          if-no-files-found: error
          retention-days: 14
