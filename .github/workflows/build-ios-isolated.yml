name: Research OS Build iOS Isolated

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: research-os-ios-isolated-${{ inputs.target_ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || 'main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform shell
        working-directory: apps/research_os_flutter
        run: flutter create --platforms=ios --project-name=research_os_flutter .

      - name: Install dependencies
        working-directory: apps/research_os_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/research_os_flutter
        run: flutter analyze

      - name: Test
        working-directory: apps/research_os_flutter
        run: flutter test

      - name: Build unsigned iOS release
        working-directory: apps/research_os_flutter
        run: flutter build ios --release --no-codesign

      - name: Stage unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ios
          APP_PATH="apps/research_os_flutter/build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"

          PAYLOAD="$RUNNER_TEMP/ipa/Payload"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_PATH" "$PAYLOAD/ResearchOS.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/ios/Research-OS-iOS-unsigned.ipa" Payload)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/ios/Research-OS-iOS-unsigned-app.zip
          (cd dist/ios && shasum -a 256 Research-OS-iOS-unsigned.ipa Research-OS-iOS-unsigned-app.zip > SHA256SUMS.txt)

          cat > dist/ios/INSTALLATION.txt <<'EOF'
          Research-OS-iOS-unsigned.ipa is intentionally unsigned.
          Import it into a compatible sideload installer/signing app and sign it with your own Apple ID or developer certificate before installation.
          EOF

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-ios-unsigned-${{ github.run_id }}
          path: dist/ios/**
          if-no-files-found: error
          retention-days: 14
