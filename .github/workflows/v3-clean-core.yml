name: Research OS V3 Clean Core

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/v3-clean
      - agent/v3-full-system-10x10
    paths:
      - 'v3/**'
      - 'owner_special/research_os_friend/**'
      - '.github/workflows/v3-clean-core.yml'

permissions:
  contents: read

concurrency:
  group: v3-clean-core-windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-core:
    name: Core validation (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate V3 Python core
        working-directory: v3
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'V3 unit tests failed' }
          python scripts/provider_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'V3 provider smoke failed' }
          python scripts/service_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'V3 local service smoke failed' }
          python scripts/storage_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'V3 storage smoke failed' }
          python scripts/factory_execution_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'V3 factory execution smoke failed' }

      - name: Build V3 Windows ServiceHost
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'v3-service-host'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish v3/windows_service/ResearchOS.V3.ServiceHost.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -o $out
          if ($LASTEXITCODE -ne 0) { throw 'V3 Windows ServiceHost publish failed' }
          $exe = Join-Path $out 'ResearchOS.V3.ServiceHost.exe'
          if (-not (Test-Path $exe)) { throw "ServiceHost executable not found: $exe" }
          Write-Host "ServiceHost SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Build and test V3 Flutter Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'v3\flutter_app'
          $work = 'D:\v3coreflutter'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Copy-Item (Join-Path $source '*') $work -Recurse -Force
          Push-Location $work
          try {
            flutter create --platforms=windows --project-name=research_os_v3_flutter .
            if ($LASTEXITCODE -ne 0) { throw 'flutter create failed' }
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed' }
            flutter analyze
            if ($LASTEXITCODE -ne 0) { throw 'flutter analyze failed' }
            flutter test
            if ($LASTEXITCODE -ne 0) { throw 'flutter test failed' }
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows release build failed' }
          }
          finally {
            Pop-Location
          }
          $exe = Join-Path $work 'build\windows\x64\runner\Release\research_os_v3_flutter.exe'
          if (-not (Test-Path $exe)) { throw "V3 Flutter executable not found: $exe" }
          Write-Host "Flutter SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Mark Windows core validation passed
        shell: pwsh
        run: |
          Write-Host 'Research OS V3 Windows Core: SUCCESS'
          Write-Host 'Ubuntu validation is owned by Research OS V3 Ubuntu Build.'
