name: Research OS V3 Clean Core

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/v3-clean
    paths:
      - 'v3/**'
      - '.github/workflows/v3-clean-core.yml'

permissions:
  contents: read

concurrency:
  group: v3-clean-core-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  core-validation:
    name: Core validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 8
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Flutter
        if: runner.os == 'Windows'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Initialize incremental evidence
        working-directory: v3
        run: python scripts/evidence.py --output evidence/progress.json --stage initialized --status passed --data '{"sha":"${{ github.sha }}","os":"${{ runner.os }}"}'

      - name: Run V3 Clean unit tests
        working-directory: v3
        run: |
          python -m unittest discover -s tests -v
          python scripts/evidence.py --output evidence/progress.json --stage unit_tests --status passed

      - name: Run provider adapter smoke
        working-directory: v3
        run: |
          python scripts/provider_smoke.py
          python scripts/evidence.py --output evidence/progress.json --stage provider_adapter --status passed --data '{"secret_exposed":false,"transport":"fake-no-network"}'

      - name: Run V3 local service smoke
        working-directory: v3
        run: |
          python scripts/service_smoke.py
          python scripts/evidence.py --output evidence/progress.json --stage local_service --status passed --data '{"binding":"127.0.0.1","contract":"v3","max_capacity":46656,"structured_http_audit":true}'

      - name: Validate V3 data ownership
        working-directory: v3
        run: |
          python scripts/storage_smoke.py
          python scripts/evidence.py --output evidence/progress.json --stage data_ownership --status passed --data '{"idempotent":true,"preserves_existing_data":true,"secret_storage":"excluded"}'

      - name: Build V3 Windows ServiceHost
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'v3-service-host'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish v3/windows_service/ResearchOS.V3.ServiceHost.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -o $out
          if ($LASTEXITCODE -ne 0) { throw 'V3 Windows ServiceHost publish failed' }

          $exe = Join-Path $out 'ResearchOS.V3.ServiceHost.exe'
          if (-not (Test-Path $exe)) { throw "ServiceHost executable not found: $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          $data = @{ exe_sha256 = $hash; exe_size = $size } | ConvertTo-Json -Compress
          python v3/scripts/evidence.py --output v3/evidence/progress.json --stage windows_service_host_build --status passed --data $data

      - name: Validate V3 Windows Service lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'ResearchOSV3CleanCI'
          $exe = Join-Path $env:RUNNER_TEMP 'v3-service-host\ResearchOS.V3.ServiceHost.exe'
          $root = (Resolve-Path 'v3').Path
          $python = (Get-Command python).Source
          $dataDir = Join-Path $env:RUNNER_TEMP 'research-os-v3-service-data'
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()

          $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($existing) {
            if ($existing.Status -ne 'Stopped') { Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue }
            sc.exe delete $serviceName | Out-Null
            Start-Sleep -Seconds 1
          }

          $binaryPath = "`"$exe`" --root `"$root`" --python `"$python`" --port $port --data-dir `"$dataDir`" --service-name `"$serviceName`""
          $validated = $false
          $marker = Join-Path $dataDir 'sessions\service-preservation.marker'
          try {
            New-Service -Name $serviceName -BinaryPathName $binaryPath -StartupType Manual | Out-Null
            Start-Service -Name $serviceName

            $health = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -TimeoutSec 2
                if ($health.status -eq 'ok') { break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $health -or $health.status -ne 'ok') {
              $outLog = Join-Path $dataDir 'logs\service.out.log'
              $errLog = Join-Path $dataDir 'logs\service.err.log'
              if (Test-Path $outLog) { Get-Content $outLog -ErrorAction SilentlyContinue }
              if (Test-Path $errLog) { Get-Content $errLog -ErrorAction SilentlyContinue }
              throw 'Windows ServiceHost did not expose /health'
            }

            foreach ($name in @('sessions','database','artifacts','logs','evidence')) {
              if (-not (Test-Path (Join-Path $dataDir $name) -PathType Container)) {
                throw "Owned V3 data directory was not created: $name"
              }
            }
            Set-Content -Path $marker -Value 'preserve-me' -Encoding utf8

            $master = Invoke-RestMethod -Uri "http://127.0.0.1:$port/v3/master?tasks=30" -TimeoutSec 5
            if ($master.contract -ne 'unified-master-orchestrator-v3-clean') { throw 'Unexpected V3 master contract' }
            if ($master.scale -ne '6^3' -or [int]$master.maximum_leaf_capacity -ne 216) { throw 'Unexpected V3 adaptive scale result' }

            $providers = Invoke-RestMethod -Uri "http://127.0.0.1:$port/v3/providers" -TimeoutSec 5
            if (-not $providers.providers -or $providers.providers[0].secret_exposed -ne $false) {
              throw 'Provider status contract is missing or exposes a secret'
            }

            $listeners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction Stop)
            if ($listeners.Count -lt 1) { throw 'V3 service has no listening socket' }
            $badListener = $listeners | Where-Object { $_.LocalAddress -ne '127.0.0.1' }
            if ($badListener) { throw 'V3 Windows Service is not loopback-only' }

            $data = @{
              service_name = $serviceName
              binding = '127.0.0.1'
              port = $port
              health = 'ok'
              master_contract = $master.contract
              observed_scale = $master.scale
              observed_capacity = [int]$master.maximum_leaf_capacity
              secret_exposed = $false
              data_layout = @('sessions','database','artifacts','logs','evidence')
            } | ConvertTo-Json -Compress
            python v3/scripts/evidence.py --output v3/evidence/progress.json --stage windows_service_lifecycle --status passed --data $data
            $validated = $true
          }
          finally {
            $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Stopped') {
              Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
              try { $svc.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(15)) } catch { }
            }
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              sc.exe delete $serviceName | Out-Null
              Start-Sleep -Seconds 1
            }
            $leftovers = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            foreach ($connection in $leftovers) {
              Stop-Process -Id $connection.OwningProcess -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not $validated) { throw 'V3 Windows Service lifecycle validation did not complete' }
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) { throw 'V3 Windows Service was not removed' }
          if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) { throw 'V3 service listener remained after cleanup' }
          if (-not (Test-Path $marker)) { throw 'V3 data was not preserved after service removal' }
          if ((Get-Content $marker -Raw).Trim() -ne 'preserve-me') { throw 'V3 preserved data changed during service lifecycle' }
          python v3/scripts/evidence.py --output v3/evidence/progress.json --stage windows_service_cleanup --status passed --data '{"service_removed":true,"listener_removed":true,"data_preserved":true}'

      - name: Build and test V3 Flutter desktop shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'v3\flutter_app'
          $work = 'D:\v3flutter'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Copy-Item (Join-Path $source '*') $work -Recurse -Force

          Push-Location $work
          try {
            flutter create --platforms=windows --project-name=research_os_v3_flutter .
            if ($LASTEXITCODE -ne 0) { throw 'flutter create failed' }
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed' }
            flutter analyze
            if ($LASTEXITCODE -ne 0) { throw 'flutter analyze failed' }
            flutter test
            if ($LASTEXITCODE -ne 0) { throw 'flutter test failed' }
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows release build failed' }
          }
          finally {
            Pop-Location
          }

          $appExe = Join-Path $work 'build\windows\x64\runner\Release\research_os_v3_flutter.exe'
          if (-not (Test-Path $appExe)) { throw "V3 Flutter executable not found: $appExe" }
          $hash = (Get-FileHash $appExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $appExe).Length
          "V3_FLUTTER_EXE=$appExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $data = @{ exe_sha256 = $hash; exe_size = $size; executable = 'research_os_v3_flutter.exe' } | ConvertTo-Json -Compress
          python v3/scripts/evidence.py --output v3/evidence/progress.json --stage flutter_desktop_build --status passed --data $data

      - name: Validate real Flutter app to V3 service E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:V3_FLUTTER_EXE)) { throw 'V3 Flutter EXE is missing before E2E' }

          $dataDir = Join-Path $env:RUNNER_TEMP 'research-os-v3-app-e2e'
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $audit = Join-Path $dataDir 'logs\http-audit.jsonl'
          $env:RESEARCH_OS_V3_DATA_DIR = $dataDir
          $env:RESEARCH_OS_V3_HOST = '127.0.0.1'
          $env:RESEARCH_OS_V3_PORT = '8788'

          $service = $null
          $app = $null
          try {
            $service = Start-Process -FilePath (Get-Command python).Source `
              -ArgumentList @('v3/scripts/run_service.py') `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -PassThru `
              -WindowStyle Hidden

            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8788/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'V3 service did not become ready for Flutter E2E' }

            New-Item -ItemType Directory -Path (Split-Path $audit -Parent) -Force | Out-Null
            Set-Content -Path $audit -Value '' -Encoding utf8

            $app = Start-Process -FilePath $env:V3_FLUTTER_EXE -PassThru
            $proved = $false
            $observed = @()
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              if (Test-Path $audit) {
                $observed = @(
                  Get-Content $audit -ErrorAction SilentlyContinue |
                    Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                    ForEach-Object { $_ | ConvertFrom-Json }
                )
                $healthSeen = @($observed | Where-Object {
                  $_.method -eq 'GET' -and $_.path -eq '/health' -and [int]$_.status -eq 200
                }).Count -gt 0
                $providersSeen = @($observed | Where-Object {
                  $_.method -eq 'GET' -and $_.path -eq '/v3/providers' -and [int]$_.status -eq 200
                }).Count -gt 0
                if ($healthSeen -and $providersSeen) {
                  $proved = $true
                  break
                }
              }
              if ($app.HasExited) { break }
              Start-Sleep -Milliseconds 250
            }

            if (-not $proved) {
              if (Test-Path $audit) { Get-Content $audit -ErrorAction SilentlyContinue }
              throw 'V3 Flutter EXE did not prove startup requests to /health and /v3/providers'
            }

            $auditText = Get-Content $audit -Raw
            if ($auditText -match '(?i)authorization|bearer|api[_-]?key|token|secret') {
              throw 'Structured HTTP audit contains credential-like fields'
            }
            foreach ($entry in $observed) {
              $propertyNames = @($entry.PSObject.Properties.Name | Sort-Object)
              if (($propertyNames -join ',') -ne 'method,path,status,timestamp') {
                throw "Unexpected structured audit fields: $($propertyNames -join ',')"
              }
            }

            $data = @{
              executable = 'research_os_v3_flutter.exe'
              health = 200
              providers = 200
              audit_format = 'jsonl'
              audit_secret_fields = $false
            } | ConvertTo-Json -Compress
            python v3/scripts/evidence.py --output v3/evidence/progress.json --stage flutter_app_to_service_e2e --status passed --data $data
          }
          finally {
            if ($app -and -not $app.HasExited) {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            }
            if ($service -and -not $service.HasExited) {
              Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue
            }
            $leftovers = @(Get-NetTCPConnection -LocalPort 8788 -State Listen -ErrorAction SilentlyContinue)
            foreach ($connection in $leftovers) {
              Stop-Process -Id $connection.OwningProcess -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Run V3 Clean smoke test
        working-directory: v3
        run: |
          python scripts/smoke.py
          python scripts/evidence.py --output evidence/progress.json --stage core_smoke --status passed --data '{"max_capacity":46656,"assistant_6x3_capacity":216}'

      - name: Mark core validation passed
        working-directory: v3
        run: python scripts/evidence.py --output evidence/progress.json --stage core_validation --status passed

      - name: Upload incremental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-clean-evidence-${{ runner.os }}-${{ github.sha }}
          path: v3/evidence/progress.json
          if-no-files-found: warn
