name: Research OS New GUI Modular Check

on:
  push:
    branches:
      - 'work/research-os-new-gui-modular'
    paths:
      - 'apps/research_os_flutter/**'
      - 'tools/research_os_api/**'
      - '.github/workflows/research-os-new-gui-modular-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-os-new-gui-modular-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modular-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registry API facade
        working-directory: tools/research_os_api
        run: |
          python -m compileall -q .
          python -m unittest test_agent_server.py -v

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/research_os_flutter
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: apps/research_os_flutter
        run: flutter analyze

      - name: Run modular GUI tests
        working-directory: apps/research_os_flutter
        run: |
          flutter test test/research_os_module_catalog_test.dart
          flutter test test/new_gui_shell_test.dart
          flutter test test/registry_module_page_test.dart
          flutter test test/chat_flow_test.dart
          flutter test test/desktop_shell_test.dart
