name: Research OS Build Installer

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to package
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build-installer:
    name: Build Setup EXE from verified components
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Set up Python runtime for bundling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve matching component runs
        id: runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $appRun = $null
          $serviceRun = $null
          for ($i = 0; $i -lt 30; $i++) {
            if (-not $appRun) {
              $appRun = gh run list --repo "${{ github.repository }}" --workflow "Research OS Build Windows App" --commit "$env:TARGET_SHA" --status success --limit 20 --json databaseId --jq '.[0].databaseId'
            }
            if (-not $serviceRun) {
              $serviceRun = gh run list --repo "${{ github.repository }}" --workflow "Research OS Build Service Host" --commit "$env:TARGET_SHA" --status success --limit 20 --json databaseId --jq '.[0].databaseId'
            }
            if ($appRun -and $serviceRun) { break }
            Start-Sleep -Seconds 10
          }
          if (-not $appRun) { throw "No successful Windows app run found for $env:TARGET_SHA" }
          if (-not $serviceRun) { throw "No successful ServiceHost run found for $env:TARGET_SHA" }
          "app_run=$appRun" >> $env:GITHUB_OUTPUT
          "service_run=$serviceRun" >> $env:GITHUB_OUTPUT

      - name: Download Windows app artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build-input/app | Out-Null
          gh run download "${{ steps.runs.outputs.app_run }}" --repo "${{ github.repository }}" --name "research-os-windows-app-$env:TARGET_SHA" --dir build-input/app
          if (-not (Test-Path "build-input/app/research_os_flutter.exe")) { throw "Windows app artifact is incomplete" }

      - name: Download ServiceHost artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build-input/service | Out-Null
          gh run download "${{ steps.runs.outputs.service_run }}" --repo "${{ github.repository }}" --name "research-os-service-host-$env:TARGET_SHA" --dir build-input/service
          if (-not (Test-Path "build-input/service/ResearchOS.ServiceHost.exe")) { throw "ServiceHost artifact is incomplete" }

      - name: Stage one-click installer package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "installer\package"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          New-Item -ItemType Directory -Force -Path "$package\app" | Out-Null
          Copy-Item "build-input\app\*" "$package\app" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$package\tools\research_os_service\publish" | Out-Null
          Copy-Item "build-input\service\*" "$package\tools\research_os_service\publish" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$package\tools\research_os_api" | Out-Null
          Copy-Item "tools\research_os_api\*.py" "$package\tools\research_os_api" -Force
          New-Item -ItemType Directory -Force -Path "$package\tools\research_curator" | Out-Null
          Copy-Item "tools\research_curator\*" "$package\tools\research_curator" -Recurse -Force
          if (Test-Path "apps\research_os_web") {
            New-Item -ItemType Directory -Force -Path "$package\apps\research_os_web" | Out-Null
            Copy-Item "apps\research_os_web\*" "$package\apps\research_os_web" -Recurse -Force
          }
          if (Test-Path "research\artifacts") {
            New-Item -ItemType Directory -Force -Path "$package\research\artifacts" | Out-Null
            Copy-Item "research\artifacts\*" "$package\research\artifacts" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "$package\scripts" | Out-Null
          Copy-Item "scripts\*research-os*.ps1" "$package\scripts" -Force
          $pythonRoot = (python -c "import sys; print(sys.base_prefix)").Trim()
          if (-not (Test-Path "$pythonRoot\python.exe")) { throw "Python runtime root not found: $pythonRoot" }
          New-Item -ItemType Directory -Force -Path "$package\runtime\python" | Out-Null
          Copy-Item "$pythonRoot\*" "$package\runtime\python" -Recurse -Force
          if (-not (Test-Path "$package\runtime\python\python.exe")) { throw "Bundled Python runtime missing" }
          if (-not (Test-Path "$package\app\research_os_flutter.exe")) { throw "Desktop executable missing from package" }
          if (-not (Test-Path "$package\tools\research_os_service\publish\ResearchOS.ServiceHost.exe")) { throw "ServiceHost missing from package" }

      - name: Generate installer branding assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply-research-os-branding.py --app-root apps/research_os_flutter --platform windows
          if (-not (Test-Path "apps\research_os_flutter\assets\branding\research_os.ico")) {
            throw "Research OS installer icon was not generated"
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Research OS Setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\research-os.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem "installer\output\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Research OS Setup EXE was not produced" }
          Write-Host "Installer: $($setup.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-installer-${{ env.TARGET_SHA }}
          path: installer/output/Research-OS-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch installer validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 05-installer-validation.yml --repo "${{ github.repository }}" --ref main -f target_sha="$env:TARGET_SHA" -f source_installer_run="${{ github.run_id }}"
