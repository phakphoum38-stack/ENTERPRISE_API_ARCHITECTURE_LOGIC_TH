🔍 การวิเคราะห์สาเหตุ (Root Cause Analysis)
เวิร์กโฟลว์ได้รันไฟล์โปรแกรมที่ติดตั้งแล้ว (research_os_flutter.exe) และคอยตรวจสอบไฟล์บันทึก (Log) ของบริการที่ %ProgramData%\ResearchOS\logs\service-api.err.log โดยรอให้เกิดเงื่อนไข 2 ข้อ:

พบ path=/health หรือ "GET /health HTTP/1.[01]" 200

พบ path=/v1/providers หรือ "GET /v1/providers HTTP/1.[01]" 200

ข้อผิดพลาดเกิดขึ้นเนื่องจาก แอป Flutter ไม่ได้ส่ง Request ไปยัง /v1/providers (หรือทั้งสอง Endpoint) ภายในเวลาที่กำหนด (60 วินาที) ทำให้คำสั่ง throw ทำงานและสั่งให้การทดสอบล้มเหลว

🛠️ สาเหตุที่พบได้บ่อยและการแก้ไข
1. เส้นทาง Endpoint ไม่ตรงกัน (/v1/providers กับ /v2/brain/providers)
ในช่วงก่อนหน้าของสคริปต์ เวิร์กโฟลว์เรียกใช้ API ผ่าน URL นี้:

PowerShell
$providers = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v2/brain/providers"
แต่ตัวตรวจสอบ Regex ในขั้นตอน E2E กลับรอตรวจหา /v1/providers:

PowerShell
$sawProviders = $requestLog -match '(?m)(?:\bpath=/v1/providers(?:\s|$)|"GET /v1/providers HTTP/1\.[01]" 200)'
วิธีแก้: หากเปลี่ยนเส้นทาง API Router จาก v1 เป็น v2 แล้ว (เช่น /v2/brain/providers) ให้ปรับแก้ไขโค้ดฝั่ง Flutter Client หรือแก้ไข Regex ในสคริปต์เวิร์กโฟลว์ให้ตรงกับ Route จริง

2. รูปแบบข้อความใน Log ไม่ตรงกัน หรือ Log บันทึกล่าช้า
การทดสอบจะตรวจสอบไฟล์ $serviceLog (service-api.err.log) ด้วย Regex ที่ค่อนข้างเข้มงวด หากมีการเปลี่ยนรูปแบบ Log หรือเกิดปัญหา Log Buffering (ไม่อัปเดตไฟล์ทันที) จะทำให้ตรวจไม่พบข้อความตามเวลาที่กำหนด

วิธีแก้: ตรวจสอบให้มั่นใจว่า Stream ของ Log (stdout/stderr) มีการเขียนลงไฟล์ทันทีโดยไม่ค้างใน Buffering (autoflush=True ใน Python หรือตั้งค่า Unbuffered Logging ใน .NET)

3. แอป Flutter ค้าง หรือ Crash แบบเงียบๆ
เวลาสั่งรันแอป Flutter ในระบบ CI (ซึ่งไม่มีหน้าจอ UI จริง) ตัวแอปอาจจะค้าง หรือเกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย Loopback

วิธีแก้: ตรวจสอบผลลัพธ์ใน Log ช่วงก่อนเกิด Exception (สคริปต์มีการพิมพ์ Get-Content $serviceLog -Tail 100 ออกมาเมื่อล้มเหลว) เพื่อดูว่าแอป Flutter แจ้งปัญหาเกี่ยวกับ UI หรือ HTTP Error Code อื่นๆ หรือไม่

