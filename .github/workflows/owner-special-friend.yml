This is a complete GitHub Actions workflow file (.github/workflows/research-os-candidate.yml) written in YAML, designed for continuous integration, building, testing, packaging, and end-to-end (E2E) validation of the Research OS application on Windows.

Here is a breakdown of what this workflow does:

1. Trigger & Permissions
Trigger: workflow_dispatch allows manual triggering with an optional input parameter: target_sha (the specific Git commit SHA to build and test).

Concurrency: Ensures that multiple runs for the same target SHA don't interfere with each other (cancel-in-progress: false).

Permissions: Read access to repository contents.

2. Environment Setup
Runs on a Windows runner (windows-latest) with a 60-minute timeout.

Sets environment variables for mock AI providers and candidate keys.

Enables Git / Windows Long Paths (core.longpaths and LongPathsEnabled registry key) to prevent path length issues during builds.

Sets up tools: Python 3.12, .NET 8.0, Flutter (stable channel), and Inno Setup (via Chocolatey).

3. Build & Test Pipeline Stages
API & Software Factory Unit Tests:

Runs Python compilation checks and executes unit tests for tools/research_os_api and software_factory.

Flutter Desktop App Build:

Copies the Flutter project to a short path (D:\w) to avoid path depth limits.

Runs branding scripts, flutter analyze, flutter test, and builds the Windows release executable (research_os_flutter.exe).

Service Host Build:

Publishes the .NET service host (ResearchOS.ServiceHost.exe) as a self-contained, single-file win-x64 executable.

Runtime & Windows Service Smoke Tests:

Launches the API backend on 127.0.0.1:8787 and verifies endpoints (/health, /v2/master).

Installs, tests, and uninstalls the Windows Service (ResearchOSService).

Installer Packaging & Generation:

Stages all components (Flutter app, .NET service, Python tools, runtime, branding icons, scripts) into an installer structure.

Uses Inno Setup (ISCC.exe) to compile the single installer executable (Research-OS-Setup-*-x64.exe).

Clean Installation, Upgrade & Data Preservation Testing:

Runs a silent clean installation (/VERYSILENT).

Verifies data preservation scripts, readiness endpoints, loopback network bindings (127.0.0.1), and credential redaction logs.

Launches the installed Flutter app and verifies app-to-service interaction.

Performs an in-place upgrade test and a clean uninstallation test, ensuring system data is preserved correctly.

4. Artifact Publishing & Cleanup
Evidence Manifest: Generates a complete candidate-manifest.json and SHA256SUMS.txt documenting all build metrics, stages, and SHA256 hashes.

Artifact Uploads: Uploads the installer package and progress evidence via actions/upload-artifact@v4.

Cleanup: Stops background processes, removes created Windows services, and frees bound network ports.

