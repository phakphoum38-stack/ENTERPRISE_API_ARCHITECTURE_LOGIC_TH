installer พยายามเขียนทับ/ลบไฟล์ python.exe ในโฟลเดอร์ runtime แต่ ไฟล์นั้นกำลังถูกใช้งานอยู่ (File Locked) โดย Process อื่นในระบบ ทำให้ Inno Setup ติดข้อผิดพลาด Access is denied (Code 5) และเมื่อรันแบบ /VERYSILENT มันจึงเลือก Abort และ Rollback การติดตั้งอัตโนมัติ

🛠️ สาเหตุที่ python.exe ค้างอยู่
Service หรือ Background Process ยังไม่ถูก Kill ทราบชัดเจน:

ตัว Windows Service (ResearchOSOwnerFriendService) หรือ Process ย่อยที่ถูกเรียกผ่าน Python (เช่น API Server / background worker) ยังรันค้างอยู่และใช้ python.exe จากไดเรกทอรี C:\Program Files\...

การสั่ง Stop Service ไม่ได้รอให้ Child Processes ปิดตัวลงอย่างสมบูรณ์:

ถึงแม้ Service หลักจะบอกว่า Status: Stopped แต่มักจะมี Child Process ของ Python ที่แยกออกมา (Detached/Orphaned) ค้างอยู่ใน Process Tree

💡 แนวทางการแก้ไข
1. สั่ง Kill Process Python/Service ทั้งหมดก่อนรัน Upgrade
ในสคริปต์ PowerShell ช่วงเตรียมการ In-Place Upgrade ให้เพิ่มขั้นตอนบังคับปิด Process ที่รันจากโฟลเดอร์นั้นอย่างเด็ดขาด:

PowerShell
# ปิด Service ก่อน
if (Get-Service ResearchOSOwnerFriendService -ErrorAction SilentlyContinue) {
    Stop-Service ResearchOSOwnerFriendService -Force -ErrorAction SilentlyContinue
}

# บังคับ Kill process ทุกตัวที่รัน python.exe หรือรันจากโฟลเดอร์ Program Files ของแอป
Get-Process | Where-Object { 
    $_.Path -like "*Research OS Owner Special*" -or 
    ($_.Name -eq "python" -and $_.Path -like "*runtime\python*")
} | Stop-Process -Force -ErrorAction SilentlyContinue

# รอตอบสนองสักครู่ให้ OS เคลียร์ File Lock
Start-Sleep -Seconds 2
2. ปรับแต่งไฟล์ Inno Setup Script (.iss)
เพิ่มการสั่งปิด Service หรือแอปพลิเคชันผ่าน Inno Setup โดยตรงก่อนที่กระบวนการคัดลอกไฟล์จะเริ่มขึ้น โดยใช้ directive หรือ Code block:

ข้อมูลโค้ด
[Setup]
; ปิดแอปพลิเคชันอัตโนมัติหากพบว่ากำลังรันอยู่
CloseApplications=yes
RestartApplications=no
CloseApplicationsFilter=*python.exe

[InstallDelete]
; หรือปิด service ในช่วงก่อนลงไฟล์
หรือเพิ่มในส่วน [Run] / [Code] ให้เรียก sc.exe stop หรือ taskkill /F /IM python.exe ก่อนขั้นตอนคัดลอกไฟล์ (ssInstall)

