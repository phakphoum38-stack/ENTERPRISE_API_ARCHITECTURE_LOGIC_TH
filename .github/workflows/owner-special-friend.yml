name: Owner Special Friend Complete

on:
  push:
    branches: ['main', 'owner-special/**', 'debug/owner-installer-guard']
    paths:
      - 'owner_special/**'
      - 'v3/research_os_v3/**'
      - '.github/workflows/owner-special-friend.yml'
  pull_request:
    paths:
      - 'owner_special/**'
      - 'v3/research_os_v3/**'
      - '.github/workflows/owner-special-friend.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  friend-complete:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify target SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$ACTUAL_SHA"
          echo "TARGET_SHA=$TARGET_SHA"

      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Compile Owner and V3 Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q owner_special v3
      - name: Run Owner Special tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s owner_special/tests -p 'test_*.py' -v
      - name: Run V3 tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=v3 python -m unittest discover -s v3/tests -p 'test_*.py' -v
      - name: Emit exact SHA evidence
        run: |
          echo "OWNER_SPECIAL_TARGET_SHA=$TARGET_SHA"
          echo "OWNER_SPECIAL_SHA_GATE=PASS"
