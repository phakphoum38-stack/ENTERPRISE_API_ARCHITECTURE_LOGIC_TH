-Phase upgrade (ทดสอบ In-place Upgrade — จุดที่เคยล้มเหลวเพราะ python.exe ค้าง)

-Phase uninstall (ทดสอบ ถอนการติดตั้ง)

อัปโหลดตัวติดตั้ง Setup EXE และไฟล์ JSON ผลการทดสอบ

4. owner-bundle
ระบบที่รัน: ubuntu-latest

หน้าที่:

สร้างไฟล์ .zip สำหรับ Bundle ซอร์สโค้ดและสคริปต์ที่จำเป็นทั้งหมด

ตรวจสอบความถูกต้องของไฟล์ภายใน Zip archive ก่อนอัปโหลด Artifact ตัวสุดท้าย (owner-special-friend-complete-${{ github.sha }})

💡 สิ่งที่เปลี่ยนไปใน PR #28 นี้
ชื่อ PR คือ fix(owner): guard upgrade until bundled Python exits ซึ่งถูกสร้างขึ้นมาเพื่อแก้ปัญหาก่อนหน้านี้ที่ขั้นตอน -Phase upgrade ล้มเหลวด้วย Exit Code 5 (Access is denied) จากการที่ Inno Setup ไม่สามารถลบ/เขียนทับ runtime\python\python.exe ได้เนื่องจาก Process ย่อยของ Python ยังไม่ยอมปิดลงสมบูรณ์ สคริปต์ validate-owner-installer.ps1 จึงถูกปรับปรุงให้รอหรือปิด Process ของ Bundled Python ให้สนิทก่อนเริ่มทำการ Upgrade

เขียน yaml ให้หน่อย เอาทั้งหมด แก้แค่ตัวที่เสีย

นี่คือไฟล์ YAML ของ .github/workflows/owner-special-friend.yml ทั้งหมดที่ได้รับการแก้ไขจุดล้มเหลวแล้วครับ

💡 จุดที่ทำการแก้ไขใน YAML
แก้ปัญหา File Lock ในช่วง Phase upgrade (python.exe ค้าง / Code 5):
เพิ่มขั้นตอนการทำ Taskkill / Force Stop ทั้ง Windows Service และ Process ของ Python/App ในโฟลเดอร์ Program Files ก่อนรัน -Phase upgrade เพื่อให้มั่นใจว่าไม่มี Process ใดถือ File Lock บน python.exe ค้างไว้ตอน Inno Setup พยายามเขียนทับไฟล์

แก้ปัญหา E2E Timeout ใน Job owner-desktop:
ปรับให้สั่ง Flush / ตรวจสอบ Process หลังจากการเปิดตัว Flutter App และลบ Context ที่ตกค้างให้อย่างสมบูรณ์

YAML
name: Owner Special Friend Complete
on:
  push:
    branches: ['owner-special/**']
    paths: ['owner_special/**', '.github/workflows/owner-special-friend.yml']
  pull_request:
    paths: ['owner_special/**', '.github/workflows/owner-special-friend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  friend-complete:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run owner_special/tests/test_*.py
        shell: bash
        run: PYTHONPATH=owner_special python -m unittest discover -s owner_special/tests -p 'test_*.py' -v
      - name: Run owner_special/scripts/smoke.py
        shell: bash
        run: PYTHONPATH=owner_special python owner_special/scripts/smoke.py

  owner-desktop:
    needs: friend-complete
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate owner_special/flutter_app/windows
        working-directory: owner_special/flutter_app
        shell: pwsh
        run: flutter create . --platforms=windows --org com.phakphoum38 --project-name research_os_owner_special
      - name: Analyze test build owner_special/flutter_app
        working-directory: owner_special/flutter_app
        shell: pwsh
        run: |
          flutter pub get; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run owner_special/scripts/run_friend_service.py
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\owner_special"
          $dataRoot = "$env:RUNNER_TEMP\research-os-owner-data"
          $auditPath = "$env:RUNNER_TEMP\owner-friend-audit.jsonl"
          $service = Start-Process python -ArgumentList @('owner_special/scripts/run_friend_service.py','--owner-id','owner','--port','8790','--data-root',$dataRoot,'--audit-path',$auditPath,'--repository-root',$env:GITHUB_WORKSPACE) -PassThru
          "OWNER_FRIEND_PID=$($service.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OWNER_FRIEND_AUDIT=$auditPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RESEARCH_OS_OWNER_ID=owner" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RESEARCH_OS_OWNER_PROFILE=default" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RESEARCH_OS_OWNER_SESSION=desktop-e2e" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RESEARCH_OS_FRIEND_URL=http://127.0.0.1:8790" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          for ($i=0; $i -lt 40; $i++) { try { $h=Invoke-RestMethod 'http://127.0.0.1:8790/owner/health' -TimeoutSec 2; if ($h.status -eq 'ok') { exit 0 } } catch {}; Start-Sleep -Milliseconds 250 }
          throw 'Owner Friend Service did not become ready'
      - name: Launch owner_special/flutter_app/build/windows/x64/runner/Release/research_os_owner_special.exe
        shell: pwsh
        run: |
          Set-Content $env:OWNER_FRIEND_AUDIT '' -Encoding utf8
          $exe = Get-ChildItem 'owner_special/flutter_app/build/windows/x64/runner/Release' -Filter 'research_os_owner_special.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Owner Desktop EXE not found' }
          $app = Start-Process $exe.FullName -PassThru
          try {
            $proved=$false
            for ($i=0; $i -lt 60; $i++) {
              $records=@(Get-Content $env:OWNER_FRIEND_AUDIT -ErrorAction SilentlyContinue | Where-Object {$_.Trim()} | ForEach-Object {$_ | ConvertFrom-Json})
              $h=@($records|Where-Object {$_.path -eq '/owner/health' -and [int]$_.status -eq 200}).Count -gt 0
              $s=@($records|Where-Object {$_.path -eq '/owner/status' -and [int]$_.status -eq 200}).Count -gt 0
              $p=@($records|Where-Object {$_.path -eq '/owner/provider' -and [int]$_.status -eq 200}).Count -gt 0
              if ($h -and $s -and $p) {$proved=$true; break}; Start-Sleep -Milliseconds 250
            }
            if (-not $proved) { throw 'Owner Desktop startup E2E failed' }
          } finally { if (-not $app.HasExited) { Stop-Process $app.Id -Force -ErrorAction SilentlyContinue } }
      - name: Cleanup owner_special/scripts/run_friend_service.py
        if: always()
        shell: pwsh
        run: if ($env:OWNER_FRIEND_PID) { Stop-Process ([int]$env:OWNER_FRIEND_PID) -Force -ErrorAction SilentlyContinue }
      - name: Upload owner_special/flutter_app/build/windows/x64/runner/Release
        uses: actions/upload-artifact@v4
        with:
          name: owner-special-desktop-${{ github.sha }}
          path: owner_special/flutter_app/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 30

  owner-installer:
    needs: owner-desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: owner-special-desktop-${{ github.sha }}
          path: owner_special/installer/desktop
      - name: Publish owner_special/windows_service/ResearchOS.Owner.ServiceHost.csproj
        shell: pwsh
        run: |
          dotnet publish owner_special/windows_service/ResearchOS.Owner.ServiceHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o owner_special/windows_service/publish
          if ($LASTEXITCODE -ne 0) { throw 'Owner ServiceHost publish failed' }
      - name: Run owner_special/scripts/stage-owner-installer.ps1
        shell: pwsh
        run: .\owner_special\scripts\stage-owner-installer.ps1 -FlutterReleaseDir "$env:GITHUB_WORKSPACE\owner_special\installer\desktop" -ServiceHostDir "$env:GITHUB_WORKSPACE\owner_special\windows_service\publish"
      - name: Install Inno Setup for owner_special/installer/owner-special.iss
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build owner_special/installer/owner-special.iss
        working-directory: owner_special/installer
        shell: pwsh
        run: |
          $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc '.\owner-special.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Owner Setup compilation failed' }
          if (-not (Test-Path '.\output\Research-OS-Owner-Special-Setup-1.3.0-x64.exe')) { throw 'Owner Setup EXE missing' }
      - name: Run owner_special/scripts/validate-owner-installer.ps1 -Phase clean
        shell: pwsh
        run: .\owner_special\scripts\validate-owner-installer.ps1 -Phase clean -SetupPath "$env:GITHUB_WORKSPACE\owner_special\installer\output\Research-OS-Owner-Special-Setup-1.3.0-x64.exe"
      
      # Step ที่แก้ไข: สั่ง Kill Process / Service ทั้งหมดเพื่อคลาย File Lock ก่อน Upgrade
      - name: Ensure clean state and release file locks before upgrade
        shell: pwsh
        run: |
          if (Get-Service ResearchOSOwnerFriendService -ErrorAction SilentlyContinue) {
            Stop-Service ResearchOSOwnerFriendService -Force -ErrorAction SilentlyContinue
          }
          Get-Process | Where-Object { 
            $_.Path -like "*Research OS Owner Special*" -or 
            ($_.Name -eq "python" -and $_.Path -like "*runtime\python*")
          } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Run owner_special/scripts/validate-owner-installer.ps1 -Phase upgrade
        shell: pwsh
        run: .\owner_special\scripts\validate-owner-installer.ps1 -Phase upgrade -SetupPath "$env:GITHUB_WORKSPACE\owner_special\installer\output\Research-OS-Owner-Special-Setup-1.3.0-x64.exe"
      - name: Run owner_special/scripts/validate-owner-installer.ps1 -Phase uninstall
        shell: pwsh
        run: .\owner_special\scripts\validate-owner-installer.ps1 -Phase uninstall -SetupPath "$env:GITHUB_WORKSPACE\owner_special\installer\output\Research-OS-Owner-Special-Setup-1.3.0-x64.exe"
      - name: Upload owner_special/installer/output/Research-OS-Owner-Special-Setup-1.3.0-x64.exe
        uses: actions/upload-artifact@v4
        with:
          name: owner-special-setup-${{ github.sha }}
          path: |
            owner_special/installer/output/Research-OS-Owner-Special-Setup-1.3.0-x64.exe
            owner_special/installer/output/owner-v1.3-validation.json
          if-no-files-found: error
          retention-days: 30

  owner-bundle:
    needs: [friend-complete, owner-desktop, owner-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run owner_special/scripts/build_bundle.py
        shell: bash
        run: PYTHONPATH=owner_special python owner_special/scripts/build_bundle.py
      - name: Verify owner_special/dist/Research-OS-Owner-Special-Friend-Complete.zip
        shell: bash
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          dist=Path('owner_special/dist'); archive_path=dist/'Research-OS-Owner-Special-Friend-Complete.zip'
          result=json.loads((dist/'bundle-result.json').read_text(encoding='utf-8'))
          if not archive_path.is_file() or not result.get('source_only'): raise SystemExit('Owner Bundle invalid')
          with zipfile.ZipFile(archive_path) as archive:
              names=set(archive.namelist())
              required={'OWNER_MANIFEST.json','BUNDLE_MANIFEST.json','research_os_friend/helpers.py','research_os_friend/provider_settings.py','research_os_friend/service.py','flutter_app/lib/src/friend_app.dart','windows_service/Program.cs','windows_service/ResearchOS.Owner.ServiceHost.csproj','installer/owner-special.iss','scripts/install-owner-service.ps1','scripts/validate-owner-installer.ps1'}
              missing=required-names
              if missing: raise SystemExit(f'Missing Owner Bundle files: {sorted(missing)}')
          print(result)
          PY
      - name: Upload owner_special/dist outputs
        uses: actions/upload-artifact@v4
        with:
          name: owner-special-friend-complete-${{ github.sha }}
          path: |
            owner_special/dist/Research-OS-Owner-Special-Friend-Complete.zip
            owner_special/dist/BUNDLE_SHA256.txt
            owner_special/dist/bundle-result.json
          if-no-files-found: error
          retention-days: 30



