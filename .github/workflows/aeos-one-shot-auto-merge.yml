name: AEOS One-Shot Comprehensive Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact PR HEAD SHA to review
        required: true
        type: string
  workflow_run:
    workflows:
      - Owner Special Friend Complete
      - Research OS Gate
      - Research OS Final Gate
      - AEOS Master Assurance Gate
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  comprehensive-review:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target identity
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.expected_head_sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_HEAD: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$INPUT_PR"
            HEAD="$INPUT_HEAD"
          else
            HEAD="$WORKFLOW_HEAD"
            test -n "$HEAD"
            PR=""
            echo "trigger_workflow=$WORKFLOW_NAME" >> "$GITHUB_OUTPUT"
          fi
          test -n "$HEAD"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Resolve pull request for workflow completion
        if: ${{ github.event_name == 'workflow_run' }}
        id: workflow-pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          # Resolve the PR by historical commit association, not by the PR current head SHA.
          # A workflow_run can race with a later push to the same PR, so
          # current head != workflow_run.head_sha is historical drift, not
          # a missing PR.
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/pulls" --paginate)"
          pr="$(python3 -c 'import json,sys; rows=json.load(sys.stdin); matches=[p for p in rows if p.get("state")=="open"]; print(matches[0]["number"] if len(matches)==1 else "")' <<< "$prs")"
          test -n "$pr"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "lineage_mode=historical_commit" >> "$GITHUB_OUTPUT"

      - name: Finalize target identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ steps.target.outputs.pr }}
          WORKFLOW_PR: ${{ steps.workflow-pr.outputs.pr }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$DISPATCH_PR"
          else
            PR="$WORKFLOW_PR"
          fi
          test -n "$PR"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head=${{ steps.target.outputs.head }}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch exact historical target without executing PR workflow code
        env:
          EXPECTED_HEAD: ${{ steps.identity.outputs.head }}
        run: |
          set -euo pipefail
          # The PR ref is mutable. The workflow_run head SHA is immutable for
          # this completed run, so fetch that exact commit instead of the
          # PR current head ref.
          git fetch --no-tags origin "+$EXPECTED_HEAD:refs/remotes/origin/aeos-target"
          ACTUAL_HEAD="$(git rev-parse refs/remotes/origin/aeos-target)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git cat-file -e "$EXPECTED_HEAD^{commit}"

      - name: Verify PR checks are green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.identity.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.identity.outputs.head }}
          INITIAL_POLL_SECONDS: 5
          MAX_POLL_SECONDS: 30
          MAX_WAIT_SECONDS: 900
        run: |
          set -euo pipefail
          python3 tools/aeos/verify_pr_checks.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$EXPECTED_HEAD" \
            --initial-poll-seconds "$INITIAL_POLL_SECONDS" \
            --max-poll-seconds "$MAX_POLL_SECONDS" \
            --max-wait-seconds "$MAX_WAIT_SECONDS" \
            --current-run-id "$GITHUB_RUN_ID"

      - name: Run one-shot comprehensive review
        env:
          PR_NUMBER: ${{ steps.identity.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.identity.outputs.head }}
        run: |
          set -euo pipefail
          python3 tools/aeos/comprehensive_review.py \
            --pr-number "$PR_NUMBER" \
            --head-sha "$EXPECTED_HEAD" \
            --ci-passed

      - name: Verify review certificate is non-authorizing
        env:
          EXPECTED_HEAD: ${{ steps.identity.outputs.head }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("aeos-comprehensive-review.json").read_text())
          assert d["status"] == "VERIFIED"
          assert d["reviewed_head_sha"] == os.environ["EXPECTED_HEAD"]
          assert d["merge_allowed"] is False
          assert d["merge_authority"] is False
          assert d["self_certification"] is False
          PY

      - name: Publish immutable review certificate
        uses: actions/upload-artifact@v4
        with:
          name: aeos-one-shot-review
          path: aeos-comprehensive-review.json
          if-no-files-found: error
          retention-days: 90
