name: AEOS One-Shot Comprehensive Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact PR HEAD SHA to review
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  comprehensive-review:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target identity
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.expected_head_sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$INPUT_PR"
            HEAD="$INPUT_HEAD"
          else
            PR="$EVENT_PR"
            HEAD="$EVENT_HEAD"
          fi
          test -n "$PR"
          test -n "$HEAD"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch exact PR HEAD without executing PR workflow code
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/aeos-target"
          ACTUAL_HEAD="$(git rev-parse refs/remotes/origin/aeos-target)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git cat-file -e "$EXPECTED_HEAD^{commit}"

      - name: Verify PR checks are green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          CURRENT_WORKFLOW: AEOS One-Shot Comprehensive Review
          POLL_SECONDS: 15
          MAX_POLLS: 80
        run: |
          set -euo pipefail

          # `--required` is intentionally not used. A repository can have
          # zero branch-protection-required checks while still reporting a
          # complete and passing CI set. That configuration state must not be
          # misclassified as source failure.
          PR_NUMBER="$PR_NUMBER" CURRENT_WORKFLOW="$CURRENT_WORKFLOW" POLL_SECONDS="$POLL_SECONDS" MAX_POLLS="$MAX_POLLS" python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          pr_number = os.environ["PR_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          current_workflow = os.environ["CURRENT_WORKFLOW"]
          poll_seconds = int(os.environ.get("POLL_SECONDS", "15"))
          max_polls = int(os.environ.get("MAX_POLLS", "80"))

          def fetch_checks():
              cp = subprocess.run(
                  [
                      "gh",
                      "pr",
                      "checks",
                      pr_number,
                      "--repo",
                      repo,
                      "--json",
                      "name,state,bucket,workflow",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(cp.stdout or "[]")

          success_states = {"SUCCESS", "NEUTRAL", "SKIPPED"}
          pending_states = {"QUEUED", "IN_PROGRESS", "PENDING", "REQUESTED", "WAITING"}

          for attempt in range(1, max_polls + 1):
              checks = fetch_checks()
              if not checks:
                  raise SystemExit("no CI checks reported for PR HEAD")

              def is_self_check(check):
                  name = check.get("name") or ""
                  return name == current_workflow or name.startswith(current_workflow + " /")

              external = [c for c in checks if not is_self_check(c)]
              if not external:
                  raise SystemExit("no external CI checks reported for PR HEAD")

              pending = [
                  c for c in external
                  if c.get("bucket") == "pending" or c.get("state") in pending_states
              ]

              bad = [
                  c for c in external
                  if c not in pending and (c.get("bucket") != "pass" or c.get("state") not in success_states)
              ]
              if bad:
                  print(json.dumps({"failing_checks": bad}, indent=2))
                  raise SystemExit("one or more external PR checks are not passing")

              if pending:
                  print(json.dumps({
                      "status": "WAITING_FOR_EXTERNAL_CI",
                      "poll": attempt,
                      "max_polls": max_polls,
                      "pending_count": len(pending),
                      "pending_checks": [
                          {
                              "workflow": c.get("workflow"),
                              "name": c.get("name"),
                              "state": c.get("state"),
                              "bucket": c.get("bucket"),
                          }
                          for c in pending
                      ],
                  }, indent=2))
                  if attempt == max_polls:
                      raise SystemExit("external PR checks remained pending until verifier timeout")
                  time.sleep(poll_seconds)
                  continue

              print(json.dumps({
                  "status": "ALL_EXTERNAL_CHECKS_PASS",
                  "check_count": len(external),
                  "checks": [
                      {
                          "workflow": c.get("workflow"),
                          "name": c.get("name"),
                          "state": c.get("state"),
                          "bucket": c.get("bucket"),
                      }
                      for c in external
                  ],
              }, indent=2))
              break
          PY

      - name: Run one-shot comprehensive review
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          python3 tools/aeos/comprehensive_review.py \
            --pr-number "$PR_NUMBER" \
            --head-sha "$EXPECTED_HEAD" \
            --ci-passed

      - name: Verify review certificate is non-authorizing
        env:
          EXPECTED_HEAD: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("aeos-comprehensive-review.json").read_text())
          assert d["status"] == "VERIFIED"
          assert d["reviewed_head_sha"] == os.environ["EXPECTED_HEAD"]
          assert d["merge_allowed"] is False
          assert d["merge_authority"] is False
          assert d["self_certification"] is False
          PY

      - name: Publish immutable review certificate
        uses: actions/upload-artifact@v4
        with:
          name: aeos-one-shot-review
          path: aeos-comprehensive-review.json
          if-no-files-found: error
          retention-days: 90
