name: Research OS Full Product V3 Drive Transport

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/research-os-self-build-lab-2026-08-13
    paths:
      - '.github/workflows/v3-full-product-drive-transport.yml'

permissions:
  contents: read

concurrency:
  group: research-os-full-product-drive-transport
  cancel-in-progress: false

jobs:
  transport:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PRODUCT_SHA: 9fe426891fe1abf58c07a020baa0fea4a23b8d77
      SELF_WORKSPACE: D:\research-os-full-product-drive
      TRANSPORT: D:\research-os-transport

    steps:
      - name: Checkout exact verified product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Prove exact product SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:PRODUCT_SHA) { throw "wrong product SHA: $actual" }
          Write-Host "Exact product SHA: $actual"

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gate 1 - validate exact V3 runtime
        working-directory: v3
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'V3 tests failed' }
          python scripts/factory_execution_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'factory smoke failed' }

      - name: Gate 2 - create isolated self-build workspace
        shell: pwsh
        run: |
          if (Test-Path $env:SELF_WORKSPACE) { Remove-Item $env:SELF_WORKSPACE -Recurse -Force }
          python v3/scripts/self_build_lab.py --source "$env:GITHUB_WORKSPACE" --workspace "$env:SELF_WORKSPACE" --source-sha "$env:PRODUCT_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'self-build staging failed' }

      - name: Gate 3 - generate one live Full Control Center shell
        shell: pwsh
        run: |
          python "$env:SELF_WORKSPACE\v3\scripts\self_build_full_control_center.py" --workspace "$env:SELF_WORKSPACE" --requirement "$env:SELF_WORKSPACE\v3\self_build\OWNER_REQUIREMENT_FULL_CONTROL_CENTER.json"
          if ($LASTEXITCODE -ne 0) { throw 'Full Control Center generation failed' }
          python "$env:SELF_WORKSPACE\v3\scripts\activate_full_control_operational_pages.py" --workspace "$env:SELF_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw 'operational page activation failed' }
          python "$env:SELF_WORKSPACE\v3\scripts\self_build_full_control_center_tests.py" --workspace "$env:SELF_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw 'UI test staging failed' }
          python "$env:SELF_WORKSPACE\v3\scripts\normalize_live_tool_acceptance.py" --workspace "$env:SELF_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw 'acceptance normalization failed' }
          $obsoleteTest = "$env:SELF_WORKSPACE\v3\flutter_app\test\full_control_app_test.dart"
          if (Test-Path $obsoleteTest) { Remove-Item $obsoleteTest -Force }
          $app = "$env:SELF_WORKSPACE\v3\flutter_app\lib\src\research_os_v3_app.dart"
          $appText = Get-Content $app -Raw
          $legacy = 'class _OperationalPage extends StatelessWidget {'
          if ($appText.Contains($legacy)) {
            $appText = $appText.Replace($legacy, "// ignore: unused_element`r`nclass _OperationalPage extends StatelessWidget {")
            Set-Content $app $appText -Encoding UTF8
          }

      - name: Gate 4 - analyze test and build Windows app
        working-directory: D:\research-os-full-product-drive\v3\flutter_app
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name=research_os_v3_flutter .
          if ($LASTEXITCODE -ne 0) { throw 'flutter create failed' }
          if (Test-Path 'test\widget_test.dart') { Remove-Item 'test\widget_test.dart' -Force }
          flutter pub get
          dart fix --apply
          dart format lib test
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'flutter analyze failed' }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw 'flutter tests failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          if (-not (Test-Path 'build\windows\x64\runner\Release\research_os_v3_flutter.exe')) { throw 'Research OS app EXE missing' }

      - name: Gate 5 - build ServiceHost
        shell: pwsh
        run: |
          $out = "$env:SELF_WORKSPACE\out\service"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet publish "$env:SELF_WORKSPACE\v3\windows_service\ResearchOS.V3.ServiceHost.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o $out
          if ($LASTEXITCODE -ne 0) { throw 'ServiceHost publish failed' }
          if (-not (Test-Path "$out\ResearchOS.V3.ServiceHost.exe")) { throw 'ServiceHost EXE missing' }

      - name: Gate 6 - stage full runtime
        shell: pwsh
        run: |
          & "$env:SELF_WORKSPACE\v3\scripts\stage_candidate.ps1" -FlutterReleaseDir "$env:SELF_WORKSPACE\v3\flutter_app\build\windows\x64\runner\Release" -ServiceHostDir "$env:SELF_WORKSPACE\out\service" -FlutterIconPath "$env:SELF_WORKSPACE\v3\flutter_app\windows\runner\resources\app_icon.ico"
          if ($LASTEXITCODE -ne 0) { throw 'full runtime staging failed' }
          $package = "$env:SELF_WORKSPACE\v3\installer\package"
          foreach ($required in @('app\research_os_v3_flutter.exe','service\ResearchOS.V3.ServiceHost.exe','v3\runtime\python\python.exe','v3\research_os_v3\__init__.py','scripts\v3-service.ps1')) {
            if (-not (Test-Path (Join-Path $package $required))) { throw "full runtime missing: $required" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gate 7 - compile Setup EXE
        shell: pwsh
        run: |
          $output = "$env:SELF_WORKSPACE\v3\installer\output"
          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "$env:SELF_WORKSPACE\v3\installer\research-os-v3.iss"
          if ($LASTEXITCODE -ne 0) { throw 'installer compilation failed' }
          $setup = Get-ChildItem $output -Filter 'Research-OS-V3-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE missing' }
          "FULL_SETUP=$($setup.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Gate 8 - installed product E2E
        shell: pwsh
        run: |
          & "$env:SELF_WORKSPACE\v3\scripts\candidate_validate.ps1" -SetupPath $env:FULL_SETUP -EvidencePath "$env:SELF_WORKSPACE\FULL_PRODUCT_E2E.json"
          if ($LASTEXITCODE -ne 0) { throw 'installed product validation failed' }

      - name: Gate 9 - assemble exact Full Owner Archive
        shell: pwsh
        run: |
          $root = "$env:SELF_WORKSPACE\FULL_ARCHIVE"
          New-Item -ItemType Directory -Path "$root\01_INSTALLER" -Force | Out-Null
          New-Item -ItemType Directory -Path "$root\02_PORTABLE_RUNTIME" -Force | Out-Null
          New-Item -ItemType Directory -Path "$root\03_SOURCE" -Force | Out-Null
          New-Item -ItemType Directory -Path "$root\04_EVIDENCE" -Force | Out-Null
          Copy-Item $env:FULL_SETUP "$root\01_INSTALLER\Research-OS-Setup.exe" -Force
          Copy-Item "$env:SELF_WORKSPACE\v3\installer\package\*" "$root\02_PORTABLE_RUNTIME" -Recurse -Force
          foreach ($dir in @('v3','apps','owner_special','docs','scripts','tools','installer','research','house')) {
            $src = Join-Path $env:SELF_WORKSPACE $dir
            if (Test-Path $src) { Copy-Item $src "$root\03_SOURCE\$dir" -Recurse -Force }
          }
          foreach ($file in @('SELF_BUILD_MANIFEST.json','SELF_BUILD_FULL_CONTROL_CENTER.json','FULL_PRODUCT_E2E.json')) {
            $src = Join-Path $env:SELF_WORKSPACE $file
            if (Test-Path $src) { Copy-Item $src "$root\04_EVIDENCE\$file" -Force }
          }
          $inventory = Get-ChildItem $root -File -Recurse
          $total = [long](($inventory | Measure-Object Length -Sum).Sum)
          $manifest = [ordered]@{
            schema_version = 1
            contract = 'research-os-full-product-owner-archive-v3-drive-transport'
            status = 'passed'
            source_sha = $env:PRODUCT_SHA
            file_count = $inventory.Count
            uncompressed_bytes = $total
            setup = [ordered]@{ size = (Get-Item "$root\01_INSTALLER\Research-OS-Setup.exe").Length; sha256 = (Get-FileHash "$root\01_INSTALLER\Research-OS-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant() }
            app = [ordered]@{ sha256 = (Get-FileHash "$root\02_PORTABLE_RUNTIME\app\research_os_v3_flutter.exe" -Algorithm SHA256).Hash.ToLowerInvariant() }
            service = [ordered]@{ sha256 = (Get-FileHash "$root\02_PORTABLE_RUNTIME\service\ResearchOS.V3.ServiceHost.exe" -Algorithm SHA256).Hash.ToLowerInvariant() }
            bundled_python = Test-Path "$root\02_PORTABLE_RUNTIME\v3\runtime\python\python.exe"
            full_control_center = $true
            single_app_shell = $true
            merged = $false
            deployed = $false
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content "$root\04_EVIDENCE\FULL_PRODUCT_MANIFEST.json" -Encoding utf8
          $zip = "$env:SELF_WORKSPACE\Research_OS_FULL_PRODUCT_V3_9fe426891fe1.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal
          "FULL_ARCHIVE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "FULL archive uncompressed bytes: $total"
          Write-Host "FULL archive ZIP bytes: $((Get-Item $zip).Length)"
          Get-Content "$root\04_EVIDENCE\FULL_PRODUCT_MANIFEST.json"

      - name: Prepare connector-safe transport chunks and hashes
        shell: pwsh
        run: |
          if (Test-Path $env:TRANSPORT) { Remove-Item $env:TRANSPORT -Recurse -Force }
          New-Item -ItemType Directory -Path "$env:TRANSPORT\setup" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:TRANSPORT\manifest" -Force | Out-Null
          foreach ($i in 1..5) { New-Item -ItemType Directory -Path ("$env:TRANSPORT\part{0:D3}" -f $i) -Force | Out-Null }
          Copy-Item $env:FULL_SETUP "$env:TRANSPORT\setup\Research-OS-V3-Setup-x64.exe" -Force
          Copy-Item "$env:SELF_WORKSPACE\FULL_ARCHIVE\04_EVIDENCE\FULL_PRODUCT_MANIFEST.json" "$env:TRANSPORT\manifest\FULL_PRODUCT_MANIFEST.json" -Force
          Copy-Item "$env:SELF_WORKSPACE\FULL_PRODUCT_E2E.json" "$env:TRANSPORT\manifest\FULL_PRODUCT_E2E.json" -Force

          $source = Get-Item $env:FULL_ARCHIVE_ZIP
          $chunkSize = 200MB
          $buffer = New-Object byte[] (4MB)
          $input = [System.IO.File]::OpenRead($source.FullName)
          $parts = @()
          try {
            $partIndex = 1
            while ($input.Position -lt $input.Length) {
              if ($partIndex -gt 5) { throw 'Full archive exceeded five transport parts' }
              $partName = 'Research_OS_FULL_PRODUCT_V3_9fe426891fe1.zip.part{0:D3}' -f $partIndex
              $partPath = Join-Path ("$env:TRANSPORT\part{0:D3}" -f $partIndex) $partName
              $output = [System.IO.File]::Create($partPath)
              try {
                $remaining = [Math]::Min([long]$chunkSize, $input.Length - $input.Position)
                while ($remaining -gt 0) {
                  $want = [int][Math]::Min([long]$buffer.Length, $remaining)
                  $read = $input.Read($buffer, 0, $want)
                  if ($read -le 0) { break }
                  $output.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally { $output.Dispose() }
              $part = Get-Item $partPath
              $parts += [ordered]@{ index=$partIndex; name=$part.Name; size=$part.Length; sha256=(Get-FileHash $part.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
              $partIndex++
            }
          } finally { $input.Dispose() }

          $transportManifest = [ordered]@{
            schema_version = 1
            contract = 'research-os-full-product-v3-connector-transport'
            product_sha = $env:PRODUCT_SHA
            original_archive = [ordered]@{
              name = $source.Name
              size = $source.Length
              sha256 = (Get-FileHash $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            setup = [ordered]@{
              name = 'Research-OS-V3-Setup-x64.exe'
              size = (Get-Item "$env:TRANSPORT\setup\Research-OS-V3-Setup-x64.exe").Length
              sha256 = (Get-FileHash "$env:TRANSPORT\setup\Research-OS-V3-Setup-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            chunk_size_bytes = [long]$chunkSize
            part_count = $parts.Count
            parts = $parts
            reassemble_windows = 'copy /b Research_OS_FULL_PRODUCT_V3_9fe426891fe1.zip.part001+Research_OS_FULL_PRODUCT_V3_9fe426891fe1.zip.part002+... Research_OS_FULL_PRODUCT_V3_9fe426891fe1.zip'
          }
          $transportManifest | ConvertTo-Json -Depth 8 | Set-Content "$env:TRANSPORT\manifest\TRANSPORT_MANIFEST.json" -Encoding utf8
          Get-Content "$env:TRANSPORT\manifest\TRANSPORT_MANIFEST.json"

      - name: Upload Setup transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-v3-setup-9fe426891fe1
          path: D:\research-os-transport\setup\*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload transport manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-v3-manifest-9fe426891fe1
          path: D:\research-os-transport\manifest\*
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive part 001
        uses: actions/upload-artifact@v4
        with:
          name: research-os-v3-full-9fe426891fe1-part001
          path: D:\research-os-transport\part001\*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload archive part 002
        uses: actions/upload-artifact@v4
        with:
          name: research-os-v3-full-9fe426891fe1-part002
          path: D:\research-os-transport\part002\*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Upload archive part 003
        uses: actions/upload-artifact@v4
        with:
          name: research-os-v3-full-9fe426891fe1-part003
          path: D:\research-os-transport\part003\*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Upload archive part 004
        uses: actions/upload-artifact@v4
        with:
          name: research-os-v3-full-9fe426891fe1-part004
          path: D:\research-os-transport\part004\*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Upload archive part 005
        uses: actions/upload-artifact@v4
        with:
          name: research-os-v3-full-9fe426891fe1-part005
          path: D:\research-os-transport\part005\*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
