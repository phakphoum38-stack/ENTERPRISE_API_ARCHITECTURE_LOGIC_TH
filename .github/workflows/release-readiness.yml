name: Research OS Release Readiness

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source commit SHA to validate
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: research-os-release-readiness-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  linux-preflight:
    name: Linux source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          test "$checkout_sha" = "$TARGET_SHA"
          echo "SOURCE_SHA=$checkout_sha"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run source checks and Python suites
        shell: bash
        run: |
          set -euo pipefail
          python design/validate_assets.py
          python -m compileall -q v3 tools/research_os_api owner_special
          PYTHONPATH=v3 python -m unittest discover -s v3/tests -p 'test_*.py' -q
          python -m unittest discover -s tools/research_os_api -p 'test_*.py' -q
          PYTHONPATH=owner_special python -m unittest discover -s owner_special/tests -p 'test_*.py' -q
          python owner_special/scripts/smoke.py
          python tools/validate_release_alignment.py

      - name: Build ServiceHost projects
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            owner_special/windows_service/ResearchOS.Owner.ServiceHost.csproj \
            tools/research_os_service/ResearchOS.ServiceHost.csproj \
            v3/windows_service/ResearchOS.V3.ServiceHost.csproj; do
            dotnet build "$project" --configuration Release --nologo -v:q
          done

  windows-candidate:
    name: Windows candidate and installer gate
    needs: linux-preflight
    uses: ./.github/workflows/candidate.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
    secrets: inherit
