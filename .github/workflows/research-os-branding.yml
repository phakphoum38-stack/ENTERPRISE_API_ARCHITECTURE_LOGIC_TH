name: Research OS Branding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/research_os_flutter/assets/branding/**"
      - "scripts/apply-research-os-branding.py"
      - "installer/research-os.iss"
      - ".github/workflows/01-build-windows-app.yml"
      - ".github/workflows/04-build-installer.yml"
      - ".github/workflows/research-os-flutter.yml"
      - ".github/workflows/research-os-branding.yml"

permissions:
  contents: read

concurrency:
  group: research-os-branding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-web-linux-android:
    name: Validate Windows Android Web Linux branding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Stage app
        run: cp -R apps/research_os_flutter /tmp/research_os_flutter
      - name: Generate portable shells
        working-directory: /tmp/research_os_flutter
        run: flutter create --platforms=android,web,linux --project-name=research_os_flutter .
      - name: Apply shared branding
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply-research-os-branding.py --app-root /tmp/research_os_flutter --platform android --platform web --platform linux
      - name: Verify Android Web Linux icons
        run: |
          test -f /tmp/research_os_flutter/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f /tmp/research_os_flutter/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f /tmp/research_os_flutter/web/favicon.png
          test -f /tmp/research_os_flutter/web/icons/Icon-512.png
          test -f /tmp/research_os_flutter/linux/packaging/icons/research-os-512.png
          test -f /tmp/research_os_flutter/assets/branding/research_os.ico

  apple:
    name: Validate iOS and macOS branding
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Stage app
        run: cp -R apps/research_os_flutter /tmp/research_os_flutter
      - name: Generate Apple shells
        working-directory: /tmp/research_os_flutter
        run: flutter create --platforms=ios,macos --project-name=research_os_flutter .
      - name: Apply Research OS Apple branding
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/apply-research-os-branding.py --app-root /tmp/research_os_flutter --platform ios --platform macos
      - name: Verify iOS and macOS icons
        run: |
          test -f /tmp/research_os_flutter/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -f /tmp/research_os_flutter/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-60x60@3x.png
          test -f /tmp/research_os_flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png
          test -f /tmp/research_os_flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_16.png

  windows:
    name: Validate Windows executable and installer icon
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Stage app
        shell: pwsh
        run: Copy-Item apps\research_os_flutter D:\research_os_flutter -Recurse -Force
      - name: Generate Windows shell
        working-directory: D:\research_os_flutter
        shell: pwsh
        run: flutter create --platforms=windows --project-name=research_os_flutter .
      - name: Apply Research OS Windows branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts\apply-research-os-branding.py --app-root D:\research_os_flutter --platform windows
          if (-not (Test-Path 'D:\research_os_flutter\windows\runner\resources\app_icon.ico')) { throw 'Windows app icon missing' }
          if (-not (Test-Path 'D:\research_os_flutter\assets\branding\research_os.ico')) { throw 'Installer icon missing' }

  summary:
    name: Branding coverage summary
    if: always()
    needs: [desktop-web-linux-android, apple, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Assert coverage
        run: |
          test '${{ needs.desktop-web-linux-android.result }}' = 'success'
          test '${{ needs.apple.result }}' = 'success'
          test '${{ needs.windows.result }}' = 'success'
      - name: Write summary
        run: |
          {
            echo '# Research OS Branding'
            echo '- Windows executable icon: validated'
            echo '- Installer / shortcut icon source: validated'
            echo '- Android launcher icons: validated'
            echo '- iOS AppIcon set: validated'
            echo '- macOS AppIcon set: validated'
            echo '- Web favicon / PWA icons: validated'
            echo '- Linux packaging icons: validated'
            echo '- Source of truth: assets/branding/research_os_master.webp'
          } >> "$GITHUB_STEP_SUMMARY"
