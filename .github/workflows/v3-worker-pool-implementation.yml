name: V3.3 Worker Pool Implementation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v3-worker-pool
    paths:
      - '.github/workflows/v3-worker-pool-implementation.yml'

permissions:
  contents: write

concurrency:
  group: v3-worker-pool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !contains(github.event.head_commit.message, '[skip worker-pool]') }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v3-worker-pool
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate bounded Worker Pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v3/research_os_v3 v3/tests
          cat > v3/research_os_v3/worker_pool.py <<'PY'
          """Bounded worker pool for the V3 execution runtime.

          The pool deliberately owns concurrency only. Queueing, lease ownership,
          renewal and persistence remain injectable so the existing V3 runtime is
          not duplicated or replaced.
          """
          from __future__ import annotations

          import queue
          import threading
          import time
          from dataclasses import dataclass, field
          from typing import Callable, Generic, Optional, TypeVar

          T = TypeVar("T")
          R = TypeVar("R")


          @dataclass(frozen=True)
          class WorkerTask(Generic[T]):
              task_id: str
              payload: T
              attempts: int = 0


          @dataclass
          class WorkerResult(Generic[R]):
              task_id: str
              value: Optional[R] = None
              error: Optional[BaseException] = None
              attempts: int = 0


          class BoundedWorkerPool(Generic[T, R]):
              """Fixed-size pool with bounded admission and cooperative shutdown.

              ``lease_renew`` is called while a task is executing. ``on_failure``
              can persist/requeue failed ownership using the existing lease store.
              The pool never creates a second queue or ownership system.
              """

              _STOP = object()

              def __init__(
                  self,
                  worker: Callable[[T], R],
                  *,
                  max_workers: int,
                  max_queue: int,
                  lease_renew: Optional[Callable[[WorkerTask[T]], None]] = None,
                  on_failure: Optional[Callable[[WorkerTask[T], BaseException], None]] = None,
                  renew_interval: float = 1.0,
              ) -> None:
                  if max_workers < 1:
                      raise ValueError("max_workers must be >= 1")
                  if max_queue < 0:
                      raise ValueError("max_queue must be >= 0")
                  if renew_interval <= 0:
                      raise ValueError("renew_interval must be > 0")
                  self._worker = worker
                  self._queue: queue.Queue[object] = queue.Queue(maxsize=max_queue)
                  self._max_workers = max_workers
                  self._lease_renew = lease_renew
                  self._on_failure = on_failure
                  self._renew_interval = renew_interval
                  self._threads: list[threading.Thread] = []
                  self._started = False
                  self._stopping = False
                  self._lock = threading.Lock()
                  self._results: queue.Queue[WorkerResult[R]] = queue.Queue()

              @property
              def max_workers(self) -> int:
                  return self._max_workers

              @property
              def queue_size(self) -> int:
                  return self._queue.qsize()

              def start(self) -> None:
                  with self._lock:
                      if self._started:
                          return
                      if self._stopping:
                          raise RuntimeError("worker pool cannot be restarted")
                      self._started = True
                      for index in range(self._max_workers):
                          thread = threading.Thread(
                              target=self._run,
                              name=f"v3-worker-{index + 1}",
                              daemon=True,
                          )
                          thread.start()
                          self._threads.append(thread)

              def submit(self, task: WorkerTask[T], *, timeout: Optional[float] = None) -> None:
                  with self._lock:
                      if not self._started:
                          raise RuntimeError("worker pool is not started")
                      if self._stopping:
                          raise RuntimeError("worker pool is stopping")
                  self._queue.put(task, timeout=timeout)

              def shutdown(self, *, wait: bool = True, timeout: Optional[float] = None) -> None:
                  with self._lock:
                      if not self._started or self._stopping:
                          return
                      self._stopping = True
                  for _ in self._threads:
                      self._queue.put(self._STOP)
                  if wait:
                      deadline = None if timeout is None else time.monotonic() + timeout
                      for thread in self._threads:
                          remaining = None if deadline is None else max(0.0, deadline - time.monotonic())
                          thread.join(remaining)

              def get_result(self, *, timeout: Optional[float] = None) -> WorkerResult[R]:
                  return self._results.get(timeout=timeout)

              def _run(self) -> None:
                  while True:
                      item = self._queue.get()
                      try:
                          if item is self._STOP:
                              return
                          assert isinstance(item, WorkerTask)
                          task = item
                          result = self._execute(task)
                          self._results.put(result)
                      finally:
                          self._queue.task_done()

              def _execute(self, task: WorkerTask[T]) -> WorkerResult[R]:
                  stop_renew = threading.Event()
                  renew_thread: Optional[threading.Thread] = None
                  if self._lease_renew is not None:
                      renew_thread = threading.Thread(
                          target=self._renew_loop,
                          args=(task, stop_renew),
                          name=f"lease-renewer-{task.task_id}",
                          daemon=True,
                      )
                      renew_thread.start()
                  try:
                      value = self._worker(task.payload)
                      return WorkerResult(task_id=task.task_id, value=value, attempts=task.attempts)
                  except BaseException as exc:
                      if self._on_failure is not None:
                          self._on_failure(task, exc)
                      return WorkerResult(task_id=task.task_id, error=exc, attempts=task.attempts)
                  finally:
                      stop_renew.set()
                      if renew_thread is not None:
                          renew_thread.join(timeout=max(self._renew_interval * 2, 0.1))

              def _renew_loop(self, task: WorkerTask[T], stop: threading.Event) -> None:
                  while not stop.wait(self._renew_interval):
                      try:
                          assert self._lease_renew is not None
                          self._lease_renew(task)
                      except Exception:
                          # Lease failures are surfaced to the existing ownership
                          # layer on its next operation; the worker is not silently
                          # given a new ownership model here.
                          continue
          PY

      - name: Generate Worker Pool tests
        shell: bash
        run: |
          set -euo pipefail
          cat > v3/tests/test_worker_pool.py <<'PY'
          import threading
          import time
          import unittest

          from research_os_v3.worker_pool import BoundedWorkerPool, WorkerTask


          class WorkerPoolTests(unittest.TestCase):
              def test_bounded_concurrency_never_exceeds_limit(self):
                  lock = threading.Lock()
                  active = 0
                  maximum = 0

                  def worker(value):
                      nonlocal active, maximum
                      with lock:
                          active += 1
                          maximum = max(maximum, active)
                      time.sleep(0.03)
                      with lock:
                          active -= 1
                      return value * 2

                  pool = BoundedWorkerPool(worker, max_workers=3, max_queue=10)
                  pool.start()
                  for i in range(8):
                      pool.submit(WorkerTask(str(i), i))
                  results = [pool.get_result(timeout=2) for _ in range(8)]
                  pool.shutdown()
                  self.assertLessEqual(maximum, 3)
                  self.assertEqual(sorted(r.value for r in results), [i * 2 for i in range(8)])

              def test_failure_is_reported_and_ownership_callback_runs(self):
                  failures = []

                  def worker(_):
                      raise RuntimeError("boom")

                  def on_failure(task, error):
                      failures.append((task.task_id, str(error)))

                  pool = BoundedWorkerPool(worker, max_workers=1, max_queue=2, on_failure=on_failure)
                  pool.start()
                  pool.submit(WorkerTask("crash-1", "payload"))
                  result = pool.get_result(timeout=2)
                  pool.shutdown()
                  self.assertIsInstance(result.error, RuntimeError)
                  self.assertEqual(failures, [("crash-1", "boom")])

              def test_lease_renewal_runs_during_long_task(self):
                  renewals = []
                  started = threading.Event()

                  def worker(_):
                      started.set()
                      time.sleep(0.12)
                      return "ok"

                  def renew(task):
                      renewals.append(task.task_id)

                  pool = BoundedWorkerPool(
                      worker,
                      max_workers=1,
                      max_queue=1,
                      lease_renew=renew,
                      renew_interval=0.02,
                  )
                  pool.start()
                  pool.submit(WorkerTask("lease-1", "payload"))
                  self.assertTrue(started.wait(1))
                  result = pool.get_result(timeout=2)
                  pool.shutdown()
                  self.assertEqual(result.value, "ok")
                  self.assertGreaterEqual(len(renewals), 2)
                  self.assertTrue(all(item == "lease-1" for item in renewals))

              def test_graceful_shutdown_drains_running_tasks(self):
                  completed = []

                  def worker(value):
                      time.sleep(0.03)
                      completed.append(value)
                      return value

                  pool = BoundedWorkerPool(worker, max_workers=2, max_queue=4)
                  pool.start()
                  for i in range(4):
                      pool.submit(WorkerTask(str(i), i))
                  pool.shutdown(wait=True, timeout=2)
                  self.assertEqual(sorted(completed), [0, 1, 2, 3])


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Run Worker Pool tests
        working-directory: v3
        run: python -m unittest tests.test_worker_pool -v

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/research_os_v3/worker_pool.py v3/tests/test_worker_pool.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat(v3.3): add bounded worker pool [skip worker-pool]'
          git push origin agent/v3-worker-pool
