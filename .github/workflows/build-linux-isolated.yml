name: Research OS Build Linux Isolated

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: research-os-linux-isolated-${{ inputs.target_ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || 'main' }}

      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux platform shell
        working-directory: apps/research_os_flutter
        run: flutter create --platforms=linux --project-name=research_os_flutter .

      - name: Install dependencies
        working-directory: apps/research_os_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/research_os_flutter
        run: flutter analyze

      - name: Test
        working-directory: apps/research_os_flutter
        run: flutter test

      - name: Build Linux release
        working-directory: apps/research_os_flutter
        run: flutter build linux --release

      - name: Stage tar.gz and AppImage
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="apps/research_os_flutter/build/linux/x64/release/bundle"
          test -x "$BUNDLE/research_os_flutter"
          mkdir -p dist/linux
          tar -C "$BUNDLE" -czf dist/linux/Research-OS-Linux-x64.tar.gz .

          APPDIR="$RUNNER_TEMP/ResearchOS.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          cp -a "$BUNDLE/." "$APPDIR/usr/bin/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/research_os_flutter" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/research-os.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Research OS
          Exec=research_os_flutter
          Icon=research-os
          Categories=Development;Utility;
          Terminal=false
          EOF
          cat > "$APPDIR/research-os.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#111827"/><text x="256" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="180" font-weight="700" fill="white">RO</text></svg>
          EOF
          cp "$APPDIR/research-os.svg" "$APPDIR/usr/share/icons/hicolor/scalable/apps/research-os.svg"

          curl -L --fail --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$APPDIR" dist/linux/Research-OS-Linux-x86_64.AppImage
          chmod +x dist/linux/Research-OS-Linux-x86_64.AppImage
          (cd dist/linux && sha256sum Research-OS-Linux-x64.tar.gz Research-OS-Linux-x86_64.AppImage > SHA256SUMS.txt)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-linux-${{ github.run_id }}
          path: dist/linux/**
          if-no-files-found: error
          retention-days: 14
