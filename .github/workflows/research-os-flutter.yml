name: Research OS Flutter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/research_os_flutter/**"
      - ".github/workflows/research-os-flutter.yml"
  pull_request:
    paths:
      - "apps/research_os_flutter/**"
      - ".github/workflows/research-os-flutter.yml"

permissions:
  contents: read

concurrency:
  group: research-os-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/research_os_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform shell
        run: flutter create --platforms=web --project-name=research_os_flutter .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Research OS Flutter"
            echo
            echo "- Analyze: completed"
            echo "- Tests: completed"
            echo "- Web build: completed when this job succeeds"
            echo "- Gemini and GitHub secrets remain on the backend"
          } >> "$GITHUB_STEP_SUMMARY"
