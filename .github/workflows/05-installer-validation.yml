name: Research OS Installer Validation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to validate
        required: false
        type: string
      source_installer_run:
        description: Installer workflow run ID
        required: false
        type: string
      rollback_sha:
        description: Stable V1 SHA used for rollback validation
        required: false
        default: d05189d151b6bfa65938dad7a812ac104db195f4
        type: string
      dispatch_release:
        description: Dispatch the downstream release workflow after successful validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  installer-validation:
    name: Install upgrade rollback data service health uninstall
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      SOURCE_RUN_ID: ${{ inputs.source_installer_run }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Resolve installer build run
        id: installer-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = "$env:SOURCE_RUN_ID"
          if (-not $runId) {
            $runId = gh run list --repo "${{ github.repository }}" --workflow "Research OS Build Installer" --commit "$env:TARGET_SHA" --status success --limit 20 --json databaseId --jq '.[0].databaseId'
          }
          if (-not $runId) { throw "No successful installer build found for $env:TARGET_SHA" }
          "run_id=$runId" >> $env:GITHUB_OUTPUT

      - name: Download installer artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path installer-under-test | Out-Null
          gh run download "${{ steps.installer-run.outputs.run_id }}" --repo "${{ github.repository }}" --name "research-os-installer-$env:TARGET_SHA" --dir installer-under-test
          $setup = Get-ChildItem "installer-under-test\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer artifact is missing" }

      - name: Prepare clean validation environment
        shell: pwsh
        run: |
          if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) {
            sc.exe stop ResearchOSService | Out-Host
            Start-Sleep -Seconds 2
            sc.exe delete ResearchOSService | Out-Host
            Start-Sleep -Seconds 2
          }
          $listeners = Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue
          foreach ($listener in $listeners) { Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          if (Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue) { throw "Port 8787 still has a listener before installation" }
          $root = Join-Path $env:ProgramFiles 'Research OS'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          $data = Join-Path $env:ProgramData 'ResearchOS'
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }

      - name: Seed representative V1 local data
        shell: pwsh
        run: .\scripts\v2-data-preservation.ps1 -Action Seed -DataDir "$env:ProgramData\ResearchOS"

      - name: Install V2 Setup EXE silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem "installer-under-test\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer missing" }
          $log = "$env:RUNNER_TEMP\research-os-install.log"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 300 }
            throw "Installer failed with exit code $($p.ExitCode)"
          }
          if (Test-Path $log) { Get-Content $log -Tail 80 }

      - name: Verify installed files and V2 package modules
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles 'Research OS'
          $required = @(
            "$root\app\research_os_flutter.exe",
            "$root\runtime\python\python.exe",
            "$root\tools\research_os_service\publish\ResearchOS.ServiceHost.exe",
            "$root\tools\research_os_api\v2_server.py",
            "$root\tools\research_os_api\v2_observability.py",
            "$root\tools\research_os_api\v2_completion_crew.py",
            "$root\scripts\research-os-service.ps1"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Installed file missing: $path" } }
          if (-not (Test-Path "$env:ProgramData\ResearchOS\workspaces")) { throw "V2 workspace data directory missing" }

      - name: Verify V1 data survived V2 installation
        shell: pwsh
        run: .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Verify ResearchOSService is running
        shell: pwsh
        run: |
          $service = Get-CimInstance Win32_Service -Filter "Name='ResearchOSService'"
          if (-not $service) { throw "ResearchOSService was not installed" }
          Write-Host "Service state: $($service.State)"
          Write-Host "Service path: $($service.PathName)"
          if ($service.State -ne 'Running') { throw "ResearchOSService is not running" }

      - name: Verify service V1 health and V2 readiness endpoints
        shell: pwsh
        run: |
          $ready = $false
          $lastError = $null
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2 -SkipHttpErrorCheck
              Write-Host "Health attempt $($i + 1): HTTP $($response.StatusCode) $($response.Content)"
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') { $ready = $true; break }
            } catch { $lastError = $_.Exception.Message }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Host "Last health error: $lastError"
            throw "Installed Research OS health endpoint did not become ready"
          }
          $v2 = Invoke-WebRequest -Uri "http://127.0.0.1:8787/v2/health/readiness" -TimeoutSec 5 -SkipHttpErrorCheck
          Write-Host "V2 readiness: HTTP $($v2.StatusCode) $($v2.Content)"
          if ($v2.StatusCode -ne 200) { throw "V2 readiness endpoint is not healthy" }
          $payload = $v2.Content | ConvertFrom-Json
          if (-not $payload.ready) { throw "V2 readiness reported not ready" }
          if (-not $payload.storage.writable) { throw "V2 storage readiness reported not writable" }


      - name: Verify loopback listener and secret-safe Brain provider status
        shell: pwsh
        run: |
          $listeners = @(Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction Stop)
          if (-not $listeners) { throw "Research OS API listener was not found" }
          $unsafe = @($listeners | Where-Object { $_.LocalAddress -notin @('127.0.0.1', '::1') })
          if ($unsafe) {
            $unsafe | Format-Table -AutoSize | Out-Host
            throw "Research OS API must listen on loopback only"
          }
          $payload = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v2/brain/providers" -TimeoutSec 5
          foreach ($entry in $payload.providers.PSObject.Properties) {
            if ($entry.Value.secret_exposed -ne $false) {
              throw "Provider status exposed a secret flag for $($entry.Name)"
            }
          }
          $serialized = $payload | ConvertTo-Json -Depth 8 -Compress
          if ($serialized -match '(?i)sk-[A-Za-z0-9_-]{8,}|Bearer\\s+[A-Za-z0-9._-]+') {
            throw "Provider status response contains credential-like data"
          }
          Write-Host "Loopback listener and secret-safe provider status verified."

      - name: Reinstall V2 in-place to exercise upgrade path
        shell: pwsh
        run: |
          $setup = Get-ChildItem "installer-under-test\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          $log = "$env:RUNNER_TEMP\research-os-upgrade.log"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 300 }
            throw "In-place upgrade simulation failed with exit code $($p.ExitCode)"
          }
          if (Test-Path $log) {
            $tail = Get-Content $log -Tail 300
            $tail | Out-Host
            if ($tail -match 'User canceled the installation process|DeleteFile failed; code 5') { throw "Upgrade log contains file-lock cancellation" }
          }
          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Verify service restarted after V2 upgrade
        shell: pwsh
        run: |
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $service = Get-CimInstance Win32_Service -Filter "Name='ResearchOSService'"
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8787/v2/health/readiness" -TimeoutSec 2 -SkipHttpErrorCheck
              if ($service.State -eq 'Running' -and $response.StatusCode -eq 200 -and ($response.Content | ConvertFrom-Json).ready) { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "V2 service/readiness did not recover after in-place upgrade" }
          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Uninstall V2 Setup EXE silently
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles 'Research OS'
          $uninstaller = Get-ChildItem $root -Filter 'unins*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller executable was not found" }
          $log = "$env:RUNNER_TEMP\research-os-uninstall-v2.log"
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 300 }
            throw "V2 uninstaller failed with exit code $($p.ExitCode)"
          }

      - name: Verify V2 service removed and V1 data preserved
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 20; $i++) {
            if (-not (Get-Service ResearchOSService -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) { throw "ResearchOSService still exists after V2 uninstall" }
          if (Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue) { throw "Port 8787 is still listening after V2 uninstall" }
          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Resolve and download stable V1 rollback installer
        id: rollback-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh run list --repo "${{ github.repository }}" --workflow "Research OS Build Installer" --commit "$env:ROLLBACK_SHA" --status success --limit 20 --json databaseId --jq '.[0].databaseId'
          if (-not $runId) { throw "No successful stable V1 installer run found for rollback SHA $env:ROLLBACK_SHA" }
          New-Item -ItemType Directory -Force -Path rollback-installer | Out-Null
          gh run download "$runId" --repo "${{ github.repository }}" --name "research-os-installer-$env:ROLLBACK_SHA" --dir rollback-installer
          $setup = Get-ChildItem "rollback-installer\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Stable V1 rollback installer artifact is unavailable or expired" }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Host "Rollback installer run: $runId"

      - name: Install stable V1 rollback package
        shell: pwsh
        run: |
          $setup = Get-ChildItem "rollback-installer\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          $log = "$env:RUNNER_TEMP\research-os-rollback-v1-install.log"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 300 }
            throw "Stable V1 rollback install failed with exit code $($p.ExitCode)"
          }
          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Verify stable V1 rollback service health and data compatibility
        shell: pwsh
        run: |
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2 -SkipHttpErrorCheck
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "Stable V1 rollback health endpoint did not become ready" }
          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"
          Write-Host "Stable V1 rollback is healthy and V1 local data hashes are unchanged."

      - name: Uninstall stable V1 rollback package
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles 'Research OS'
          $uninstaller = Get-ChildItem $root -Filter 'unins*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw "Stable V1 rollback uninstaller was not found" }
          $log = "$env:RUNNER_TEMP\research-os-rollback-v1-uninstall.log"
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 300 }
            throw "Stable V1 rollback uninstall failed with exit code $($p.ExitCode)"
          }

      - name: Verify final service removal and preserved data
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 20; $i++) {
            if (-not (Get-Service ResearchOSService -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) { throw "ResearchOSService still exists after rollback validation" }
          if (Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue) { throw "Port 8787 is still listening after rollback validation" }
          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Emergency cleanup and diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "=== FINAL SERVICE STATE ==="
          & sc.exe query ResearchOSService 2>&1 | Out-Host
          $global:LASTEXITCODE = 0
          Write-Host "=== FINAL PORT STATE ==="
          Get-NetTCPConnection -LocalPort 8787 -ErrorAction SilentlyContinue | Format-Table -AutoSize
          if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) {
            & sc.exe stop ResearchOSService 2>&1 | Out-Host
            $global:LASTEXITCODE = 0
            Start-Sleep -Seconds 1
            & sc.exe delete ResearchOSService 2>&1 | Out-Host
            $global:LASTEXITCODE = 0
          }
          $listeners = Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue
          foreach ($listener in $listeners) { Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Dispatch release workflow
        if: ${{ success() && inputs.dispatch_release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 06-release.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f target_sha="$env:TARGET_SHA" -f source_installer_run="${{ steps.installer-run.outputs.run_id }}" -f source_validation_run="${{ github.run_id }}"

      - name: Dispatch validation-only candidate evidence gate
        if: ${{ success() && inputs.dispatch_release != true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-os-windows-desktop.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f target_sha="$env:TARGET_SHA" -f source_installer_run="${{ steps.installer-run.outputs.run_id }}" -f source_validation_run="${{ github.run_id }}" -f candidate_only=true
