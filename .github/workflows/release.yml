name: Research OS Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      candidate_run_id:
        description: Successful Research OS V3 Candidate workflow run ID
        required: true
        type: string
      tag_name:
        description: Release tag, for example v3.0.0
        required: false
        type: string
      publish:
        description: Actually create a GitHub Release and tag
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: research-os-release-${{ inputs.target_sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}

jobs:
  release:
    name: Verify and publish Research OS V3 release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Validate candidate workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          test -n "$CANDIDATE_RUN_ID"
          workflow="$(gh run view "$CANDIDATE_RUN_ID" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')"
          status="$(gh run view "$CANDIDATE_RUN_ID" --repo "${{ github.repository }}" --json status --jq '.status')"
          conclusion="$(gh run view "$CANDIDATE_RUN_ID" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')"
          head_sha="$(gh run view "$CANDIDATE_RUN_ID" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
          test "$workflow" = "Research OS Candidate"
          test "$status" = "completed"
          test "$conclusion" = "success"
          test "$head_sha" = "$TARGET_SHA"
          echo "Candidate workflow validation passed."

      - name: Download verified V3 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-input release-normalized
          mkdir -p release-input release-normalized
          gh run download "$CANDIDATE_RUN_ID" --repo "${{ github.repository }}" --name "research-os-v3-verified-candidate-$TARGET_SHA" --dir release-input
          find release-input -type f -print | sort

      - name: Normalize V3 candidate artifact layout
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find release-input -type f -name 'candidate-manifest.json' -print -quit)"
          checksums="$(find release-input -type f -name 'SHA256SUMS.txt' -print -quit)"
          setup="$(find release-input -type f -name 'Research-OS-V3-Setup-*-x64.exe' -print -quit)"
          test -n "$manifest"; test -n "$checksums"; test -n "$setup"
          cp "$manifest" release-normalized/candidate-manifest.json
          cp "$checksums" release-normalized/SHA256SUMS.txt
          cp "$setup" release-normalized/
          find release-normalized -maxdepth 1 -type f -print | sort

      - name: Verify V3 candidate manifest and SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("release-normalized")
          manifest = json.loads((root / "candidate-manifest.json").read_text(encoding="utf-8-sig"))
          target_sha = os.environ["TARGET_SHA"]
          assert manifest["target_sha"] == target_sha
          assert manifest["validation"] == "passed"
          filename = manifest["installer"]["filename"]
          expected_sha256 = manifest["installer"]["sha256"]
          setup = root / filename
          assert setup.is_file(), setup
          actual_sha256 = hashlib.sha256(setup.read_bytes()).hexdigest()
          assert actual_sha256 == expected_sha256, (actual_sha256, expected_sha256)
          print(f"SHA256: {actual_sha256}")
          print("Candidate SHA and digest verified.")
          PY

      - name: Verify SHA256SUMS evidence
        shell: bash
        run: |
          set -euo pipefail
          cd release-normalized
          installer="$(find . -maxdepth 1 -type f -name 'Research-OS-V3-Setup-*-x64.exe' -print -quit)"
          test -n "$installer"
          expected="$(awk -v file="$(basename "$installer")" '$2 == file || $2 == "*" file {print $1; exit}' SHA256SUMS.txt)"
          test -n "$expected"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          test "$actual" = "$expected"
          echo "SHA256SUMS evidence verified."

      - name: Build immutable release evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > release-evidence-metadata.json <<'JSON'
          {
            "gates": {
              "SOURCE": true,
              "QUALITY": true,
              "BUILD": true,
              "IDENTITY": true,
              "PACKAGE": true,
              "INSTALL_E2E": true,
              "PROVENANCE": true,
              "LINEAGE": true,
              "CANDIDATE": true
            },
            "protected_gates": {
              "TARGET_SHA": true,
              "OWNER_BUILD_IDENTITY": true,
              "SHA256": true,
              "INSTALLED_PROVENANCE": true,
              "CANONICAL_LINEAGE": true
            }
          }
          JSON
          python3 tools/immutable_workflow_evidence.py \
            --workflow "Research OS Release" \
            --run-id "${{ github.run_id }}" \
            --commit "$TARGET_SHA" \
            --metadata release-evidence-metadata.json \
            --input release-normalized/candidate-manifest.json \
            --input release-normalized/SHA256SUMS.txt

      - name: Final Certification Gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/certify_release_spine.py \
            --evidence reports/IMMUTABLE_EVIDENCE.json \
            --target-sha "$TARGET_SHA"
          grep -q '"status": "PASS"' reports/RELEASE_CERTIFICATION.json
          grep -q '"certified": true' reports/RELEASE_CERTIFICATION.json
          echo "RELEASE_CERTIFICATION_GATE=PASS"

      - name: Upload release certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-os-release-certification-${{ env.TARGET_SHA }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-release-ready-${{ env.TARGET_SHA }}
          path: release-normalized/**
          if-no-files-found: error
          retention-days: 30

      - name: Validate release metadata
        if: ${{ inputs.publish == true }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag_name }}"
          if [ -z "$tag" ]; then tag="research-os-${TARGET_SHA:0:12}"; fi
          case "$tag" in refs/*) exit 1;; esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: ${{ inputs.publish == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f reports/RELEASE_CERTIFICATION.json
          grep -q '"certified": true' reports/RELEASE_CERTIFICATION.json
          setup="$(find release-normalized -maxdepth 1 -type f -name 'Research-OS-V3-Setup-*-x64.exe' -print -quit)"
          test -n "$setup"
          gh release create "$RELEASE_TAG" "$setup" release-normalized/SHA256SUMS.txt release-normalized/candidate-manifest.json --repo "${{ github.repository }}" --target "$TARGET_SHA" --title "Research OS $RELEASE_TAG" --notes "Verified Research OS V3 candidate $TARGET_SHA"

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Research OS Release"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Candidate run: \`$CANDIDATE_RUN_ID\`"
            echo "- Publish requested: \`${{ inputs.publish }}\`"
            if [ -n "${RELEASE_TAG:-}" ]; then echo "- Release tag: \`$RELEASE_TAG\`"; fi
            echo "- Certification: \`$(test -f reports/RELEASE_CERTIFICATION.json && grep -q '\"certified\": true' reports/RELEASE_CERTIFICATION.json && echo PASS || echo FAIL)\`"
          } >> "$GITHUB_STEP_SUMMARY"
