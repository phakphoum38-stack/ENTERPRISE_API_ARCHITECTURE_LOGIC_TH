name: Temporary Candidate Dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-dispatch-candidate.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run candidate.yml --repo "${{ github.repository }}" -f target_sha=92f32a8cfc382973988598437bb8393caf438307
