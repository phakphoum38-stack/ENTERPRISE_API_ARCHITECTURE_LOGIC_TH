name: Temporary Candidate Dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-dispatch-candidate.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run candidate.yml --repo "${{ github.repository }}" -f target_sha=4423fdf63ee8fdd81f4d50a28bc773cf858d7d1e
