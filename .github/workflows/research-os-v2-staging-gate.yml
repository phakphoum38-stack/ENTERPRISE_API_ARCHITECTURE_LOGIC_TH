name: Research OS V2 Staging Gate

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact V2 commit deployed to staging
        required: true
        type: string
      api_base_url:
        description: HTTPS base URL of the V2 API staging service
        required: true
        type: string
      developer_base_url:
        description: HTTPS base URL of the Developer Platform staging service
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: research-os-v2-staging-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  live-staging-gate:
    name: Exact-SHA live V2 staging health and security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      DEVELOPER_BASE_URL: ${{ inputs.developer_base_url }}
    steps:
      - name: Validate immutable staging inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "target_sha must be a full commit SHA"; exit 1; }
          [[ "$API_BASE_URL" == https://* ]] || { echo "api_base_url must use HTTPS"; exit 1; }
          [[ "$DEVELOPER_BASE_URL" == https://* ]] || { echo "developer_base_url must use HTTPS"; exit 1; }

      - name: Checkout exact deployed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify V2 API staging health and readiness
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['API_BASE_URL'].rstrip('/')
          def get(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':'ResearchOS-Staging-Gate/2'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status, json.load(r)
          status, health=get('/health')
          assert status == 200, status
          assert health.get('status') == 'ok', health
          status, ready=get('/v2/health/readiness')
          assert status == 200, status
          assert ready.get('ready') is True, ready
          storage=ready.get('storage') or {}
          assert storage.get('writable') is True, ready
          print('V2 API staging health/readiness passed.')
          PY

      - name: Verify Developer staging public boundary
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          base=os.environ['DEVELOPER_BASE_URL'].rstrip('/')
          def request(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':'ResearchOS-Staging-Gate/2'})
              try:
                  return urllib.request.urlopen(req, timeout=15)
              except urllib.error.HTTPError as exc:
                  return exc
          with request('/health') as r:
              assert r.status == 200, r.status
              health=json.load(r)
              assert health.get('status') == 'ok', health
              assert health.get('identity_assertions') == 'signed_hmac_sha256', health
          with request('/v2/developer/auth/config') as r:
              assert r.status == 200, r.status
              config=json.load(r)
              assert config.get('assertion_mode') == 'signed_hmac_sha256', config
              assert config.get('legacy_identity_headers') is False, config
          with request('/v2/developer/trial') as r:
              assert r.status == 200, r.status
              trial=json.load(r)
              assert trial.get('registration_required') is False, trial
              assert trial.get('data_source') == 'synthetic_demo_only', trial
              assert 'real_file_access' in trial.get('restricted', []), trial
          with request('/v2/developer/session') as r:
              assert r.status == 401, r.status
              denied=json.load(r)
              assert denied.get('error', {}).get('code') == 'identity_required', denied
          print('Developer staging public/security boundary passed.')
          PY

      - name: Verify Developer app security headers
        run: |
          python - <<'PY'
          import os, urllib.request
          url=os.environ['DEVELOPER_BASE_URL'].rstrip('/') + '/app'
          req=urllib.request.Request(url, headers={'User-Agent':'ResearchOS-Staging-Gate/2'})
          with urllib.request.urlopen(req, timeout=15) as r:
              body=r.read().decode('utf-8', errors='replace')
              csp=r.headers.get('Content-Security-Policy','')
              assert r.status == 200, r.status
              assert "frame-ancestors 'none'" in csp, csp
              assert "base-uri 'none'" in csp, csp
              assert r.headers.get('X-Frame-Options') == 'DENY', dict(r.headers)
              assert r.headers.get('Cache-Control') == 'no-store', dict(r.headers)
              assert 'Developer Access Center' in body, body[:300]
          print('Developer app security headers passed.')
          PY

      - name: Record staging-only result
        if: always()
        run: |
          {
            echo "# Research OS V2 Staging Gate"
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- API staging: \`$API_BASE_URL\`"
            echo "- Developer staging: \`$DEVELOPER_BASE_URL\`"
            echo "- This workflow validates staging only. It does not merge, tag, release, or deploy production."
          } >> "$GITHUB_STEP_SUMMARY"
