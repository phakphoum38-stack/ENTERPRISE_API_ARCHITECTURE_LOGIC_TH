name: PostgreSQL Integration Gate

on:
  pull_request:
    paths:
      - 'adapters/postgres/**'
      - 'tests/integration/**'
      - 'docker-compose.postgres-test.yml'
      - '.github/workflows/postgres-integration.yml'
  push:
    branches: [main]

jobs:
  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
          POSTGRES_DB: workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://workflow:workflow@localhost:5432/workflow_test
      PGPASSWORD: workflow

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg[binary]
      - name: Apply schema
        run: psql "$DATABASE_URL" -f adapters/postgres/schema.sql
      - name: Run PostgreSQL integration gate
        run: pytest -q tests/integration/test_postgres_fencing.py
