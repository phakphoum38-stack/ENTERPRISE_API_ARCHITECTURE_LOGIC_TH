name: Research OS V2 RC1 Live Staging Check

on:
  push:
    branches:
      - validate/v2-rc1-staging-be8a4bce

permissions:
  contents: read

jobs:
  live-staging-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: be8a4bce033e3873eb71254b10b6e24cd0fd2110
      API_BASE_URL: https://research-os-api-v2-staging.onrender.com
      DEVELOPER_BASE_URL: https://research-os-developer-v2-staging.onrender.com
    steps:
      - name: Checkout exact RC candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify V2 API staging health and readiness
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['API_BASE_URL'].rstrip('/')
          def get(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':'ResearchOS-RC1-Staging-Check/1'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, json.load(r)
          status, health=get('/health')
          assert status == 200, status
          assert health.get('status') == 'ok', health
          status, ready=get('/v2/health/readiness')
          assert status == 200, status
          assert ready.get('ready') is True, ready
          storage=ready.get('storage') or {}
          assert storage.get('writable') is True, ready
          print('RC1 V2 API staging health/readiness passed.')
          PY

      - name: Verify Developer staging boundary
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          base=os.environ['DEVELOPER_BASE_URL'].rstrip('/')
          def request(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':'ResearchOS-RC1-Staging-Check/1'})
              try:
                  return urllib.request.urlopen(req, timeout=20)
              except urllib.error.HTTPError as exc:
                  return exc
          with request('/health') as r:
              assert r.status == 200, r.status
              health=json.load(r)
              assert health.get('status') == 'ok', health
              assert health.get('identity_assertions') == 'signed_hmac_sha256', health
          with request('/v2/developer/auth/config') as r:
              assert r.status == 200, r.status
              config=json.load(r)
              assert config.get('assertion_mode') == 'signed_hmac_sha256', config
              assert config.get('legacy_identity_headers') is False, config
          with request('/v2/developer/trial') as r:
              assert r.status == 200, r.status
              trial=json.load(r)
              assert trial.get('registration_required') is False, trial
              assert trial.get('data_source') == 'synthetic_demo_only', trial
              assert 'real_file_access' in trial.get('restricted', []), trial
          with request('/v2/developer/session') as r:
              assert r.status == 401, r.status
              denied=json.load(r)
              assert denied.get('error', {}).get('code') == 'identity_required', denied
          print('RC1 Developer staging boundary passed.')
          PY

      - name: Verify Developer app security headers
        run: |
          python - <<'PY'
          import os, urllib.request
          url=os.environ['DEVELOPER_BASE_URL'].rstrip('/') + '/app'
          req=urllib.request.Request(url, headers={'User-Agent':'ResearchOS-RC1-Staging-Check/1'})
          with urllib.request.urlopen(req, timeout=20) as r:
              body=r.read().decode('utf-8', errors='replace')
              csp=r.headers.get('Content-Security-Policy','')
              assert r.status == 200, r.status
              assert "frame-ancestors 'none'" in csp, csp
              assert "base-uri 'none'" in csp, csp
              assert r.headers.get('X-Frame-Options') == 'DENY', dict(r.headers)
              assert r.headers.get('Cache-Control') == 'no-store', dict(r.headers)
              assert 'Developer Access Center' in body, body[:300]
          print('RC1 Developer app security headers passed.')
          PY
