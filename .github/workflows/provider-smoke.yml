name: Provider Smoke Test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: AI provider to test
        required: true
        default: mock
        type: choice
        options:
          - mock
          - openai-compatible
          - anthropic
          - gemini

permissions:
  contents: read

concurrency:
  group: provider-smoke-${{ github.ref }}-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Test ${{ inputs.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Provider selected from Run workflow
      RESEARCH_OS_PROVIDER: ${{ inputs.provider }}

      # OpenAI / OpenAI-compatible
      # Uses the GitHub Secret and Variables you already created.
      RESEARCH_OS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEARCH_OS_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      RESEARCH_OS_OPENAI_ENDPOINT: ${{ vars.OPENAI_ENDPOINT }}

      # Anthropic
      RESEARCH_OS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEARCH_OS_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      RESEARCH_OS_ANTHROPIC_ENDPOINT: ${{ vars.ANTHROPIC_ENDPOINT }}

      # Gemini
      RESEARCH_OS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEARCH_OS_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      RESEARCH_OS_GEMINI_ENDPOINT_TEMPLATE: ${{ vars.GEMINI_ENDPOINT_TEMPLATE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile provider tools
        run: |
          python -m py_compile tools/research_os_api/providers.py
          python -m py_compile tools/research_os_api/provider_readiness.py
          python -m py_compile tools/research_os_api/provider_smoke.py

      - name: Configure OpenAI endpoint
        if: ${{ inputs.provider == 'openai-compatible' }}
        shell: bash
        run: |
          if [ -z "${RESEARCH_OS_OPENAI_ENDPOINT}" ]; then
            echo "RESEARCH_OS_OPENAI_ENDPOINT=https://api.openai.com/v1/chat/completions" >> "$GITHUB_ENV"
          fi

      - name: Configure default OpenAI model
        if: ${{ inputs.provider == 'openai-compatible' }}
        shell: bash
        run: |
          if [ -z "${RESEARCH_OS_OPENAI_MODEL}" ]; then
            echo "RESEARCH_OS_OPENAI_MODEL=gpt-4.1-mini" >> "$GITHUB_ENV"
          fi

      - name: Validate provider configuration
        working-directory: tools/research_os_api
        run: python provider_readiness.py

      - name: Run live provider smoke test
        working-directory: tools/research_os_api
        run: python provider_smoke.py

      - name: Report success
        if: success()
        run: |
          echo "Provider smoke test passed."
          echo "Provider: ${{ inputs.provider }}"
          echo "No API keys, prompts, or full responses were printed."
