name: Canonical Source Lineage Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/canonical-release-lineage-gate-current-main
    paths:
      - ".github/workflows/research-os-windows-artifact.yml"
      - ".github/workflows/owner-special-friend.yml"
      - "owner_special/scripts/build_bundle.py"
      - ".github/workflows/canonical-source-lineage-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical Research OS + Friend release lineage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Verify Windows artifact follows the canonical SHA
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/research-os-windows-artifact.yml"
          test -f "$workflow"

          friend_ref="$(sed -n 's/^  FRIEND_REF: *//p' "$workflow" | head -n 1)"
          test -n "$friend_ref"

          if [[ "$friend_ref" != '${{ github.sha }}' ]]; then
            echo "CANONICAL_LINEAGE_GATE=FAIL"
            echo "Unexpected FRIEND_REF expression: $friend_ref"
            echo "Expected: \${{ github.sha }}"
            exit 1
          fi

          echo "CANONICAL_LINEAGE_GATE=PASS"
          echo "Canonical source SHA: $GITHUB_SHA"
          echo "FRIEND_REF=$friend_ref"

      - name: Verify Windows artifact checks out Friend at the exact SHA
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/research-os-windows-artifact.yml"
          grep -q 'ref: \${{ env.FRIEND_REF }}' "$workflow"
          grep -q 'rev-parse HEAD' "$workflow"
          grep -q 'friendSha -ne \$env:GITHUB_SHA' "$workflow"
          echo "CANONICAL_CHECKOUT_GATE=PASS"

      - name: Verify canonical Owner release control pipeline
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/owner-special-friend.yml"
          test -f "$workflow"
          grep -q 'owner-bundle:' "$workflow"
          grep -q 'python owner_special/scripts/build_bundle.py' "$workflow"
          grep -q 'owner-special-setup-\${{ github.sha }}' "$workflow"
          echo "OWNER_RELEASE_CONTROL_GATE=PASS"

      - name: Verify final bundle is bound to the canonical source and validated installer
        shell: bash
        run: |
          set -euo pipefail
          script="owner_special/scripts/build_bundle.py"
          test -f "$script"
          grep -q 'GITHUB_SHA' "$script"
          grep -q 'Research-OS-Owner-Special-Setup-1.3.1-x64.exe' "$script"
          grep -q 'owner-v1.3-validation.json' "$script"
          grep -q 'RELEASE_MANIFEST.txt' "$script"
          grep -q 'BUNDLE_SHA256.txt' "$script"
          echo "FINAL_RELEASE_LINEAGE_GATE=PASS"
