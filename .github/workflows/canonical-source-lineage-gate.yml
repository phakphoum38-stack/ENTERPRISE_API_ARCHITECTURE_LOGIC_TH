name: Canonical Source Lineage Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/canonical-release-lineage-gate-current-main
      - fix/canonical-lineage-target-sha-hardening
      - fix/canonical-lineage-runtime-expression-hardening
      - fix/release-contract-lineage
    paths:
      - ".github/workflows/research-os-windows-artifact.yml"
      - ".github/workflows/owner-special-friend.yml"
      - "owner_special/scripts/build_bundle.py"
      - ".github/workflows/canonical-source-lineage-gate.yml"

permissions:
  contents: read

concurrency:
  group: canonical-source-lineage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical Research OS + Friend release lineage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Verify Research OS Windows artifact identity contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/research-os-windows-artifact.yml"
          test -f "$workflow"

          grep -qF 'APP_PROJECT_NAME: research_os_flutter' "$workflow"
          grep -qF 'APP_EXE_NAME: research_os_flutter.exe' "$workflow"
          grep -qF 'APP_PRODUCT_NAME: Research OS' "$workflow"
          grep -qF 'APP_COMPANY_NAME: Research OS Team' "$workflow"
          grep -qF 'Research-OS-Windows-x64-${{ github.sha }}' "$workflow"
          if grep -qF 'Research-OS-Windows-x64-Friend-Complete-${{ github.sha }}' "$workflow"; then
            echo 'CANONICAL_LINEAGE_GATE=FAIL'
            echo 'Research OS Windows workflow must not publish the Friend Complete artifact.'
            exit 1
          fi

          echo 'CANONICAL_LINEAGE_GATE=PASS'
          echo "Canonical source SHA: $GITHUB_SHA"
          echo 'Research OS artifact contract: Research-OS-Windows-x64-${{ github.sha }}'

      - name: Verify Research OS workflow does not bootstrap canonical source
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/research-os-windows-artifact.yml"
          grep -qF "RUNNER_TEMP" "$workflow"
          grep -qF 'flutter create --platforms=windows --project-name=$env:APP_PROJECT_NAME .' "$workflow"
          grep -qF 'research-os-flutter-windows' "$workflow"
          echo 'RESEARCH_OS_BOOTSTRAP_ISOLATION_GATE=PASS'

      - name: Verify canonical Owner TARGET_SHA contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/owner-special-friend.yml"
          test -f "$workflow"

          expected_target_sha='$'
          expected_target_sha+='{{ inputs.target_sha || github.sha }}'
          expected_target_ref='$'
          expected_target_ref+='{{ env.TARGET_SHA }}'

          grep -qF "TARGET_SHA: $expected_target_sha" "$workflow"
          grep -qF "ref: $expected_target_ref" "$workflow"
          grep -qF "owner-special-desktop-validated-$expected_target_ref" "$workflow"
          grep -qF "owner-special-setup-validated-$expected_target_ref" "$workflow"
          grep -qF "owner-special-setup-$expected_target_ref" "$workflow"
          echo "OWNER_TARGET_SHA_CONTRACT=PASS"

      - name: Verify canonical Owner release control pipeline
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/owner-special-friend.yml"
          test -f "$workflow"

          expected_target_ref='$'
          expected_target_ref+='{{ env.TARGET_SHA }}'

          grep -qF 'owner-bundle:' "$workflow"
          grep -qF 'python owner_special/scripts/build_bundle.py' "$workflow"
          grep -qF "owner-special-setup-$expected_target_ref" "$workflow"
          echo "OWNER_RELEASE_CONTROL_GATE=PASS"

      - name: Verify final bundle is bound to the canonical source and validated installer
        shell: bash
        run: |
          set -euo pipefail
          script="owner_special/scripts/build_bundle.py"
          test -f "$script"
          grep -qF 'GITHUB_SHA' "$script"
          grep -qF 'source_sha = os.environ.get("GITHUB_SHA", "").strip()' "$script"
          grep -qF 'Research-OS-Owner-Special-Setup-1.3.1-x64.exe' "$script"
          grep -qF 'owner-v1.3-validation.json' "$script"
          grep -qF 'RELEASE_MANIFEST.txt' "$script"
          grep -qF 'BUNDLE_SHA256.txt' "$script"
          grep -qF 'owner_setup_sha256' "$script"
          grep -qF 'validation_evidence_sha256' "$script"
          echo "FINAL_RELEASE_LINEAGE_GATE=PASS"
