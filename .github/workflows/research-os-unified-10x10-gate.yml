name: Research OS Unified 10x10 Exact SHA Gate

on:
  push:
    branches: [main, compat/pr41-pr47-8790]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  unified-gate:
    name: V3 Master 8788 + 10x10 exact runtime evidence
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout workflow definition
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout exact target SHA
        shell: pwsh
        run: |
          $sha=$env:TARGET_SHA.Trim()
          if($sha -notmatch '^[0-9a-fA-F]{40}$'){throw "Invalid TARGET_SHA: $sha"}
          git fetch --no-tags --depth=1 origin $sha
          if($LASTEXITCODE -ne 0){throw "Failed to fetch TARGET_SHA $sha"}
          git checkout --detach FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw "Failed to checkout TARGET_SHA $sha"}

      - name: Verify exact SHA
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:TARGET_SHA){throw "Exact SHA mismatch: expected $env:TARGET_SHA got $actual"}
          Write-Host "EXACT_SHA=$actual"

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Start Main API 8787
        shell: pwsh
        run: |
          $data="$env:RUNNER_TEMP\ResearchOSData"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          .\scripts\start-research-os-local.ps1 -DataDir $data -Provider mock -Port 8787 -Background
          for($i=0;$i-lt 40;$i++){try{$h=Invoke-RestMethod 'http://127.0.0.1:8787/health' -TimeoutSec 2;if($h.status -eq 'ok'){Write-Host 'PORT_8787=PASS';return}}catch{};Start-Sleep -Milliseconds 500}
          throw '8787 did not become ready'

      - name: Start and execute actual V3 Master 8788 + 10x10
        shell: pwsh
        run: |
          $data="$env:RUNNER_TEMP\ResearchOSV3"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:RESEARCH_OS_DATA_DIR=$data
          $env:PYTHONPATH=$PWD
          python -c "import v3.research_os_v3.service as svc; print('V3_IMPORT=' + [string]$svc.__file__)"
          if($LASTEXITCODE -ne 0){throw 'V3 service import failed'}
          $out="$data\v3.out.log";$err="$data\v3.err.log"
          $launcher="$data\start-v3-master.py"
          @'
          from v3.research_os_v3.service import V3LocalService
          V3LocalService(host="127.0.0.1", port=8788).serve_forever()
          '@ | Set-Content $launcher -Encoding utf8
          $p=Start-Process python -ArgumentList @($launcher) -WorkingDirectory $PWD -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $p.Id | Out-File "$env:RUNNER_TEMP\v3.pid" -Encoding ascii
          $ready=$false
          for($i=0;$i-lt 40;$i++){
            if($p.HasExited){break}
            try{$h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 2;if($h.status -eq 'ok'){$ready=$true;break}}catch{}
            Start-Sleep -Milliseconds 500
          }
          if(-not $ready){
            Write-Host '--- V3 stdout ---';Get-Content $out -ErrorAction SilentlyContinue
            Write-Host '--- V3 stderr ---';Get-Content $err -ErrorAction SilentlyContinue
            if($p.HasExited){throw "8788 V3 Master exited with code $($p.ExitCode) before becoming ready"}
            throw '8788 V3 Master did not become ready'
          }
          Write-Host 'PORT_8788_V3_MASTER=PASS'
          if($p.HasExited){throw "8788 V3 Master exited unexpectedly after health check"}
          $master=Invoke-RestMethod 'http://127.0.0.1:8788/v3/master?tasks=10000000000&risk=1&parallelism=1' -TimeoutSec 10
          if($master.contract -ne 'unified-master-orchestrator-v3-full'){throw "Unexpected contract: $($master.contract)"}
          if($master.system_maximum_scale -ne '10^10'){throw "Unexpected scale: $($master.system_maximum_scale)"}
          if([int64]$master.system_maximum_logical_capacity -ne 10000000000){throw "Unexpected logical capacity: $($master.system_maximum_logical_capacity)"}
          if($master.capacity_policy -ne 'lazy-bounded-execution'){throw "Unexpected policy: $($master.capacity_policy)"}
          if(-not $master.scale){throw 'Missing scale decision'}
          $evidence="$env:RUNNER_TEMP\v3-evidence";New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $master | ConvertTo-Json -Depth 30 | Set-Content "$evidence\MASTER_V3_EVIDENCE.json" -Encoding utf8
          @{target_sha=$env:TARGET_SHA;endpoint='127.0.0.1:8788/v3/master';contract=$master.contract;scale=$master.scale;system_maximum_scale=$master.system_maximum_scale;system_maximum_logical_capacity=[int64]$master.system_maximum_logical_capacity;capacity_policy=$master.capacity_policy} | ConvertTo-Json | Set-Content "$evidence\UNIFIED_GATE.json" -Encoding utf8
          Get-FileHash "$evidence\MASTER_V3_EVIDENCE.json" -Algorithm SHA256 | Format-List | Out-File "$evidence\MASTER_V3_EVIDENCE.sha256.txt"
          Get-FileHash "$evidence\UNIFIED_GATE.json" -Algorithm SHA256 | Format-List | Out-File "$evidence\UNIFIED_GATE.sha256.txt"
          Write-Host 'V3_MASTER_CONTRACT=PASS'
          Write-Host "V3_MASTER_SCALE=$($master.scale)"
          Write-Host 'V3_MASTER_10X10=PASS'
          Write-Host "V3_MASTER_LOGICAL_CAPACITY=$($master.system_maximum_logical_capacity)"

      - name: Upload V3 Master evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-master-exact-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}\v3-evidence\*
          if-no-files-found: error

      - name: Cleanup services
        if: always()
        shell: pwsh
        run: |
          .\scripts\stop-research-os-local.ps1 -Port 8787 -ErrorAction SilentlyContinue
          if(Test-Path "$env:RUNNER_TEMP\v3.pid"){$p=(Get-Content "$env:RUNNER_TEMP\v3.pid" -ErrorAction SilentlyContinue);if($p){Stop-Process -Id ([int]$p) -Force -ErrorAction SilentlyContinue}}
