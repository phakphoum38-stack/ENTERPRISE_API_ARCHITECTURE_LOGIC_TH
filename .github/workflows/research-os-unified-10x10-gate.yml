name: Research OS Unified 10x10 Exact SHA Gate

on:
  push:
    branches:
      - compat/pr41-pr47-8790
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: research-os-unified-10x10-${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  unified-gate:
    name: Unified 8787 + V3 Master 8788 + 8790 + 10x10 gate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
      RESEARCH_OS_DATA_DIR: ${{ runner.temp }}\\ResearchOSData
      V3_DATA_DIR: ${{ runner.temp }}\\ResearchOSV3
      FRIEND_DATA_DIR: ${{ runner.temp }}\\ResearchOSFriend

    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify checked out SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) { throw "Exact SHA mismatch: expected $env:TARGET_SHA, got $actual" }
          Write-Host "EXACT_SHA=$actual"

      - name: Verify required sources
        shell: pwsh
        run: |
          foreach ($path in @("v3\\research_os_v3\\service.py","owner_special\\scripts\\run_friend_service.py","scripts\\start-research-os-local.ps1")) {
            if (-not (Test-Path $path)) { throw "Required source missing: $path" }
          }
          Write-Host "REQUIRED_SOURCES=PASS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run Research OS Python tests
        shell: pwsh
        run: |
          python -m compileall -q tools/research_os_api tools/research_curator v3 owner_special
          if ($LASTEXITCODE -ne 0) { throw "Python compile failed" }
          python -m unittest discover -s tools/research_os_api -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Research OS API tests failed" }

      - name: Run Flutter checks and Windows build
        working-directory: apps/research_os_flutter
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw "Flutter analyze failed" }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed" }
          flutter config --enable-windows-desktop
          if (-not (Test-Path windows)) { flutter create --platforms=windows --project-name research_os_flutter . }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed" }

      - name: Start Main API on 8787
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RESEARCH_OS_DATA_DIR | Out-Null
          .\\scripts\\start-research-os-local.ps1 -DataDir $env:RESEARCH_OS_DATA_DIR -Provider mock -Port 8787 -Background
          $ready = $false
          for ($i=0; $i -lt 40; $i++) {
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:8787/health" -TimeoutSec 2
              if ($h.status -eq "ok") { $ready = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "8787 did not become ready" }
          Write-Host "PORT_8787_MAIN_API=PASS"

      - name: Start actual V3 Master Local Service on 8788
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:V3_DATA_DIR | Out-Null
          $env:RESEARCH_OS_DATA_DIR = $env:V3_DATA_DIR
          $v3Log = Join-Path $env:V3_DATA_DIR "v3-service.log"
          $v3Err = Join-Path $env:V3_DATA_DIR "v3-service.err.log"
          $code = 'from v3.research_os_v3.service import V3LocalService; V3LocalService(host="127.0.0.1", port=8788).serve_forever()'
          $p = Start-Process python -ArgumentList @("-c",$code) -WorkingDirectory $PWD -RedirectStandardOutput $v3Log -RedirectStandardError $v3Err -PassThru
          "V3_PID=$($p.Id)" | Out-File "$env:RUNNER_TEMP\\v3.pid" -Encoding ascii
          $ready = $false
          for ($i=0; $i -lt 40; $i++) {
            if ($p.HasExited) { break }
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:8788/health" -TimeoutSec 2
              if ($h.status -eq "ok") { $ready = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) {
            Get-Content $v3Log -ErrorAction SilentlyContinue
            Get-Content $v3Err -ErrorAction SilentlyContinue
            throw "V3 Master service on 8788 did not become ready"
          }
          Write-Host "PORT_8788_V3_MASTER=PASS"

      - name: Validate actual V3 Unified Master and 10x10 contract
        shell: pwsh
        run: |
          $master = Invoke-RestMethod "http://127.0.0.1:8788/v3/master?tasks=10000000000&risk=1&parallelism=1" -TimeoutSec 10
          if ($master.contract -ne "unified-master-orchestrator-v3-full") { throw "Unexpected V3 Master contract: $($master.contract)" }
          if ($master.system_maximum_scale -ne "10^10") { throw "Unexpected V3 Master maximum scale: $($master.system_maximum_scale)" }
          if ([int64]$master.system_maximum_logical_capacity -ne 10000000000) { throw "Unexpected V3 Master logical capacity: $($master.system_maximum_logical_capacity)" }
          if ($master.capacity_policy -ne "lazy-bounded-execution") { throw "Unexpected V3 Master capacity policy: $($master.capacity_policy)" }
          if (-not $master.scale) { throw "V3 Master scale decision missing" }
          New-Item -ItemType Directory -Force -Path $env:V3_DATA_DIR | Out-Null
          $master | ConvertTo-Json -Depth 30 | Set-Content "$env:V3_DATA_DIR\\master-evidence.json" -Encoding utf8
          Write-Host "V3_MASTER_CONTRACT=PASS"
          Write-Host "V3_MASTER_SCALE=$($master.scale)"
          Write-Host "V3_MASTER_10X10=PASS"

      - name: Start Owner Friend on 8790
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:FRIEND_DATA_DIR | Out-Null
          $env:PYTHONPATH = (Resolve-Path "owner_special").Path
          $audit = Join-Path $env:FRIEND_DATA_DIR "friend-audit.jsonl"
          $p = Start-Process python -ArgumentList @("owner_special\\scripts\\run_friend_service.py","--owner-id","owner","--host","127.0.0.1","--port","8790","--data-root",$env:FRIEND_DATA_DIR,"--audit-path",$audit,"--repository-root",$PWD) -PassThru
          "FRIEND_PID=$($p.Id)" | Out-File "$env:RUNNER_TEMP\\friend.pid" -Encoding ascii
          $ready = $false
          for ($i=0; $i -lt 40; $i++) {
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:8790/owner/health" -TimeoutSec 2
              if ($h.status -eq "ok") { $ready = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "8790 Owner Friend service did not become ready" }
          Write-Host "PORT_8790_OWNER=PASS"

      - name: Validate Owner identity and service topology
        shell: pwsh
        run: |
          $headers = @{
            "X-Research-OS-Owner" = "owner"
            "X-Research-OS-Profile" = "default"
            "X-Research-OS-Session" = "default"
          }
          $status = Invoke-RestMethod "http://127.0.0.1:8790/owner/status" -Method Get -Headers $headers -TimeoutSec 10
          if ($status.owner_id -ne "owner") { throw "Owner identity rejected or mismatched" }
          if ($status.profile_id -ne "default") { throw "Owner profile mismatch" }
          if ($status.session_id -ne "default") { throw "Owner session mismatch" }
          if (-not $status.v3_bridge.available) { throw "V3 bridge unavailable" }
          $listeners = @()
          $listeners += Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue
          $listeners += Get-NetTCPConnection -LocalPort 8788 -State Listen -ErrorAction SilentlyContinue
          $listeners += Get-NetTCPConnection -LocalPort 8790 -State Listen -ErrorAction SilentlyContinue
          $unsafe = @($listeners | Where-Object { $_.LocalAddress -notin @('127.0.0.1','::1') })
          if ($unsafe) { throw "8787/8788/8790 must listen on loopback only" }
          Write-Host "OWNER_IDENTITY=PASS"
          Write-Host "V3_BRIDGE=PASS"
          Write-Host "LOOPBACK_TOPOLOGY=PASS"

      - name: Produce and upload gate evidence
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\\unified-gate"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:V3_DATA_DIR\\master-evidence.json" "$out\\MASTER_V3_EVIDENCE.json" -Force
          @{
            target_sha = $env:TARGET_SHA
            main_api = '127.0.0.1:8787'
            unified_master_v3 = '127.0.0.1:8788/v3/master'
            owner_friend_v3 = '127.0.0.1:8790'
            owner_id = 'owner'
            profile_id = 'default'
            session_id = 'default'
            ten_x_ten = '10^10 / 10000000000'
            capacity_policy = 'lazy-bounded-execution'
          } | ConvertTo-Json | Set-Content "$out\\UNIFIED_GATE.json" -Encoding utf8
          Get-FileHash "$out\\UNIFIED_GATE.json" -Algorithm SHA256 | Format-List | Out-File "$out\\UNIFIED_GATE.sha256.txt"
          Get-FileHash "$out\\MASTER_V3_EVIDENCE.json" -Algorithm SHA256 | Format-List | Out-File "$out\\MASTER_V3_EVIDENCE.sha256.txt"

      - name: Upload unified gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-os-unified-10x10-gate-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}\\unified-gate\\*

      - name: Cleanup services
        if: always()
        shell: pwsh
        run: |
          .\\scripts\\stop-research-os-local.ps1 -Port 8787 -ErrorAction SilentlyContinue
          foreach ($file in @("$env:RUNNER_TEMP\\friend.pid","$env:RUNNER_TEMP\\v3.pid")) {
            if (Test-Path $file) {
              $pid = Get-Content $file -ErrorAction SilentlyContinue
              if ($pid) { Stop-Process -Id ([int]$pid) -Force -ErrorAction SilentlyContinue }
            }
          }
