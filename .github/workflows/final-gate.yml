name: V3.5 Master Final Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Validation-only release authority. This workflow must never write repository state.
permissions:
  contents: read

concurrency:
  group: v3-5-master-final-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  architecture:
    name: Architecture validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical architecture
        run: |
          set -euo pipefail
          test -f README.md
          for term in Identity Capability Policy Authorization Entitlement Execution Evidence; do
            grep -q "$term" README.md
          done
          test -f docs/V3_5_SYSTEM_STRUCTURE.md

  security-boundary:
    name: Security boundary validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mandatory deny boundaries
        run: |
          set -euo pipefail
          for term in \
            'Activation Lock bypass' \
            'Passcode bypass' \
            'MDM circumvention' \
            'Credential theft' \
            'Exploit delivery' \
            'Unauthorized device access' \
            'Security-control evasion'; do
            grep -q "$term" README.md
          done
      - name: Validate execution decision rule
        run: |
          set -euo pipefail
          grep -q 'Authorization == ALLOWED' README.md
          grep -q 'Entitlement == ACTIVE' README.md

  code-generation:
    name: Code generation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deterministic generation inputs
        run: |
          set -euo pipefail
          python tools/validate_generate_orchestrator.py
          python tools/validate_generate_determinism.py
      - name: Validate existing generator test surface
        run: |
          set -euo pipefail
          if [ -d tools/code_writer ]; then
            python -m unittest discover -s tools/code_writer -p 'test_*.py' -v
          else
            echo 'No code_writer test surface present; gate remains structural.'
          fi

  external-tool:
    name: External-tool validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Flutter boundary
        run: |
          set -euo pipefail
          grep -qi 'Flutter' README.md
          grep -qi 'external' README.md
          grep -qi 'client' README.md

  api-contract:
    name: API and contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate contract terminology
        run: |
          set -euo pipefail
          grep -q 'Authorization' README.md
          grep -q 'Entitlement' README.md
          grep -q 'correlation_id' README.md
          grep -q 'policy_version' README.md

  e2e:
    name: E2E validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run existing Research OS E2E tests when present
        env:
          PYTHONPATH: v3
        run: |
          set -euo pipefail
          if [ -d v3/tests ]; then
            python -m unittest discover -s v3/tests -p 'test_*.py' -v
          else
            echo 'No v3/tests directory present; E2E gate is structural on this branch.'
          fi

  production-readiness:
    name: Production readiness evidence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production readiness assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'render.yaml',
            'render.staging.yaml',
            'scripts/backup-research-os.ps1',
            'scripts/restore-research-os.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing production readiness asset: $path" }
          }
          $render = Get-Content render.yaml -Raw
          if ($render -notmatch 'healthCheckPath:\s*/health') { throw 'Production health check is not declared.' }
          if ($render -notmatch 'autoDeploy:\s*true') { throw 'Production deployment configuration is not declared.' }
          $staging = Get-Content render.staging.yaml -Raw
          if ($staging -notmatch '(?i)not mutated|auto-deployed') { throw 'Staging safety boundary is not declared.' }

      - name: Execute backup and restore recovery drill
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'research-os-production-readiness'
          $data = Join-Path $root 'source'
          $backups = Join-Path $root 'backups'
          $restored = Join-Path $root 'restored'
          New-Item -ItemType Directory -Force -Path $data,$backups,$restored | Out-Null
          Set-Content -Path (Join-Path $data 'readiness-fixture.txt') -Value 'production-readiness-recovery-fixture' -NoNewline
          New-Item -ItemType Directory -Force -Path (Join-Path $data 'nested') | Out-Null
          Set-Content -Path (Join-Path $data 'nested/state.json') -Value '{"state":"recoverable"}' -NoNewline

          & ./scripts/backup-research-os.ps1 -DataDir $data -BackupDir $backups
          $archive = Get-ChildItem $backups -Filter '*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $archive) { throw 'Backup archive was not produced.' }

          & ./scripts/restore-research-os.ps1 -Archive $archive.FullName -DataDir $restored

          $sourceFiles = Get-ChildItem $data -Recurse -File | ForEach-Object { $_.FullName.Substring($data.Length).TrimStart('\') } | Sort-Object
          $restoredFiles = Get-ChildItem $restored -Recurse -File | ForEach-Object { $_.FullName.Substring($restored.Length).TrimStart('\') } | Sort-Object
          if (($sourceFiles -join "`n") -ne ($restoredFiles -join "`n")) { throw 'Restore file inventory mismatch.' }
          foreach ($relative in $sourceFiles) {
            $sourceHash = (Get-FileHash (Join-Path $data $relative) -Algorithm SHA256).Hash
            $restoredHash = (Get-FileHash (Join-Path $restored $relative) -Algorithm SHA256).Hash
            if ($sourceHash -ne $restoredHash) { throw "Restore hash mismatch: $relative" }
          }

          "Backup/restore recovery drill passed for $($archive.Name)."

      - name: Execute existing worker recovery and observability evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = 'v3'
          python -m unittest v3.tests.test_worker_recovery_evidence v3.tests.test_worker_pool_observability -v

      - name: Publish production readiness evidence
        shell: pwsh
        run: |
          $evidence = @{
            schema = 'research-os.production-readiness.v1'
            status = 'PASS'
            commit = '${{ github.sha }}'
            workflow = '${{ github.workflow }}'
            run_id = '${{ github.run_id }}'
            evidence = @(
              'deployment-config: render.yaml + /health + autoDeploy',
              'staging-boundary: render.staging.yaml',
              'backup-restore: executable isolated recovery drill',
              'worker-recovery-observability: existing governed test surfaces'
            )
            production_mutation = $false
          } | ConvertTo-Json -Depth 5
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Set-Content -Path evidence/production-readiness.json -Value $evidence -Encoding utf8
          Get-Content evidence/production-readiness.json

      - name: Upload production readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-evidence-${{ github.sha }}
          path: evidence/production-readiness.json
          if-no-files-found: error

  release:
    name: Release validation
    runs-on: ubuntu-latest
    needs: [architecture, security-boundary, code-generation, external-tool, api-contract, e2e, production-readiness]
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only release contract
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" != "main"
          if grep -RInE \
            --exclude='final-gate.yml' \
            'git push .*main|git push origin HEAD:main|git push origin main' \
            .github/workflows; then
            echo 'Direct main push detected in workflow definitions.'
            exit 1
          fi
          echo 'All required V3.5 and production-readiness gates passed; release authority remains the PR merge process.'
