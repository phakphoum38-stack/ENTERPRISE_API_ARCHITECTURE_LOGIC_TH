name: ChatGPT Candidate Push Bridge

on:
  push:
    branches:
      - agent/candidate-security-scan-fix
    paths:
      - '.github/workflows/chatgpt-candidate-push.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-SHA Research OS Candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh workflow run candidate.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f target_sha="$TARGET_SHA"
          echo "Dispatched Research OS Candidate for $TARGET_SHA"
