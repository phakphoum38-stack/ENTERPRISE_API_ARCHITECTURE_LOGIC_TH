name: Research OS iOS IPA

on:
  push:
    branches:
      - 'feat/chatgpt-style-desktop-shell'
      - 'fix/ios-chat-responsive'
    paths:
      - 'apps/research_os_flutter/**'
      - 'scripts/apply-research-os-branding.py'
      - '.github/workflows/research-os-ios-ipa.yml'
  pull_request:
    paths:
      - 'apps/research_os_flutter/**'
      - 'scripts/apply-research-os-branding.py'
      - '.github/workflows/research-os-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-os-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-unsigned-ipa:
    # iOS PR validation is intentionally enabled to expose source/build regressions.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS target
        working-directory: apps/research_os_flutter
        run: flutter create . --platforms=ios --org com.phakphoum38 --project-name research_os_flutter

      - name: Apply Research OS branding
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/research-os-ios-branding"
          "$RUNNER_TEMP/research-os-ios-branding/bin/python" -m pip install --disable-pip-version-check pillow
          "$RUNNER_TEMP/research-os-ios-branding/bin/python" scripts/apply-research-os-branding.py --app-root apps/research_os_flutter --platform ios

      - name: Set iOS identity
        working-directory: apps/research_os_flutter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text(encoding='utf-8')
          out = []
          for line in text.splitlines():
              if 'PRODUCT_BUNDLE_IDENTIFIER =' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  current = line.split('=', 1)[1].strip().rstrip(';')
                  if 'RunnerTests' in current:
                      line = f'{indent}PRODUCT_BUNDLE_IDENTIFIER = com.phakphoum38.researchos.RunnerTests;'
                  else:
                      line = f'{indent}PRODUCT_BUNDLE_IDENTIFIER = com.phakphoum38.researchos;'
              out.append(line)
          project.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Research OS" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Research OS" ios/Runner/Info.plist || true

      - name: Flutter analyze and full test
        working-directory: apps/research_os_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Prove Check-in iPhone flow
        working-directory: apps/research_os_flutter
        run: flutter test test/check_in_page_test.dart --reporter expanded

      - name: Build unsigned iOS IPA
        working-directory: apps/research_os_flutter
        run: >-
          flutter build ipa --release --no-codesign
          --dart-define=RESEARCH_OS_API_BASE_URL=https://research-os-api-phakphoum.onrender.com

      - name: Verify native iOS build inputs
        working-directory: apps/research_os_flutter
        shell: bash
        run: |
          set -euo pipefail
          REGISTRANT="ios/Runner/GeneratedPluginRegistrant.swift"
          PODLOCK="ios/Podfile.lock"
          APP="build/ios/iphoneos/Runner.app"
          test -f "$REGISTRANT"
          test -f "$PODLOCK"
          test -d "$APP"
          test -f "$APP/Info.plist"
          echo "=== GeneratedPluginRegistrant.swift evidence ==="
          grep -nEi 'flutter_tts|speech_to_text|FlutterTts|SpeechToText|register' "$REGISTRANT" || true
          echo "=== Podfile.lock evidence ==="
          grep -nEi 'flutter_tts|speech_to_text|FlutterTts|SpeechToText' "$PODLOCK" || true
          echo "PASS: generated iOS project and Runner.app exist; plugin evidence recorded without assuming generated symbol names"

      - name: Verify iOS app and branding
        working-directory: apps/research_os_flutter
        shell: bash
        run: |
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display name: $DISPLAY_NAME"
          test "$BUNDLE_ID" = "com.phakphoum38.researchos"
          test "$DISPLAY_NAME" = "Research OS"

      - name: Verify and hash unsigned IPA
        working-directory: apps/research_os_flutter
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          test -s "$IPA"
          echo "IPA: $IPA"
          unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/Info.plist$'
          mkdir -p build/artifacts
          cp "$IPA" "build/artifacts/Research-OS-iOS-responsive-${GITHUB_SHA}.ipa"
          shasum -a 256 "build/artifacts/Research-OS-iOS-responsive-${GITHUB_SHA}.ipa" > "build/artifacts/Research-OS-iOS-responsive-${GITHUB_SHA}.ipa.sha256"
          cat "build/artifacts/Research-OS-iOS-responsive-${GITHUB_SHA}.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Research-OS-iOS-responsive-${{ github.sha }}
          path: |
            apps/research_os_flutter/build/artifacts/Research-OS-iOS-responsive-${{ github.sha }}.ipa
            apps/research_os_flutter/build/artifacts/Research-OS-iOS-responsive-${{ github.sha }}.ipa.sha256
          if-no-files-found: error
          retention-days: 30
