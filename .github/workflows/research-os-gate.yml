name: Research OS Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact SHA to validate and dispatch"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: research-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  PYTHONPATH: ${{ github.workspace }}/v3

jobs:
  python-quality:
    name: Python Build Test Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile Research OS
        run: python -m compileall -q v3/research_os_v3

      - name: Unit tests
        run: |
          python -m unittest discover -s v3/tests -p 'test_*.py' -v

      - name: Import smoke
        run: |
          python -c "import research_os_v3; print('research_os_v3 import: OK')"

      - name: Static analysis
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('v3/research_os_v3')
          files = sorted(root.glob('*.py'))
          assert files, 'no Research OS Python sources found'
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'AST analysis passed: {len(files)} files')
          PY

  research-e2e:
    name: Research E2E
    needs: python-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Research OS E2E tests
        run: |
          python -m unittest discover -s v3/tests -p 'test_*e2e*.py' -v

      - name: Run autonomous/evidence integration tests
        run: |
          python -m unittest \
            v3.tests.test_autonomous_research \
            v3.tests.test_tool_evidence \
            v3.tests.test_research_tool_adapters \
            -v

  flutter-quality:
    name: Flutter Analyze Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter application
        id: flutter-check
        shell: bash
        run: |
          if [[ -f flutter_app/pubspec.yaml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Flutter application detected"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No flutter_app/pubspec.yaml found; Flutter checks will be skipped"
          fi

      - name: Setup Flutter
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Flutter dependencies
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter pub get

      - name: Flutter analyze
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter analyze

      - name: Flutter tests
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter test

      - name: Flutter debug APK build
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter build apk --debug

  gate:
    name: Research OS Final Gate
    needs: [python-quality, research-e2e, flutter-quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      delay_seconds: ${{ steps.delay.outputs.delay_seconds }}
    steps:
      - name: Verify required jobs
        run: |
          echo "python-quality=${{ needs.python-quality.result }}"
          echo "research-e2e=${{ needs.research-e2e.result }}"
          echo "flutter-quality=${{ needs.flutter-quality.result }}"
          test "${{ needs.python-quality.result }}" = success
          test "${{ needs.research-e2e.result }}" = success
          test "${{ needs.flutter-quality.result }}" = success
          echo "RESEARCH_OS_GATE=PASS"

      - name: Resolve target SHA
        id: target
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ]; then
            TARGET_SHA="$INPUT_SHA"
          elif [ -n "$PR_SHA" ]; then
            TARGET_SHA="$PR_SHA"
          else
            TARGET_SHA="$WORKFLOW_SHA"
          fi
          test -n "$TARGET_SHA"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$TARGET_SHA"

      - name: Generate one delay value
        id: delay
        run: |
          set -euo pipefail
          DELAY_SECONDS="$(python - <<'PY'
          import random
          value = round(random.uniform(1.0, 3.0), 3)
          print(f"{value:.3f}")
          PY
          )"
          python - <<PY
          value = float("$DELAY_SECONDS")
          assert value >= 0
          PY
          echo "delay_seconds=$DELAY_SECONDS" >> "$GITHUB_OUTPUT"
          echo "GENERATED_DELAY_SECONDS=$DELAY_SECONDS"

      - name: Sleep using the generated value
        env:
          DELAY_SECONDS: ${{ steps.delay.outputs.delay_seconds }}
        run: |
          set -euo pipefail
          python - <<PY
          import time
          value = float("$DELAY_SECONDS")
          time.sleep(value)
          print(f"REUSED_DELAY_SECONDS={value:.3f}")
          PY

      - name: Dispatch V3.5 PR Integrity with the same contract
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          DELAY_SECONDS: ${{ steps.delay.outputs.delay_seconds }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'v3.5-pr-integrity.yml',
              ref: 'agent/v3.5-worker-pool-hardening',
              inputs: {
                expected_sha: process.env.TARGET_SHA,
                delay_seconds: process.env.DELAY_SECONDS
              }
            });
            core.info(`DISPATCHED_SHA=${process.env.TARGET_SHA}`);
            core.info(`DISPATCHED_DELAY_SECONDS=${process.env.DELAY_SECONDS}`);
