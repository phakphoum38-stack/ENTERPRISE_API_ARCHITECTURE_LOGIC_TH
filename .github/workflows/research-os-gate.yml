name: Research OS Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  python-quality:
    name: Python Build Test Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile Research OS
        run: python -m compileall -q v3/research_os_v3

      - name: Unit tests
        run: |
          python -m unittest discover -s v3/tests -p 'test_*.py' -v

      - name: Import smoke
        run: |
          PYTHONPATH=v3 python -c "import research_os_v3; print('research_os_v3 import: OK')"

      - name: Static analysis
        run: |
          PYTHONPATH=v3 python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('v3/research_os_v3')
          files = sorted(root.glob('*.py'))
          assert files, 'no Research OS Python sources found'
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'AST analysis passed: {len(files)} files')
          PY

  research-e2e:
    name: Research E2E
    needs: python-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Research OS E2E tests
        run: |
          python -m unittest discover -s v3/tests -p 'test_*e2e*.py' -v

      - name: Run autonomous/evidence integration tests
        run: |
          python -m unittest \
            v3.tests.test_autonomous_research \
            v3.tests.test_tool_evidence \
            v3.tests.test_research_tool_adapters \
            -v

  flutter-quality:
    name: Flutter Tool Analyze Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter application
        id: flutter-check
        shell: bash
        run: |
          if [[ -f flutter_app/pubspec.yaml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Flutter tool detected"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No flutter_app/pubspec.yaml found; Flutter tool checks will be skipped"
          fi

      - name: Setup Flutter
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Flutter dependencies
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter pub get

      - name: Flutter analyze
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter analyze

      - name: Flutter tests
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter test

      - name: Flutter debug APK build
        if: ${{ steps.flutter-check.outputs.exists == 'true' }}
        working-directory: flutter_app
        run: flutter build apk --debug

  core-gate:
    name: Research OS Core Final Gate
    needs: [python-quality, research-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Research OS core jobs
        run: |
          echo "python-quality=${{ needs.python-quality.result }}"
          echo "research-e2e=${{ needs.research-e2e.result }}"
          test "${{ needs.python-quality.result }}" = success
          test "${{ needs.research-e2e.result }}" = success
          echo "RESEARCH_OS_CORE_GATE=PASS"

  flutter-result:
    name: Flutter External Tool Result
    needs: flutter-quality
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report Flutter tool result
        run: |
          echo "flutter-quality=${{ needs.flutter-quality.result }}"
          echo "FLUTTER_EXTERNAL_TOOL_RESULT=${{ needs.flutter-quality.result }}"
