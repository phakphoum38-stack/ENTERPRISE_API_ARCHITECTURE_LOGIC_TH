name: One-shot PR40 V3 Ubuntu Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_dispatch-pr40-v3.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch clean Ubuntu V3 build from PR40 branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: feat/v3-unified-skills-adaptive-tiers
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/workflows/v3-ubuntu-build.yml/dispatches" \
            -f ref="$BRANCH"
