name: Research OS Validate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Research OS Windows Desktop
    types:
      - completed
    branches:
      - main
  pull_request:
    paths:
      - "apps/research_os_web/**"
      - "research/**"
      - "house/**"
      - "tools/house_command/**"
      - ".github/workflows/research-curator-validate.yml"
      - ".github/workflows/house-command.yml"
      - ".github/workflows/provider-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "apps/research_os_web/**"
      - "research/**"
      - "house/**"
      - "tools/house_command/**"
      - ".github/workflows/research-curator-validate.yml"
      - ".github/workflows/house-command.yml"
      - ".github/workflows/provider-smoke.yml"

permissions:
  contents: read

concurrency:
  group: research-os-validate-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Curator and House tools
        run: |
          python -m py_compile tools/research_curator/curator.py
          python -m py_compile tools/research_curator/knowledge_ops.py
          python -m py_compile tools/research_curator/git_publisher.py
          python -m py_compile tools/house_command/house_brain.py
          python -m py_compile tools/house_command/dispatcher.py

      - name: Verify Entrance UI assets
        run: |
          test -s apps/research_os_web/index.html
          test -s apps/research_os_web/app.css
          test -s apps/research_os_web/app.js
          grep -q "ยินดีต้อนรับกลับครับเพื่อน" apps/research_os_web/index.html
          grep -q "เริ่มงาน" apps/research_os_web/index.html

      - name: Run Research Curator tests
        working-directory: tools/research_curator
        run: python -m unittest test_curator.py test_knowledge_ops.py -v

      - name: Run House Brain tests
        working-directory: tools/house_command
        run: python -m unittest test_house_brain.py -v

      - name: Verify house-status command
        run: python tools/house_command/dispatcher.py house-status --report /tmp/house-status.json

      - name: Validate research artifacts and relationships
        run: python tools/research_curator/curator.py validate --output research/artifacts

      - name: Verify generated index is current
        run: |
          cp research/artifacts/README.md /tmp/research-index-before.md
          python tools/research_curator/curator.py index --output research/artifacts
          diff -u /tmp/research-index-before.md research/artifacts/README.md

      - name: Export knowledge graph
        run: python tools/research_curator/knowledge_ops.py graph --artifacts research/artifacts --output /tmp/knowledge-graph

      - name: Verify graph export
        run: |
          test -s /tmp/knowledge-graph.json
          test -s /tmp/knowledge-graph.mmd

      - name: Summary
        if: always()
        run: |
          {
            echo "# Research OS Validate — Secondary/Domain"
            echo "- Generic Research OS API tests removed; owned by main workflow"
            echo "- Curator, House, research artifacts and Entrance UI checks remain"
          } >> "$GITHUB_STEP_SUMMARY"
