name: Patch Candidate Redaction Check

on:
  push:
    branches:
      - integration/unified-master-orchestrator-v3

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-redaction]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/unified-master-orchestrator-v3

      - name: Patch false-positive credential detector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/candidate.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          $providers = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v2/brain/providers" -TimeoutSec 5
          $serialized = @($providers, $master) | ConvertTo-Json -Depth 12 -Compress
          if ($serialized -match '(?i)sk-[A-Za-z0-9_-]{8,}|Bearer\\s+[A-Za-z0-9._-]+') {
            throw "Provider or master status contains credential-like data"
          }
'''
          new = '''          $providers = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v2/brain/providers" -TimeoutSec 5
          $providerStatuses = @($providers.providers.PSObject.Properties.Value)
          if (@($providerStatuses | Where-Object { $_.secret_exposed -eq $true }).Count -gt 0) {
            throw "Provider status reports an exposed secret"
          }
          $serialized = @($providers, $master) | ConvertTo-Json -Depth 12 -Compress
          $credentialPattern = '(?i)(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{8,}|(?<![A-Za-z0-9])Bearer\\s+[A-Za-z0-9._-]{12,}'
          if ($serialized -match $credentialPattern) {
            throw "Provider or master status contains credential-like data"
          }
'''
          if old not in text:
              raise SystemExit('Expected candidate credential block was not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "research-os-ci"
          git config user.email "research-os-ci@users.noreply.github.com"
          git add .github/workflows/candidate.yml
          git diff --cached --check
          git commit -m "ci: fix candidate credential detector false positives"
          git push origin HEAD:integration/unified-master-orchestrator-v3
