name: Patch Candidate Redaction Check

on:
  push:
    branches:
      - integration/unified-master-orchestrator-v3

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-redaction]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/unified-master-orchestrator-v3

      - name: Patch false-positive credential detector
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path(".github/workflows/candidate.yml"); t=p.read_text(encoding="utf-8"); old="(?i)sk-[A-Za-z0-9_-]{8,}|Bearer\\s+[A-Za-z0-9._-]+"; new="(?i)(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{8,}|(?<![A-Za-z0-9])Bearer\\s+[A-Za-z0-9._-]{12,}"; assert old in t, "credential detector pattern not found"; p.write_text(t.replace(old,new,1),encoding="utf-8")'
          git diff -- .github/workflows/candidate.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "research-os-ci"
          git config user.email "research-os-ci@users.noreply.github.com"
          git add .github/workflows/candidate.yml
          git diff --cached --check
          git commit -m "ci: fix candidate credential detector false positives"
          git push origin HEAD:integration/unified-master-orchestrator-v3
