name: Deploy Research OS Home

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/research_os_flutter/**"
      - "tools/research_os_api/**"
      - "render.yaml"
      - ".github/workflows/research-os-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-os-pages
  cancel-in-progress: true

env:
  RESEARCH_OS_PUBLIC_API_URL: ${{ vars.RESEARCH_OS_PUBLIC_API_URL || 'https://research-os-api-phakphoum.onrender.com' }}

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/research_os_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform shell
        run: flutter create --platforms=web --project-name=research_os_flutter .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web for GitHub Pages
        run: >-
          flutter build web --release
          --base-href "/ENTERPRISE_API_ARCHITECTURE_LOGIC_TH/"
          --dart-define=RESEARCH_OS_API_BASE_URL=${RESEARCH_OS_PUBLIC_API_URL}

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/research_os_flutter/build/web

  deploy:
    name: Publish home
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
