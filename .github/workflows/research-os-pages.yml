name: Deploy Research OS Home

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Research OS Flutter run ID containing the Pages artifact
        required: true
        type: string
  workflow_run:
    workflows:
      - Research OS Flutter
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-os-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish validated web artifact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Pages-ready Flutter artifact
        uses: actions/download-artifact@v4
        with:
          name: research-os-web-pages
          path: site
          run-id: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify web artifact
        run: |
          test -s site/index.html
          test -s site/main.dart.js

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Wait for Pages artifact registration
        shell: bash
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
