name: Research OS CI

on:
  push:
    branches: [ main, research-os-scaffold ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f research-os/requirements.txt ]; then pip install -r research-os/requirements.txt; fi
      - name: Run tests
        run: pytest -q

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: research-os
          push: false
          tags: research-os:ci-${{ github.sha }}

  test-image:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
      - name: Load and run built image
        run: |
          IMAGE_TAG=research-os:ci-${{ github.sha }}
          docker run -d --name research-os-ci -p 8080:8080 $IMAGE_TAG || true
          for i in $(seq 1 20); do
            if curl -sS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "health ok"; break
            fi
            sleep 1
          done
          docker ps -a
      - name: Cleanup
        if: always()
        run: |
          docker rm -f research-os-ci || true

  push-image:
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ secrets.DOCKER_REGISTRY && secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: research-os
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:research-os-${{ github.sha }}
