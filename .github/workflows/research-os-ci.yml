name: Research OS CI

on:
  push:
    branches: [ main, research-os-scaffold ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research-os/requirements.txt

      - name: Run Research OS component tests
        run: |
          pytest -q research-os/tests

  build-and-test-image:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Research OS image
        uses: docker/build-push-action@v5
        with:
          context: research-os
          push: false
          load: true
          tags: research-os:ci-${{ github.sha }}

      - name: Test Research OS container
        run: |
          IMAGE_TAG="research-os:ci-${{ github.sha }}"
          HOST_PORT="$(python - <<'PY'
          import socket
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print(s.getsockname()[1])
          s.close()
          PY
          )"

          docker run -d \
            --name research-os-ci \
            -p "${HOST_PORT}:8080" \
            "$IMAGE_TAG"

          trap 'docker rm -f research-os-ci || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${HOST_PORT}/health" >/dev/null; then
              echo "Research OS container health: PASS"
              exit 0
            fi
            sleep 1
          done

          echo "Research OS container health: FAIL"
          docker logs research-os-ci || true
          exit 1

  push-image:
    runs-on: ubuntu-latest
    needs: build-and-test-image

    if: ${{ secrets.DOCKER_REGISTRY && secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: research-os
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:research-os-${{ github.sha }}