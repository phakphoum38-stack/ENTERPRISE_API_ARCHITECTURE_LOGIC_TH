  registry-credentials:
    runs-on: ubuntu-latest

    outputs:
      available: ${{ steps.detect.outputs.available }}

    steps:
      - name: Detect registry credentials
        id: detect
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_REGISTRY" && -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Docker registry credentials: AVAILABLE"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker registry credentials: NOT CONFIGURED"
          fi

  push-image:
    runs-on: ubuntu-latest
    needs:
      - build-and-test-image
      - registry-credentials

    if: ${{ github.event_name == 'push' && needs.registry-credentials.outputs.available == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: research-os
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:research-os-${{ github.sha }}