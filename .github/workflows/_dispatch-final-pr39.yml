name: One-shot Final PR39 Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_dispatch-final-pr39.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full audit and Candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 3f15572c766220a348ad41a9ec15ad6f02ed1679
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/workflows/file-audit-v6x6.yml/dispatches" \
            -f ref=main -f "inputs[target_sha]=$TARGET_SHA"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/workflows/candidate.yml/dispatches" \
            -f ref=main -f "inputs[target_sha]=$TARGET_SHA"
