name: Research OS Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/research_os_flutter/**"
      - "tools/research_os_api/**"
      - "tools/research_os_service/**"
      - "tools/research_curator/**"
      - "scripts/*research-os*.ps1"
      - "installer/**"
      - ".github/workflows/research-os-windows-desktop.yml"
  pull_request:
    paths:
      - "apps/research_os_flutter/**"
      - "tools/research_os_api/**"
      - "tools/research_os_service/**"
      - "tools/research_curator/**"
      - "scripts/*research-os*.ps1"
      - "installer/**"
      - ".github/workflows/research-os-windows-desktop.yml"

permissions:
  contents: read

concurrency:
  group: research-os-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-foundation:
    name: Windows local-first foundation
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/setup-research-os-windows.ps1",
            "scripts/start-research-os-local.ps1",
            "scripts/stop-research-os-local.ps1",
            "scripts/status-research-os-local.ps1",
            "scripts/backup-research-os.ps1",
            "scripts/restore-research-os.ps1",
            "scripts/enable-research-os-autostart.ps1",
            "scripts/disable-research-os-autostart.ps1",
            "scripts/research-os-service.ps1"
          )
          foreach ($script in $scripts) {
            [void][scriptblock]::Create((Get-Content $script -Raw))
            Write-Host "OK: $script"
          }

      - name: Run Windows local-first setup
        shell: pwsh
        run: |
          ./scripts/setup-research-os-windows.ps1 -Root "$env:RUNNER_TEMP\ResearchOS" -DataDir "$env:RUNNER_TEMP\ResearchOSData"
          $required = @("database", "sessions", "artifacts", "backups")
          foreach ($name in $required) {
            $path = Join-Path "$env:RUNNER_TEMP\ResearchOSData" $name
            if (-not (Test-Path $path)) { throw "Missing local-first directory: $path" }
          }

      - name: Compile Research OS API
        shell: pwsh
        run: |
          python -m py_compile tools/research_os_api/server.py
          python -m py_compile tools/research_os_api/render_server.py
          python -m py_compile tools/research_os_api/conversation_store.py
          python -m py_compile tools/research_os_api/memory.py
          python -m py_compile tools/research_os_api/google_workspace.py
          python -m py_compile tools/research_os_api/google_oauth.py

      - name: Run API tests
        shell: pwsh
        env:
          RESEARCH_OS_PROVIDER: mock
          RESEARCH_OS_SYNC_KEY: windows-ci-test-key
          RESEARCH_OS_DATA_DIR: ${{ runner.temp }}\ResearchOSData
          RESEARCH_OS_CONVERSATION_STORE: ${{ runner.temp }}\ResearchOSData\sessions\conversations.json
        run: python -m unittest discover -s tools/research_os_api -p "test_*.py" -v

      - name: Test local API start status and stop
        shell: pwsh
        env:
          RESEARCH_OS_SYNC_KEY: windows-ci-test-key
        run: |
          ./scripts/start-research-os-local.ps1 -DataDir "$env:RUNNER_TEMP\ResearchOSData" -Provider mock -Port 8787 -Background
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
              if ($health.status -eq "ok") { $ready = $true; break }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw "Local API did not become ready" }
          ./scripts/status-research-os-local.ps1 -Port 8787 -HealthUrl "http://127.0.0.1:8787/health"
          ./scripts/stop-research-os-local.ps1 -Port 8787 -PidFile "$env:RUNNER_TEMP\ResearchOSData\run\research-os-api.pid"
          Start-Sleep -Milliseconds 500
          if (Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue) {
            throw "Local API was still listening after stop"
          }

      - name: Publish Research OS ServiceHost
        shell: pwsh
        run: |
          dotnet publish tools/research_os_service/ResearchOS.ServiceHost.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -o tools/research_os_service/publish
          if (-not (Test-Path "tools/research_os_service/publish/ResearchOS.ServiceHost.exe")) {
            throw "ServiceHost executable was not produced"
          }

      - name: Test Windows Service install recovery start and stop
        shell: pwsh
        run: |
          try {
            ./scripts/research-os-service.ps1 -Action install -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
            ./scripts/research-os-service.ps1 -Action status -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"

            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "Windows Service API did not become ready" }

            $service = Get-CimInstance Win32_Service -Filter "Name='ResearchOSService'"
            if (-not $service -or $service.State -ne 'Running') {
              throw "ResearchOSService is not running"
            }

            $failure = sc.exe qfailure ResearchOSService | Out-String
            if ($failure -notmatch 'RESTART') {
              throw "ResearchOSService recovery restart policy is missing"
            }

            ./scripts/research-os-service.ps1 -Action restart -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
            ./scripts/research-os-service.ps1 -Action stop -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
          }
          finally {
            if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) {
              ./scripts/research-os-service.ps1 -Action uninstall -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
            }
          }

      - name: Test backup and restore
        shell: pwsh
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\ResearchOSData\sessions\fixture.json" -Value '{"ok":true}'
          ./scripts/backup-research-os.ps1 -DataDir "$env:RUNNER_TEMP\ResearchOSData" -BackupDir "$env:RUNNER_TEMP\backups"
          $archive = Get-ChildItem "$env:RUNNER_TEMP\backups\research-os-*.zip" | Select-Object -First 1
          if (-not $archive) { throw "Backup archive was not created" }
          ./scripts/restore-research-os.ps1 -Archive $archive.FullName -DataDir "$env:RUNNER_TEMP\RestoredResearchOSData"
          if (-not (Test-Path "$env:RUNNER_TEMP\RestoredResearchOSData\sessions\fixture.json")) {
            throw "Restore validation failed"
          }

      - name: Test autostart enable and disable
        shell: pwsh
        run: |
          ./scripts/enable-research-os-autostart.ps1 -DataDir "$env:RUNNER_TEMP\ResearchOSData"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $value = (Get-ItemProperty -Path $runKey -Name "ResearchOSLocalAPI").ResearchOSLocalAPI
          if (-not $value -or $value -notmatch "start-research-os-local.ps1") {
            throw "Autostart registry value was not configured correctly"
          }
          ./scripts/disable-research-os-autostart.ps1
          if (Get-ItemProperty -Path $runKey -Name "ResearchOSLocalAPI" -ErrorAction SilentlyContinue) {
            throw "Autostart registry value was not removed"
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform shell
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter create --platforms=windows --project-name=research_os_flutter .

      - name: Install Flutter dependencies
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter pub get

      - name: Analyze Flutter
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter test

      - name: Build Windows desktop
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter build windows --release

      - name: Stage one-click installer package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "installer\package"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          New-Item -ItemType Directory -Force -Path "$package\app" | Out-Null
          Copy-Item "apps\research_os_flutter\build\windows\x64\runner\Release\*" "$package\app" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "$package\tools\research_os_service\publish" | Out-Null
          Copy-Item "tools\research_os_service\publish\*" "$package\tools\research_os_service\publish" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "$package\tools\research_os_api" | Out-Null
          Copy-Item "tools\research_os_api\*.py" "$package\tools\research_os_api" -Force

          New-Item -ItemType Directory -Force -Path "$package\tools\research_curator" | Out-Null
          Copy-Item "tools\research_curator\*" "$package\tools\research_curator" -Recurse -Force

          if (Test-Path "apps\research_os_web") {
            New-Item -ItemType Directory -Force -Path "$package\apps\research_os_web" | Out-Null
            Copy-Item "apps\research_os_web\*" "$package\apps\research_os_web" -Recurse -Force
          }
          if (Test-Path "research\artifacts") {
            New-Item -ItemType Directory -Force -Path "$package\research\artifacts" | Out-Null
            Copy-Item "research\artifacts\*" "$package\research\artifacts" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "$package\scripts" | Out-Null
          Copy-Item "scripts\*research-os*.ps1" "$package\scripts" -Force

          $pythonRoot = (python -c "import sys; print(sys.base_prefix)").Trim()
          if (-not (Test-Path "$pythonRoot\python.exe")) { throw "Python runtime root not found: $pythonRoot" }
          New-Item -ItemType Directory -Force -Path "$package\runtime\python" | Out-Null
          Copy-Item "$pythonRoot\*" "$package\runtime\python" -Recurse -Force

          if (-not (Test-Path "$package\runtime\python\python.exe")) { throw "Bundled Python runtime missing" }
          if (-not (Test-Path "$package\app\research_os_flutter.exe")) { throw "Desktop executable missing from package" }
          if (-not (Test-Path "$package\tools\research_os_service\publish\ResearchOS.ServiceHost.exe")) { throw "ServiceHost missing from package" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Research OS Setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\research-os.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem "installer\output\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Research OS Setup EXE was not produced" }
          Write-Host "Installer: $($setup.FullName)"

      - name: Validate installer install service health and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "installer\output\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer missing" }

          $installLog = "$env:RUNNER_TEMP\research-os-install.log"
          $process = Start-Process `
            -FilePath $setup.FullName `
            -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              "/LOG=$installLog"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            if (Test-Path $installLog) {
              Write-Host "=== INSTALL LOG ==="
              Get-Content $installLog -Tail 300
            }
            throw "Installer failed with exit code $($process.ExitCode)"
          }

          $appRoot = Join-Path $env:ProgramFiles 'Research OS'

          if (-not (Test-Path "$appRoot\app\research_os_flutter.exe")) {
            throw "Installed desktop app missing"
          }

          if (-not (Test-Path "$appRoot\runtime\python\python.exe")) {
            throw "Installed bundled Python missing"
          }

          $ready = $false

          for ($i = 0; $i -lt 40; $i++) {
            try {
              $health = Invoke-RestMethod `
                -Uri "http://127.0.0.1:8787/health" `
                -TimeoutSec 2

              if ($health.status -eq 'ok') {
                $ready = $true
                break
              }
            }
            catch {
              Start-Sleep -Milliseconds 500
            }
          }

          if (-not $ready) {
            Write-Host "=== ResearchOSService ==="
            Get-Service ResearchOSService -ErrorAction SilentlyContinue |
              Format-List *

            Write-Host "=== SERVICE QUERY ==="
            sc.exe query ResearchOSService

            Write-Host "=== PORT 8787 ==="
            netstat -ano | Select-String ":8787"

            $dataRoot = Join-Path $env:ProgramData 'ResearchOS'
            $errLog = Join-Path $dataRoot 'logs\service-api.err.log'
            $outLog = Join-Path $dataRoot 'logs\service-api.out.log'

            if (Test-Path $errLog) {
              Write-Host "=== API STDERR ==="
              Get-Content $errLog -Tail 200
            }

            if (Test-Path $outLog) {
              Write-Host "=== API STDOUT ==="
              Get-Content $outLog -Tail 200
            }

            if (Test-Path $installLog) {
              Write-Host "=== INSTALL LOG ==="
              Get-Content $installLog -Tail 300
            }

            throw "Installed Research OS Service API did not become ready"
          }

          $svc = Get-Service ResearchOSService -ErrorAction Stop

          if ($svc.Status -ne 'Running') {
            throw "Installed Research OS Service is not running"
          }

          $dataRoot = Join-Path $env:ProgramData 'ResearchOS'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          Set-Content `
            -Path "$dataRoot\installer-preserve-test.txt" `
            -Value 'preserve'

          $uninstaller = Join-Path $appRoot 'unins000.exe'

          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller missing"
          }

          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART'
            ) `
            -Wait `
            -PassThru

          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }

          $serviceDeleted = $false

          for ($i = 0; $i -lt 40; $i++) {
            if (-not (Get-Service ResearchOSService -ErrorAction SilentlyContinue)) {
              $serviceDeleted = $true
              break
            }

            Start-Sleep -Milliseconds 500
          }

          if (-not $serviceDeleted) {
            sc.exe query ResearchOSService
            throw "Service remained after uninstall"
          }

          if (-not (Test-Path "$dataRoot\installer-preserve-test.txt")) {
            throw "Local data was removed by uninstall"
          }

      - name: Upload Windows desktop build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-os-windows-${{ github.run_number }}
          path: apps/research_os_flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload ServiceHost build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-os-service-host-${{ github.run_number }}
          path: tools/research_os_service/publish/
          if-no-files-found: error
          retention-days: 14

      - name: Upload one-click installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-os-installer-${{ github.run_number }}
          path: installer/output/Research-OS-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          @"
          # Research OS Windows Desktop

          - Local-first setup: validated
          - Local API tests: validated when job succeeds
          - Native Windows ServiceHost: self-contained build
          - Windows Service lifecycle + recovery: validated when job succeeds
          - Flutter Windows desktop: built when job succeeds
          - Bundled Python runtime: staged inside installer; no separate Python install required
          - One-click Windows Setup EXE: built and installed end-to-end when job succeeds
          - Uninstall preserves ProgramData\ResearchOS memory/data
          - Backend secrets are not embedded into the desktop UI
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
