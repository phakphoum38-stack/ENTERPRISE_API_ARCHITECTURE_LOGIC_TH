name: Research OS Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/research_os_flutter/**"
      - "tools/research_os_api/**"
      - "tools/research_os_service/**"
      - "scripts/*research-os*.ps1"
      - ".github/workflows/research-os-windows-desktop.yml"
  pull_request:
    paths:
      - "apps/research_os_flutter/**"
      - "tools/research_os_api/**"
      - "tools/research_os_service/**"
      - "scripts/*research-os*.ps1"
      - ".github/workflows/research-os-windows-desktop.yml"

permissions:
  contents: read

concurrency:
  group: research-os-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-foundation:
    name: Windows local-first foundation
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/setup-research-os-windows.ps1",
            "scripts/start-research-os-local.ps1",
            "scripts/stop-research-os-local.ps1",
            "scripts/status-research-os-local.ps1",
            "scripts/backup-research-os.ps1",
            "scripts/restore-research-os.ps1",
            "scripts/enable-research-os-autostart.ps1",
            "scripts/disable-research-os-autostart.ps1",
            "scripts/research-os-service.ps1"
          )
          foreach ($script in $scripts) {
            [void][scriptblock]::Create((Get-Content $script -Raw))
            Write-Host "OK: $script"
          }

      - name: Run Windows local-first setup
        shell: pwsh
        run: |
          ./scripts/setup-research-os-windows.ps1 -Root "$env:RUNNER_TEMP\ResearchOS" -DataDir "$env:RUNNER_TEMP\ResearchOSData"
          $required = @("database", "sessions", "artifacts", "backups")
          foreach ($name in $required) {
            $path = Join-Path "$env:RUNNER_TEMP\ResearchOSData" $name
            if (-not (Test-Path $path)) { throw "Missing local-first directory: $path" }
          }

      - name: Compile Research OS API
        shell: pwsh
        run: |
          python -m py_compile tools/research_os_api/server.py
          python -m py_compile tools/research_os_api/render_server.py
          python -m py_compile tools/research_os_api/conversation_store.py
          python -m py_compile tools/research_os_api/memory.py

      - name: Run API tests
        shell: pwsh
        env:
          RESEARCH_OS_PROVIDER: mock
          RESEARCH_OS_SYNC_KEY: windows-ci-test-key
          RESEARCH_OS_DATA_DIR: ${{ runner.temp }}\ResearchOSData
          RESEARCH_OS_CONVERSATION_STORE: ${{ runner.temp }}\ResearchOSData\sessions\conversations.json
        run: python -m unittest discover -s tools/research_os_api -p "test_*.py" -v

      - name: Test local API start status and stop
        shell: pwsh
        env:
          RESEARCH_OS_SYNC_KEY: windows-ci-test-key
        run: |
          ./scripts/start-research-os-local.ps1 -DataDir "$env:RUNNER_TEMP\ResearchOSData" -Provider mock -Port 8787 -Background
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
              if ($health.status -eq "ok") { $ready = $true; break }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw "Local API did not become ready" }
          ./scripts/status-research-os-local.ps1 -Port 8787 -HealthUrl "http://127.0.0.1:8787/health"
          ./scripts/stop-research-os-local.ps1 -Port 8787 -PidFile "$env:RUNNER_TEMP\ResearchOSData\run\research-os-api.pid"
          Start-Sleep -Milliseconds 500
          if (Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue) {
            throw "Local API was still listening after stop"
          }

      - name: Publish Research OS ServiceHost
        shell: pwsh
        run: |
          dotnet publish tools/research_os_service/ResearchOS.ServiceHost.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -o tools/research_os_service/publish
          if (-not (Test-Path "tools/research_os_service/publish/ResearchOS.ServiceHost.exe")) {
            throw "ServiceHost executable was not produced"
          }

      - name: Test Windows Service install recovery start and stop
        shell: pwsh
        run: |
          try {
            ./scripts/research-os-service.ps1 -Action install -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
            ./scripts/research-os-service.ps1 -Action status -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"

            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "Windows Service API did not become ready" }

            $service = Get-CimInstance Win32_Service -Filter "Name='ResearchOSService'"
            if (-not $service -or $service.State -ne 'Running') {
              throw "ResearchOSService is not running"
            }

            $failure = sc.exe qfailure ResearchOSService | Out-String
            if ($failure -notmatch 'RESTART') {
              throw "ResearchOSService recovery restart policy is missing"
            }

            ./scripts/research-os-service.ps1 -Action restart -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
            ./scripts/research-os-service.ps1 -Action stop -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
          }
          finally {
            if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) {
              ./scripts/research-os-service.ps1 -Action uninstall -DataDir "$env:RUNNER_TEMP\ResearchOSServiceData"
            }
          }

      - name: Test backup and restore
        shell: pwsh
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\ResearchOSData\sessions\fixture.json" -Value '{"ok":true}'
          ./scripts/backup-research-os.ps1 -DataDir "$env:RUNNER_TEMP\ResearchOSData" -BackupDir "$env:RUNNER_TEMP\backups"
          $archive = Get-ChildItem "$env:RUNNER_TEMP\backups\research-os-*.zip" | Select-Object -First 1
          if (-not $archive) { throw "Backup archive was not created" }
          ./scripts/restore-research-os.ps1 -Archive $archive.FullName -DataDir "$env:RUNNER_TEMP\RestoredResearchOSData"
          if (-not (Test-Path "$env:RUNNER_TEMP\RestoredResearchOSData\sessions\fixture.json")) {
            throw "Restore validation failed"
          }

      - name: Test autostart enable and disable
        shell: pwsh
        run: |
          ./scripts/enable-research-os-autostart.ps1 -DataDir "$env:RUNNER_TEMP\ResearchOSData"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $value = (Get-ItemProperty -Path $runKey -Name "ResearchOSLocalAPI").ResearchOSLocalAPI
          if (-not $value -or $value -notmatch "start-research-os-local.ps1") {
            throw "Autostart registry value was not configured correctly"
          }
          ./scripts/disable-research-os-autostart.ps1
          if (Get-ItemProperty -Path $runKey -Name "ResearchOSLocalAPI" -ErrorAction SilentlyContinue) {
            throw "Autostart registry value was not removed"
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform shell
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter create --platforms=windows --project-name=research_os_flutter .

      - name: Install Flutter dependencies
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter pub get

      - name: Analyze Flutter
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter test

      - name: Build Windows desktop
        shell: pwsh
        working-directory: apps/research_os_flutter
        run: flutter build windows --release

      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v4
        with:
          name: research-os-windows-${{ github.run_number }}
          path: apps/research_os_flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload ServiceHost build
        uses: actions/upload-artifact@v4
        with:
          name: research-os-service-host-${{ github.run_number }}
          path: tools/research_os_service/publish/
          if-no-files-found: error
          retention-days: 14

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          @"
          # Research OS Windows Desktop

          - Local-first setup: validated
          - Local API tests: validated when job succeeds
          - Local API start/status/stop: validated when job succeeds
          - Native Windows ServiceHost: published when job succeeds
          - Windows Service install/start/restart/stop/uninstall: validated when job succeeds
          - Windows Service recovery policy: validated when job succeeds
          - Backup/restore: validated when job succeeds
          - Legacy autostart fallback: validated when job succeeds
          - Flutter Windows build: validated when job succeeds
          - Secrets are not embedded in the desktop artifact
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
