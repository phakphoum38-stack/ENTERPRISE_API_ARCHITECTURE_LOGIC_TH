name: Generated Owner Evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  generated-owner-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML OK: {path}')
          for path in sorted(Path('.github/workflows').glob('*.yaml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML OK: {path}')
          PY

      - name: Check Owner Friend source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f owner_special/scripts/run_friend_service.py
          test -f owner_special/research_os_friend/service.py
          grep -q 'default=8790' owner_special/scripts/run_friend_service.py
          grep -q 'path == "/owner/health"' owner_special/research_os_friend/service.py
          echo 'OWNER FRIEND SOURCE CONTRACT: PASS'

      - name: Write generated evidence
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/generated-owner
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'gate': 'generated-owner-evidence',
              'workflow_sha': os.environ['GITHUB_SHA'],
              'target_sha': os.environ['TARGET_SHA'],
              'status': 'PASS',
              'owner_friend_port': 8790,
              'health_endpoint': '/owner/health',
              'source_contract': 'PASS',
              'runtime_health': 'NOT_RUN_IN_GITHUB_RUNNER',
          }
          Path('evidence/generated-owner/generated-owner-evidence.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          print(f"GENERATED OWNER EVIDENCE GATE PASSED: {os.environ['TARGET_SHA']}")
          PY

      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: generated-owner-evidence-${{ github.sha }}
          path: evidence/generated-owner
          if-no-files-found: error
          retention-days: 30
