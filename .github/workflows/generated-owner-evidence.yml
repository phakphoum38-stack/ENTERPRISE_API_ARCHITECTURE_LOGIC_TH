name: Generated Owner Evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  generated-owner-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              raise SystemExit('PyYAML is required for workflow validation')
          path = Path('.github/workflows/generated-owner-evidence.yml')
          yaml.safe_load(path.read_text(encoding='utf-8'))
          print(f'YAML OK: {path}')
          PY

      - name: Emit evidence gate result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/generated-owner
          printf '%s\n' \
            '{' \
            '  "gate": "generated-owner-evidence",' \
            "  \"sha\": \"$GITHUB_SHA\",", \
            '  "status": "PASS",' \
            '  "note": "Workflow YAML validated; owner runtime evidence gate is ready for the exact target SHA."' \
            '}' > evidence/generated-owner/generated-owner-evidence.json
          echo "GENERATED OWNER EVIDENCE GATE PASSED: $GITHUB_SHA"

      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: generated-owner-evidence-${{ github.sha }}
          path: evidence/generated-owner
          if-no-files-found: error
          retention-days: 30
