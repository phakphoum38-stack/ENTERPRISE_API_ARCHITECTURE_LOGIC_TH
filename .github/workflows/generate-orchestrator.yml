name: Generate Orchestrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory, validate, issue-read, or dispatch'
        required: false
        default: inventory
        type: choice
        options: [inventory, validate, issue-read, dispatch]

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: generate-orchestrator-main
  cancel-in-progress: false

env:
  REGISTRY: current/GENERATE_WORKFLOW_REGISTRY.yml
  WATCH_ISSUES: "32 52"

jobs:
  inventory-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inventory existing workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          test -f "$REGISTRY"
          test -f current/GENERATE_TIMELINE.md
          test -f current/tools/generate-timeline-tool.md
          test -f current/tools/docs-validation-generate.md

      - name: Read watched issues #32 and #52 (optional reference)
        if: ${{ inputs.mode == 'issue-read' || inputs.mode == 'validate' || inputs.mode == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/generate
          for issue in $WATCH_ISSUES; do
            echo "=== ISSUE #$issue ==="
            if gh api "repos/${GITHUB_REPOSITORY}/issues/$issue" > "evidence/generate/issue-$issue.json" 2>/dev/null; then
              python - "$issue" "evidence/generate/issue-$issue.json" <<'PY'
          import json,sys
          issue=sys.argv[1]; path=sys.argv[2]
          data=json.load(open(path))
          print(f"#{issue}: {data.get('state')} | {data.get('title')}")
          PY
            else
              echo "#${issue}: NOT_FOUND_OR_NOT_ACCESSIBLE"
              echo "Issue is optional reference only; continuing."
            fi
          done
          echo "Optional issue reference scan completed."

      - name: Validate registry against repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          registry=pathlib.Path('current/GENERATE_WORKFLOW_REGISTRY.yml').read_text()
          names=re.findall(r'^\s*- file:\s*([^\s#]+)',registry,re.M)
          missing=[n for n in names if not pathlib.Path('.github/workflows',n).is_file()]
          if missing:
              print('\n'.join(missing)); raise SystemExit(1)
          print(f'Registry validation passed: {len(names)} workflow entries found.')
          PY

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              print('PyYAML unavailable; skipping parser-only check.')
              raise SystemExit(0)
          errors=[]
          for p in sorted(pathlib.Path('.github/workflows').glob('*.*ml')):
              try: yaml.safe_load(p.read_text())
              except Exception as e: errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('Workflow YAML validation passed.')
          PY

      - name: Dispatch registered stages sequentially
        if: ${{ inputs.mode == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, subprocess, time, urllib.parse
          from datetime import datetime

          registry=pathlib.Path('current/GENERATE_WORKFLOW_REGISTRY.yml').read_text()
          entries=[]
          current=None
          for line in registry.splitlines():
              m=re.match(r'\s*- stage:\s*(\d+)',line)
              if m:
                  current={'stage':int(m.group(1))}
                  entries.append(current)
                  continue
              if current is not None:
                  m=re.match(r'\s*file:\s*([^\s#]+)',line)
                  if m: current['file']=m.group(1)
                  m=re.match(r'\s*dispatchable:\s*(true|false)',line)
                  if m: current['dispatchable']=m.group(1)=='true'

          entries=[e for e in entries if e.get('dispatchable') and e.get('file')]
          entries.sort(key=lambda e:e['stage'])
          print('Sequential dispatch plan:')
          for e in entries:
              print(f"  stage {e['stage']}: {e['file']}")

          def api(path, method='GET', payload=None):
              cmd=['gh','api',path,'--method',method]
              if payload is not None:
                  cmd += ['--input','-']
                  return subprocess.run(cmd,input=json.dumps(payload).encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
              return subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout

          repo='${{ github.repository }}'
          for e in entries:
              wf=e['file']
              encoded=urllib.parse.quote(wf,safe='')
              started=time.time()
              print(f"\n=== DISPATCH stage {e['stage']}: {wf} ===")
              api(f'repos/{repo}/actions/workflows/{encoded}/dispatches','POST',{'ref':'main'})

              deadline=time.time()+3600
              run=None
              while time.time()<deadline:
                  raw=api(f'repos/{repo}/actions/workflows/{encoded}/runs?event=workflow_dispatch&per_page=10')
                  data=json.loads(raw)
                  candidates=[]
                  for r in data.get('workflow_runs',[]):
                      created=r.get('created_at')
                      if not created: continue
                      ts=datetime.fromisoformat(created.replace('Z','+00:00')).timestamp()
                      if ts >= started-5: candidates.append(r)
                  if candidates:
                      run=max(candidates,key=lambda r:r['id'])
                      break
                  time.sleep(3)

              if not run:
                  raise SystemExit(f"Could not identify dispatched run for {wf}")

              run_id=run['id']
              print(f"Dispatched run {run_id}: {run.get('html_url','')}")
              while time.time()<deadline:
                  current=json.loads(api(f'repos/{repo}/actions/runs/{run_id}'))
                  status=current.get('status')
                  conclusion=current.get('conclusion')
                  print(f"run {run_id}: status={status} conclusion={conclusion}")
                  if status=='completed':
                      if conclusion!='success':
                          raise SystemExit(f"Stage {e['stage']} {wf} failed: {conclusion}")
                      break
                  time.sleep(10)
              else:
                  raise SystemExit(f"Stage {e['stage']} {wf} timed out")

          print('\nAll dispatchable registry stages completed successfully.')
          PY

      - name: Emit safe result
        shell: bash
        run: |
          echo 'Generate Orchestrator connected to registry, timeline, docs validation, and optional issue references.'
          echo 'Existing workflows remain preserved.'
          echo 'No cleanup occurs here.'
