name: Generate Orchestrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory, validate, issue-read, dispatch, or repair'
        required: false
        default: inventory
        type: choice
        options: [inventory, validate, issue-read, dispatch, repair]
      ref:
        description: 'Exact commit SHA or branch to validate'
        required: false
        default: ''
        type: string
      delay_seconds:
        description: 'Generated delay value for the V3.5 integrity stage'
        required: false
        default: '0'
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: write

concurrency:
  group: generate-orchestrator-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: current/GENERATE_WORKFLOW_REGISTRY.yml
  TOOL_REGISTRY: current/tools/generate-tool-registry.yml
  SKILL_MEMORY: current/GENERATE_SKILL_MEMORY.md
  WATCH_ISSUES: "32 52"
  REPAIR_BRANCH_PREFIX: fix/generate-stage
  RECOVERY_STAGE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode || 'inventory' }}
  RECOVERY_RUN_ID: ${{ github.run_id }}

jobs:
  inventory-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          test -n "$TARGET_SHA"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved TARGET_SHA=$TARGET_SHA"

      - name: Verify source identity
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.TARGET_SHA }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$ACTUAL_SHA"
          echo "SHA_IDENTITY_GATE=PASS"

      - name: Inventory existing workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          test -f "$REGISTRY"
          test -f "$TOOL_REGISTRY"
          test -f "$SKILL_MEMORY"
          test -f current/GENERATE_TIMELINE.md
          test -f current/tools/generate-timeline-tool.md
          test -f current/tools/docs-validation-generate.md
          test -f current/tools/generate-ai-repair-contract.md

      - name: Read watched issues #32 and #52 (optional reference)
        if: ${{ inputs.mode == 'issue-read' || inputs.mode == 'validate' || inputs.mode == 'dispatch' || inputs.mode == 'repair' || github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/generate
          for issue in $WATCH_ISSUES; do
            echo "=== ISSUE #$issue ==="
            if gh api "repos/${GITHUB_REPOSITORY}/issues/$issue" > "evidence/generate/issue-$issue.json" 2>/dev/null; then
              python - "$issue" "evidence/generate/issue-$issue.json" <<'PY'
          import json, sys
          issue=sys.argv[1]
          data=json.load(open(sys.argv[2], encoding='utf-8'))
          print(f"#{issue}: {data.get('state')} | {data.get('title')}")
          PY
            else
              echo "#${issue}: NOT_FOUND_OR_NOT_ACCESSIBLE"
            fi
          done

      - name: Validate source identity and repair boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          case "$REPAIR_BRANCH_PREFIX" in
            fix/*|repair/*) ;;
            *) echo "Unsafe repair branch prefix: $REPAIR_BRANCH_PREFIX"; exit 1 ;;
          esac
          echo "Repair boundary validated: prefix=$REPAIR_BRANCH_PREFIX target=$TARGET_SHA"

      - name: Validate registry, tools, and Skill Memory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_generate_orchestrator.py
          python tools/validate_generate_determinism.py
          python - <<'PY'
          import pathlib
          import yaml
          tools=yaml.safe_load(pathlib.Path('current/tools/generate-tool-registry.yml').read_text(encoding='utf-8')) or {}
          entries=tools.get('entries') or []
          if not entries:
              raise SystemExit('Generate tool registry is empty.')
          for e in entries:
              if not e.get('id') or not e.get('capability') or not e.get('safe_boundary'):
                  raise SystemExit(f'Invalid tool registry entry: {e!r}')
          memory=pathlib.Path('current/GENERATE_SKILL_MEMORY.md').read_text(encoding='utf-8')
          for required in ('candidate', 'validated', 'reusable', 'Evidence'):
              if required not in memory:
                  raise SystemExit(f'Skill memory contract missing: {required}')
          print(f'AI tool registry validated: {len(entries)} tools.')
          print('Skill Memory contract validated.')
          PY

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, yaml
          errors=[]
          for p in sorted(pathlib.Path('.github/workflows').glob('*.*ml')):
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('Workflow YAML validation passed.')
          PY

      - name: Prepare AI repair evidence
        if: ${{ inputs.mode == 'repair' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/generate
          cat > evidence/generate/repair-context.md <<EOF
          # Generate AI Repair Context

          - Repository: ${GITHUB_REPOSITORY}
          - Event: ${GITHUB_EVENT_NAME}
          - Source ref: ${GITHUB_REF}
          - Target SHA: ${TARGET_SHA}
          - Source run: ${GITHUB_RUN_ID}
          - Tool registry: ${TOOL_REGISTRY}
          - Skill memory: ${SKILL_MEMORY}
          - Repair boundary: branch-only
          - Main mutation: forbidden
          EOF
          cat evidence/generate/repair-context.md

      - name: Dispatch registered stages sequentially
        if: ${{ inputs.mode == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.TARGET_SHA }}
          DELAY_SECONDS: ${{ inputs.delay_seconds || '0' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess, time, urllib.parse, yaml

          target_sha = os.environ["TARGET_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          target_ref = f"generate-target-{run_id}-{run_attempt}"
          registry = yaml.safe_load(pathlib.Path("current/GENERATE_WORKFLOW_REGISTRY.yml").read_text(encoding="utf-8")) or {}
          entries = []
          for entry in registry.get("stages") or []:
              if not isinstance(entry, dict):
                  raise SystemExit(f"Invalid stage entry: {entry!r}")
              workflow = entry.get("file")
              if entry.get("dispatchable") is True and workflow and workflow != "generate-orchestrator.yml":
                  entries.append({"stage": int(entry.get("stage", 0)), "file": workflow})
          entries.sort(key=lambda entry: entry["stage"])
          if not entries:
              raise SystemExit("No downstream dispatchable stages found; refusing to run.")

          def api(path, method="GET", payload=None, check=True):
              cmd = ["gh", "api", path, "--method", method]
              if payload is not None:
                  cmd += ["--input", "-"]
                  result = subprocess.run(cmd, input=json.dumps(payload).encode(), stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              else:
                  result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and result.returncode:
                  raise RuntimeError(f"GitHub API request failed ({method} {path}): {result.stderr.decode(errors='replace')}")
              return result

          def recovery(stage, workflow, downstream_run=""):
              env_file = os.environ.get("GITHUB_ENV")
              if env_file:
                  with open(env_file, "a", encoding="utf-8") as handle:
                      handle.write(f"RECOVERY_STAGE={stage}\nRECOVERY_WORKFLOW={workflow}\nRECOVERY_RUN_ID={downstream_run}\n")

          def dispatch_inputs(workflow, schema):
              inputs = {}
              for name, spec in schema.items():
                  if name == "target_sha":
                      inputs[name] = target_sha
                  elif name == "expected_sha" and workflow == "v3.5-pr-integrity.yml":
                      inputs[name] = target_sha
                  elif name == "delay_seconds" and workflow == "v3.5-pr-integrity.yml":
                      inputs[name] = os.environ["DELAY_SECONDS"]
                  elif name == "candidate_run_id" and workflow == "release.yml":
                      if not candidate_run_id:
                          raise RuntimeError("RELEASE_DEPENDENCY_FAILURE: no successful v3-candidate.yml run ID is available")
                      inputs[name] = candidate_run_id
                  elif isinstance(spec, dict) and spec.get("required") is True:
                      raise RuntimeError(f"unsupported required inputs for {workflow}: {name}")
              if workflow == "v3.5-pr-integrity.yml":
                  if not {"expected_sha", "delay_seconds"} <= set(schema):
                      raise RuntimeError("V35_INPUT_CONTRACT_FAILURE: expected_sha and delay_seconds must be declared")
              if workflow == "release.yml":
                  if not {"target_sha", "candidate_run_id"} <= set(schema):
                      raise RuntimeError("RELEASE_INPUT_CONTRACT_FAILURE: target_sha and candidate_run_id must be declared")
              return inputs

          def workflow_inputs(path):
              document = yaml.safe_load(pathlib.Path(".github/workflows", path).read_text(encoding="utf-8")) or {}
              # PyYAML may resolve YAML 1.1 "on" as boolean True.
              events = document.get("on") or document.get(True) or {}
              dispatch = events.get("workflow_dispatch") or {}
              if "workflow_dispatch" not in events:
                  raise RuntimeError(f"WORKFLOW_NOT_DISPATCHABLE: {path}")
              return dispatch.get("inputs") or {}

          print(f"TARGET_SHA={target_sha}")
          print(f"TARGET_REF={target_ref}")
          print("Sequential dispatch plan:")
          for entry in entries:
              print(f"  stage {entry['stage']}: {entry['file']}")

          ref_path = f"repos/{repo}/git/ref/heads/{target_ref}"
          existing_ref = api(ref_path, check=False)
          if existing_ref.returncode == 0:
              existing_sha = json.loads(existing_ref.stdout).get("object", {}).get("sha")
              if existing_sha != target_sha:
                  raise RuntimeError(f"TARGET_REF_COLLISION: ref={target_ref} expected={target_sha} actual={existing_sha}")
          else:
              api(f"repos/{repo}/git/refs", "POST", {"ref": f"refs/heads/{target_ref}", "sha": target_sha})

          candidate_run_id = None
          for entry in entries:
              workflow = entry["file"]
              encoded = urllib.parse.quote(workflow, safe="")
              schema = workflow_inputs(workflow)
              inputs = dispatch_inputs(workflow, schema)

              before = json.loads(api(f"repos/{repo}/actions/workflows/{encoded}/runs?event=workflow_dispatch&per_page=100").stdout)
              prior_ids = {int(run["id"]) for run in before.get("workflow_runs", []) if run.get("id") is not None}

              print(f"\n=== DISPATCH stage {entry['stage']}: {workflow} ===")
              print(f"Dispatch inputs: {sorted(inputs)}")
              api(f"repos/{repo}/actions/workflows/{encoded}/dispatches", "POST", {"ref": target_ref, "inputs": inputs})

              deadline = time.time() + 3600
              run = None
              while time.time() < deadline:
                  data = json.loads(api(f"repos/{repo}/actions/workflows/{encoded}/runs?event=workflow_dispatch&per_page=100").stdout)
                  candidates = [
                      item for item in data.get("workflow_runs", [])
                      if int(item.get("id", -1)) not in prior_ids
                      and item.get("event") == "workflow_dispatch"
                      and item.get("head_sha") == target_sha
                      and item.get("head_branch") == target_ref
                  ]
                  if candidates:
                      run = max(candidates, key=lambda item: int(item["id"]))
                      break
                  time.sleep(3)

              if not run:
                  recovery(entry["stage"], workflow, "")
                  raise RuntimeError(f"STAGE_DISCOVERY_FAILURE|stage={entry['stage']}|workflow={workflow}|target_sha={target_sha}|target_ref={target_ref}")

              downstream_run = str(run["id"])
              if run.get("head_sha") != target_sha or run.get("head_branch") != target_ref:
                  recovery(entry["stage"], workflow, downstream_run)
                  raise RuntimeError(f"SHA_LINEAGE_FAILURE|stage={entry['stage']}|workflow={workflow}|expected_sha={target_sha}|actual_sha={run.get('head_sha')}|expected_ref={target_ref}|actual_ref={run.get('head_branch')}")

              print(f"Correlated run {downstream_run}: {run.get('html_url', '')}")
              while time.time() < deadline:
                  current = json.loads(api(f"repos/{repo}/actions/runs/{downstream_run}").stdout)
                  status = current.get("status")
                  conclusion = current.get("conclusion")
                  current_sha = current.get("head_sha")
                  current_ref = current.get("head_branch")
                  print(f"run {downstream_run}: status={status} conclusion={conclusion} head_sha={current_sha} head_branch={current_ref}")
                  if current_sha != target_sha or current_ref != target_ref:
                      recovery(entry["stage"], workflow, downstream_run)
                      raise RuntimeError(f"SHA_LINEAGE_FAILURE|stage={entry['stage']}|workflow={workflow}|expected_sha={target_sha}|actual_sha={current_sha}|expected_ref={target_ref}|actual_ref={current_ref}")
                  if status == "completed":
                      if conclusion != "success":
                          recovery(entry["stage"], workflow, downstream_run)
                          raise RuntimeError(f"STAGE_FAILURE|stage={entry['stage']}|workflow={workflow}|run_id={downstream_run}|conclusion={conclusion}|target_sha={target_sha}")
                      print(f"Stage {entry['stage']} completed successfully with TARGET_SHA={target_sha}.")
                      if workflow == "v3-candidate.yml":
                          candidate_run_id = downstream_run
                          print(f"VERIFIED_V3_CANDIDATE_RUN_ID={candidate_run_id}")
                      break
                  time.sleep(10)
              else:
                  recovery(entry["stage"], workflow, downstream_run)
                  raise RuntimeError(f"STAGE_TIMEOUT|stage={entry['stage']}|workflow={workflow}|run_id={downstream_run}|target_sha={target_sha}")

          print("All downstream dispatchable registry stages completed successfully.")
          print(f"FINAL_TARGET_SHA={target_sha}")
          if candidate_run_id:
              print(f"FINAL_V3_CANDIDATE_RUN_ID={candidate_run_id}")
          PY

      - name: Create repair branch and recovery manifest
        if: ${{ failure() && (inputs.mode == 'dispatch' || inputs.mode == 'repair') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.TARGET_SHA }}
        run: |
          set -euo pipefail
          branch="${REPAIR_BRANCH_PREFIX}-${GITHUB_RUN_ID}"
          echo "Creating isolated repair branch: $branch at $TARGET_SHA"
          ref_path="repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}"
          if existing_ref="$(gh api "$ref_path" 2>/dev/null)"; then
            existing_sha="$(printf '%s' "$existing_ref" | python -c 'import json,sys; print(json.load(sys.stdin).get("object",{}).get("sha",""))')"
            if [ "$existing_sha" != "$TARGET_SHA" ]; then
              echo "REPAIR_REF_SHA_MISMATCH: branch=$branch expected=$TARGET_SHA actual=$existing_sha"
              exit 1
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST --input - <<JSON
          {"ref":"refs/heads/${branch}","sha":"${TARGET_SHA}"}
          JSON
          fi
          mkdir -p evidence/generate
          cat > evidence/generate/repair-manifest.md <<EOF
          # Generate Repair Manifest

          - Orchestrator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Target commit: ${TARGET_SHA}
          - Repair branch: ${branch}
          - Failed stage: ${RECOVERY_STAGE:-unknown}
          - Failed workflow: ${RECOVERY_WORKFLOW:-unknown}
          - Failed downstream run: ${RECOVERY_RUN_ID:-unknown}
          - Main branch is not modified by recovery.

          ## Recovery contract
          1. Diagnose the failed stage from run evidence.
          2. Apply fixes on this repair branch only.
          3. Run preflight validation on this branch.
          4. Open a PR to main after validation passes.
          5. Resume from the failed stage.
          6. Promote Skill Memory only after successful validation and merge.
          EOF
          cat evidence/generate/repair-manifest.md
          echo "REPAIR_BRANCH=${branch}"
          echo "TARGET_SHA=${TARGET_SHA}"

      - name: Upload repair evidence artifact
        if: ${{ failure() && (inputs.mode == 'dispatch' || inputs.mode == 'repair') }}
        uses: actions/upload-artifact@v4
        with:
          name: generate-repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/generate/**
          if-no-files-found: error
          retention-days: 30

      - name: Emit safe result
        shell: bash
        run: |
          echo "Generate Orchestrator connected to registry, Tool Registry, Skill Memory, exact-SHA identity, sequential dispatch, and branch-isolated recovery."
          echo "TARGET_SHA=${TARGET_SHA}"
          echo 'The orchestrator itself is never recursively dispatched.'
          echo 'Main is never mutated directly by the repair path.'
