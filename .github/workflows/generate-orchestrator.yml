name: Generate Orchestrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory, validate, issue-read, or dispatch'
        required: false
        default: inventory
        type: choice
        options: [inventory, validate, issue-read, dispatch]

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: generate-orchestrator-main
  cancel-in-progress: false

env:
  REGISTRY: current/GENERATE_WORKFLOW_REGISTRY.yml
  WATCH_ISSUES: "32 52"
  REPAIR_BRANCH_PREFIX: fix/generate-stage

jobs:
  inventory-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inventory existing workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          test -f "$REGISTRY"
          test -f current/GENERATE_TIMELINE.md
          test -f current/tools/generate-timeline-tool.md
          test -f current/tools/docs-validation-generate.md
      - name: Read watched issues #32 and #52 (optional reference)
        if: ${{ inputs.mode == 'issue-read' || inputs.mode == 'validate' || inputs.mode == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/generate
          for issue in $WATCH_ISSUES; do
            echo "=== ISSUE #$issue ==="
            if gh api "repos/${GITHUB_REPOSITORY}/issues/$issue" > "evidence/generate/issue-$issue.json" 2>/dev/null; then
              python - "$issue" "evidence/generate/issue-$issue.json" <<'PY'
          import json,sys
          issue=sys.argv[1]; path=sys.argv[2]
          data=json.load(open(path))
          print(f"#{issue}: {data.get('state')} | {data.get('title')}")
          PY
            else
              echo "#${issue}: NOT_FOUND_OR_NOT_ACCESSIBLE"
              echo "Issue is optional reference only; continuing."
            fi
          done
      - name: Validate registry against repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import yaml
          data=yaml.safe_load(pathlib.Path('current/GENERATE_WORKFLOW_REGISTRY.yml').read_text()) or {}
          stages=data.get('stages') or []
          if not isinstance(stages,list): raise SystemExit('Registry stages must be a list.')
          missing=[]; dispatchable=0
          for entry in stages:
              if not isinstance(entry,dict): raise SystemExit(f'Invalid registry stage entry: {entry!r}')
              wf=entry.get('file')
              if not wf: raise SystemExit(f'Registry stage missing file: {entry!r}')
              if not pathlib.Path('.github/workflows',wf).is_file(): missing.append(wf)
              if entry.get('dispatchable') is True and wf != 'generate-orchestrator.yml': dispatchable += 1
          if missing: print('\n'.join(missing)); raise SystemExit(1)
          if dispatchable == 0: raise SystemExit('Registry contains no dispatchable downstream workflows.')
          print(f'Registry validation passed: {len(stages)} stages; {dispatchable} downstream dispatchable workflows.')
          PY
      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,yaml
          errors=[]
          for p in sorted(pathlib.Path('.github/workflows').glob('*.*ml')):
              try: yaml.safe_load(p.read_text())
              except Exception as e: errors.append(f'{p}: {e}')
          if errors: print('\n'.join(errors)); raise SystemExit(1)
          print('Workflow YAML validation passed.')
          PY
      - name: Dispatch registered stages sequentially
        if: ${{ inputs.mode == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,time,urllib.parse
          from datetime import datetime
          import yaml
          data=yaml.safe_load(pathlib.Path('current/GENERATE_WORKFLOW_REGISTRY.yml').read_text()) or {}
          entries=[]
          for e in data.get('stages') or []:
              if not isinstance(e,dict): raise SystemExit(f'Invalid stage entry: {e!r}')
              wf=e.get('file')
              if e.get('dispatchable') is True and wf and wf != 'generate-orchestrator.yml':
                  entries.append({'stage':int(e.get('stage',0)),'file':wf})
          entries.sort(key=lambda e:e['stage'])
          if not entries: raise SystemExit('No downstream dispatchable stages found; refusing to run.')
          print('Sequential dispatch plan:')
          for e in entries: print(f"  stage {e['stage']}: {e['file']}")
          def api(path,method='GET',payload=None):
              cmd=['gh','api',path,'--method',method]
              if payload is not None:
                  cmd += ['--input','-']
                  return subprocess.run(cmd,input=json.dumps(payload).encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
              return subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
          repo='${{ github.repository }}'
          for e in entries:
              wf=e['file']; encoded=urllib.parse.quote(wf,safe=''); started=time.time()
              print(f"\n=== DISPATCH stage {e['stage']}: {wf} ===")
              api(f'repos/{repo}/actions/workflows/{encoded}/dispatches','POST',{'ref':'main'})
              deadline=time.time()+3600; run=None
              while time.time()<deadline:
                  data=json.loads(api(f'repos/{repo}/actions/workflows/{encoded}/runs?event=workflow_dispatch&per_page=20'))
                  candidates=[]
                  for r in data.get('workflow_runs',[]):
                      created=r.get('created_at')
                      if not created: continue
                      ts=datetime.fromisoformat(created.replace('Z','+00:00')).timestamp()
                      if ts >= started-5: candidates.append(r)
                  if candidates: run=max(candidates,key=lambda r:r['id']); break
                  time.sleep(3)
              if not run: raise SystemExit(f"Could not identify dispatched run for {wf}")
              run_id=run['id']; print(f"Dispatched run {run_id}: {run.get('html_url','')}")
              while time.time()<deadline:
                  current=json.loads(api(f'repos/{repo}/actions/runs/{run_id}'))
                  status=current.get('status'); conclusion=current.get('conclusion')
                  print(f"run {run_id}: status={status} conclusion={conclusion}")
                  if status=='completed':
                      if conclusion!='success': raise RuntimeError(f"STAGE_FAILURE|stage={e['stage']}|workflow={wf}|run_id={run_id}|conclusion={conclusion}")
                      print(f"Stage {e['stage']} completed successfully."); break
                  time.sleep(10)
              else: raise RuntimeError(f"STAGE_TIMEOUT|stage={e['stage']}|workflow={wf}|run_id={run_id}")
          print('\nAll downstream dispatchable registry stages completed successfully.')
          PY
      - name: Create repair branch and recovery manifest
        if: ${{ failure() && inputs.mode == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${REPAIR_BRANCH_PREFIX}-${GITHUB_RUN_ID}"
          echo "Creating isolated repair branch: $branch"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST --input - <<JSON
          {"ref":"refs/heads/${branch}","sha":"${GITHUB_SHA}"}
          JSON
          mkdir -p evidence/generate
          cat > evidence/generate/repair-manifest.md <<EOF
          # Generate Repair Manifest
          - Orchestrator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Repair branch: ${branch}
          - Reason: downstream dispatch/validation failure
          - Main branch is not modified by recovery.
          ## Recovery contract
          1. Diagnose the failed stage from run evidence.
          2. Apply generated/source fixes on this repair branch only.
          3. Run preflight validation on this branch.
          4. Open a PR to main after validation passes.
          5. Resume from the failed stage; do not restart already-passed stages unless required.
          EOF
          python - <<'PY'
          import base64,json,os,subprocess
          path='evidence/generate/repair-manifest.md'
          content=base64.b64encode(open(path,'rb').read()).decode()
          branch=os.environ['REPAIR_BRANCH_PREFIX']+'-'+os.environ['GITHUB_RUN_ID']
          repo=os.environ['GITHUB_REPOSITORY']
          payload=json.dumps({'message':'chore(generate): record failed stage recovery manifest','content':content,'branch':branch})
          subprocess.run(['gh','api',f'repos/{repo}/contents/{path}','--method','PUT','--input','-'],input=payload.encode(),check=True)
          PY
          echo "REPAIR_BRANCH=${branch}"
          echo "Repair branch created. Main remains untouched."
      - name: Emit safe result
        shell: bash
        run: |
          echo 'Generate Orchestrator connected to registry, timeline, docs validation, and optional issue references.'
          echo 'Existing workflows remain preserved.'
          echo 'The orchestrator itself is never recursively dispatched.'
          echo 'On downstream failure, recovery is isolated to a repair branch.'
