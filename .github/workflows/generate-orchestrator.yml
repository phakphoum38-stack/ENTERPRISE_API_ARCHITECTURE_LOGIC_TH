name: Generate Orchestrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory, validate, issue-read, dispatch, or repair'
        required: false
        default: inventory
        type: choice
        options: [inventory, validate, issue-read, dispatch, repair]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: write

concurrency:
  group: generate-orchestrator-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: current/GENERATE_WORKFLOW_REGISTRY.yml
  TOOL_REGISTRY: current/tools/generate-tool-registry.yml
  SKILL_MEMORY: current/GENERATE_SKILL_MEMORY.md
  WATCH_ISSUES: "32 52"

jobs:
  inventory-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Inventory existing workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          test -f "$REGISTRY"
          test -f "$TOOL_REGISTRY"
          test -f "$SKILL_MEMORY"
          test -f current/GENERATE_TIMELINE.md
          test -f current/tools/generate-timeline-tool.md
          test -f current/tools/docs-validation-generate.md
          test -f current/tools/generate-ai-repair-contract.md

      - name: Read watched issues #32 and #52 (optional reference)
        if: ${{ inputs.mode == 'issue-read' || inputs.mode == 'validate' || inputs.mode == 'dispatch' || inputs.mode == 'repair' || github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/generate
          for issue in $WATCH_ISSUES; do
            echo "=== ISSUE #$issue ==="
            if gh api "repos/${GITHUB_REPOSITORY}/issues/$issue" > "evidence/generate/issue-$issue.json" 2>/dev/null; then
              python - "$issue" "evidence/generate/issue-$issue.json" <<'PY'
          import json,sys
          issue=sys.argv[1]; path=sys.argv[2]
          data=json.load(open(path))
          print(f"#{issue}: {data.get('state')} | {data.get('title')}")
          PY
            else
              echo "#${issue}: NOT_FOUND_OR_NOT_ACCESSIBLE"
              echo "Issue is optional reference only; continuing."
            fi
          done
          echo "Optional issue reference scan completed."

      - name: Validate registry against repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              raise SystemExit('PyYAML is required for registry validation.')
          data=yaml.safe_load(pathlib.Path('current/GENERATE_WORKFLOW_REGISTRY.yml').read_text()) or {}
          stages=data.get('stages') or []
          if not isinstance(stages,list):
              raise SystemExit('Registry stages must be a list.')
          missing=[]
          dispatchable=0
          for entry in stages:
              if not isinstance(entry,dict):
                  raise SystemExit(f'Invalid registry stage entry: {entry!r}')
              wf=entry.get('file')
              if not wf:
                  raise SystemExit(f'Registry stage missing file: {entry!r}')
              if not pathlib.Path('.github/workflows',wf).is_file():
                  missing.append(wf)
              if entry.get('dispatchable') is True and wf != 'generate-orchestrator.yml':
                  dispatchable += 1
          if missing:
              print('\n'.join(missing)); raise SystemExit(1)
          if dispatchable == 0:
              raise SystemExit('Registry contains no dispatchable downstream workflows.')
          print(f'Registry validation passed: {len(stages)} stages; {dispatchable} downstream dispatchable workflows.')
          PY

      - name: Validate AI tool registry and skill memory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,yaml
          tools=yaml.safe_load(pathlib.Path('current/tools/generate-tool-registry.yml').read_text()) or {}
          entries=tools.get('entries') or []
          if not entries:
              raise SystemExit('Generate tool registry is empty.')
          for e in entries:
              if not e.get('id') or not e.get('capability') or not e.get('safe_boundary'):
                  raise SystemExit(f'Invalid tool registry entry: {e!r}')
          memory=pathlib.Path('current/GENERATE_SKILL_MEMORY.md').read_text()
          for required in ('candidate', 'validated', 'reusable', 'Evidence'):
              if required not in memory:
                  raise SystemExit(f'Skill memory contract missing: {required}')
          print(f'AI tool registry validated: {len(entries)} tools.')
          print('Skill Memory contract validated.')
          PY

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              print('PyYAML unavailable; skipping parser-only check.')
              raise SystemExit(0)
          errors=[]
          for p in sorted(pathlib.Path('.github/workflows').glob('*.*ml')):
              try: yaml.safe_load(p.read_text())
              except Exception as e: errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('Workflow YAML validation passed.')
          PY

      - name: Prepare AI repair evidence
        if: ${{ inputs.mode == 'repair' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/generate
          cat > evidence/generate/repair-context.md <<EOF
          # Generate AI Repair Context

          - Repository: ${GITHUB_REPOSITORY}
          - Event: ${GITHUB_EVENT_NAME}
          - Ref: ${GITHUB_REF}
          - Source SHA: ${GITHUB_SHA}
          - Source run: ${GITHUB_RUN_ID}
          - Tool registry: ${TOOL_REGISTRY}
          - Skill memory: ${SKILL_MEMORY}
          - Repair boundary: branch-only
          - Main mutation: forbidden
          EOF
          git status --short

      - name: Create repair branch and preserve evidence
        if: ${{ inputs.mode == 'repair' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            branch="fix/generate-repair-${GITHUB_RUN_ID}"
          else
            branch="fix/generate-repair-${GITHUB_RUN_ID}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add evidence/generate/repair-context.md
          git commit -m "generate: record AI repair context" || true
          git push --set-upstream origin "$branch"
          echo "REPAIR_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "Repair branch created: $branch"
          echo "No changes are permitted directly on main."

      - name: Dispatch registered stages sequentially
        if: ${{ inputs.mode == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, time, urllib.parse
          from datetime import datetime
          import yaml

          registry=pathlib.Path('current/GENERATE_WORKFLOW_REGISTRY.yml')
          data=yaml.safe_load(registry.read_text()) or {}
          stages=data.get('stages') or []
          entries=[]
          for e in stages:
              if not isinstance(e,dict):
                  raise SystemExit(f'Invalid stage entry: {e!r}')
              wf=e.get('file')
              if e.get('dispatchable') is True and wf and wf != 'generate-orchestrator.yml':
                  entries.append({'stage':int(e.get('stage',0)),'file':wf})
          entries.sort(key=lambda e:e['stage'])
          if not entries:
              raise SystemExit('No downstream dispatchable stages found; refusing to run.')

          print('Sequential dispatch plan:')
          for e in entries:
              print(f"  stage {e['stage']}: {e['file']}")

          def api(path, method='GET', payload=None):
              cmd=['gh','api',path,'--method',method]
              if payload is not None:
                  cmd += ['--input','-']
                  return subprocess.run(cmd,input=json.dumps(payload).encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
              return subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout

          repo='${{ github.repository }}'
          for e in entries:
              wf=e['file']
              encoded=urllib.parse.quote(wf,safe='')
              started=time.time()
              print(f"\n=== DISPATCH stage {e['stage']}: {wf} ===")
              api(f'repos/{repo}/actions/workflows/{encoded}/dispatches','POST',{'ref':'main'})

              deadline=time.time()+3600
              run=None
              while time.time()<deadline:
                  raw=api(f'repos/{repo}/actions/workflows/{encoded}/runs?event=workflow_dispatch&per_page=20')
                  data=json.loads(raw)
                  candidates=[]
                  for r in data.get('workflow_runs',[]):
                      created=r.get('created_at')
                      if not created: continue
                      ts=datetime.fromisoformat(created.replace('Z','+00:00')).timestamp()
                      if ts >= started-5: candidates.append(r)
                  if candidates:
                      run=max(candidates,key=lambda r:r['id'])
                      break
                  time.sleep(3)

              if not run:
                  raise SystemExit(f"Could not identify dispatched run for {wf}")

              run_id=run['id']
              print(f"Dispatched run {run_id}: {run.get('html_url','')}")
              while time.time()<deadline:
                  current=json.loads(api(f'repos/{repo}/actions/runs/{run_id}'))
                  status=current.get('status')
                  conclusion=current.get('conclusion')
                  print(f"run {run_id}: status={status} conclusion={conclusion}")
                  if status=='completed':
                      if conclusion!='success':
                          raise SystemExit(f"Stage {e['stage']} {wf} failed: {conclusion}")
                      print(f"Stage {e['stage']} completed successfully.")
                      break
                  time.sleep(10)
              else:
                  raise SystemExit(f"Stage {e['stage']} timed out")

          print('\nAll downstream dispatchable registry stages completed successfully.')
          PY

      - name: Emit safe result
        shell: bash
        run: |
          echo 'Generate Orchestrator connected to Brain/AI repair contracts, Tool Registry, Skill Memory, registry, timeline, docs validation, and optional issue references.'
          echo 'Repair mutations are branch-only; main is never mutated by the repair path.'
          echo 'Existing workflows remain preserved.'
          echo 'The orchestrator itself is never recursively dispatched.'
