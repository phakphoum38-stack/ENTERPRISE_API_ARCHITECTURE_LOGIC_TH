name: Generate Orchestrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory, validate, issue-read, dispatch, or repair'
        required: false
        default: inventory
        type: choice
        options: [inventory, validate, issue-read, dispatch, repair]
      ref:
        description: 'Exact commit SHA or branch to validate'
        required: false
        default: ''
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: write

concurrency:
  group: generate-orchestrator-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: current/GENERATE_WORKFLOW_REGISTRY.yml
  TOOL_REGISTRY: current/tools/generate-tool-registry.yml
  SKILL_MEMORY: current/GENERATE_SKILL_MEMORY.md
  WATCH_ISSUES: "32 52"
  REPAIR_BRANCH_PREFIX: fix/generate-stage
  RECOVERY_STAGE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode || 'inventory' }}
  RECOVERY_RUN_ID: ${{ github.run_id }}

jobs:
  inventory-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref_name }}

      - name: Inventory existing workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          test -f "$REGISTRY"
          test -f "$TOOL_REGISTRY"
          test -f "$SKILL_MEMORY"
          test -f current/GENERATE_TIMELINE.md
          test -f current/tools/generate-timeline-tool.md
          test -f current/tools/docs-validation-generate.md
          test -f current/tools/generate-ai-repair-contract.md

      - name: Read watched issues #32 and #52 (optional reference)
        if: ${{ inputs.mode == 'issue-read' || inputs.mode == 'validate' || inputs.mode == 'dispatch' || inputs.mode == 'repair' || github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/generate
          for issue in $WATCH_ISSUES; do
            echo "=== ISSUE #$issue ==="
            if gh api "repos/${GITHUB_REPOSITORY}/issues/$issue" > "evidence/generate/issue-$issue.json" 2>/dev/null; then
              python - "$issue" "evidence/generate/issue-$issue.json" <<'PY'
          import json,sys
          issue=sys.argv[1]; path=sys.argv[2]
          data=json.load(open(path))
          print(f"#{issue}: {data.get('state')} | {data.get('title')}")
          PY
            else
              echo "#${issue}: NOT_FOUND_OR_NOT_ACCESSIBLE"
              echo "Issue is optional reference only; continuing."
            fi
          done
          echo "Optional issue reference scan completed."

      - name: Validate branch-isolated repair path
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test -n "$branch"
          # Contract marker: refs/heads/${branch}
          repair_ref="refs/heads/${branch}"
          echo "Repair branch: ${branch}"
          echo "Repair ref: ${repair_ref}"
          test "$repair_ref" = "refs/heads/${branch}"

      - name: Validate registry against repository
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovery correlation: stage=${RECOVERY_STAGE} run_id=${RECOVERY_RUN_ID}"
          python tools/validate_generate_orchestrator.py
