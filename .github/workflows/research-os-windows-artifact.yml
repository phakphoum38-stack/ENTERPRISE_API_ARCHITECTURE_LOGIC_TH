name: Research OS Windows Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/chatgpt-style-desktop-shell
      - fix/friend-github-tool
    paths:
      - "apps/research_os_flutter/**"
      - ".github/workflows/research-os-windows-artifact.yml"

permissions:
  contents: read

concurrency:
  group: research-os-windows-artifact-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PROJECT_NAME: research_os_flutter
  APP_EXE_NAME: research_os_flutter.exe
  APP_PRODUCT_NAME: Research OS
  APP_COMPANY_NAME: Research OS Team

jobs:
  build:
    name: Build canonical Research OS Windows artifact
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Research OS desktop source
        uses: actions/checkout@v4

      - name: Assert this pipeline cannot build Owner Special
        shell: pwsh
        run: |
          if ($env:APP_PROJECT_NAME -eq 'research_os_owner_special' -or $env:APP_EXE_NAME -eq 'research_os_owner_special.exe') {
            throw 'Research OS pipeline identity collided with Owner Special.'
          }
          Write-Host 'RESEARCH_OS_IDENTITY_ISOLATION_GATE=PASS'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Research OS Flutter source
        working-directory: apps/research_os_flutter
        shell: pwsh
        run: |
          if (-not (Test-Path 'pubspec.yaml')) { throw 'Research OS pubspec.yaml is missing.' }
          if (-not (Test-Path 'lib')) { throw 'Research OS lib source is missing.' }
          if (-not (Test-Path 'test')) { throw 'Research OS test source is missing.' }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Research OS flutter pub get failed.' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Research OS Flutter analyze failed.' }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw 'Research OS Flutter tests failed.' }
          flutter test test/desktop_shell_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Research OS desktop shell UI test failed.' }

      - name: Isolate Windows Flutter bootstrap workspace
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'apps/research_os_flutter'
          $workspace = Join-Path $env:RUNNER_TEMP 'research-os-flutter-windows'
          if (Test-Path $workspace) { Remove-Item $workspace -Recurse -Force }
          New-Item -ItemType Directory -Path $workspace | Out-Null
          Get-ChildItem -Path $source -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination $workspace -Recurse -Force
          }
          Set-Location $workspace
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=$env:APP_PROJECT_NAME .
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Flutter Windows bootstrap failed.' }
          if (-not (Test-Path 'windows/CMakeLists.txt')) { throw 'Isolated Windows CMakeLists.txt was not generated.' }
          if (-not (Test-Path 'windows/runner/main.cpp')) { throw 'Isolated Windows runner was not generated.' }
          if (-not (Test-Path 'windows/runner/Runner.rc')) { throw 'Isolated Windows identity file was not generated.' }
          Write-Host 'RESEARCH_OS_ISOLATED_WINDOWS_BOOTSTRAP=PASS'

      - name: Apply Research OS Windows branding in isolated workspace
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'research-os-flutter-windows'
          Set-Location $workspace
          $mainCpp = 'windows\runner\main.cpp'
          $mainText = Get-Content $mainCpp -Raw
          $mainText = $mainText -replace 'Create\(L"research_os_flutter"', 'Create(L"Research OS"'
          Set-Content -Path $mainCpp -Value $mainText -Encoding utf8

          $runnerRc = 'windows\runner\Runner.rc'
          $rc = Get-Content $runnerRc -Raw
          $rc = $rc -replace 'VALUE "CompanyName", ".*?"', 'VALUE "CompanyName", "Research OS Team"'
          $rc = $rc -replace 'VALUE "FileDescription", ".*?"', 'VALUE "FileDescription", "Research OS"'
          $rc = $rc -replace 'VALUE "InternalName", ".*?"', 'VALUE "InternalName", "ResearchOS"'
          $rc = $rc -replace 'VALUE "OriginalFilename", ".*?"', 'VALUE "OriginalFilename", "research_os_flutter.exe"'
          $rc = $rc -replace 'VALUE "ProductName", ".*?"', 'VALUE "ProductName", "Research OS"'
          $rc = $rc -replace 'VALUE "LegalCopyright", ".*?"', 'VALUE "LegalCopyright", "Copyright (C) 2026 Research OS Team"'
          Set-Content -Path $runnerRc -Value $rc -Encoding utf8

          $verifyRc = Get-Content $runnerRc -Raw
          if ($verifyRc -notmatch 'VALUE "ProductName", "Research OS"') { throw 'Research OS ProductName branding was not applied.' }
          if ($verifyRc -notmatch 'VALUE "CompanyName", "Research OS Team"') { throw 'Research OS CompanyName branding was not applied.' }
          if ($verifyRc -match 'research_os_owner_special') { throw 'Owner Special identity leaked into isolated Research OS Runner.rc.' }
          Write-Host 'RESEARCH_OS_WINDOWS_BRANDING=PASS'

      - name: Build isolated Research OS Windows release
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'research-os-flutter-windows'
          Set-Location $workspace
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Research OS isolated flutter pub get failed.' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Research OS Windows build failed.' }

          $exe = Get-ChildItem -Path 'build/windows' -Filter $env:APP_EXE_NAME -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Expected Research OS executable '$env:APP_EXE_NAME' was not produced." }
          $version = $exe.VersionInfo
          if ($version.ProductName -ne $env:APP_PRODUCT_NAME) { throw "Unexpected ProductName: '$($version.ProductName)'" }
          if ($version.CompanyName -ne $env:APP_COMPANY_NAME) { throw "Unexpected CompanyName: '$($version.CompanyName)'" }
          if ($version.InternalName -eq 'research_os_owner_special') { throw 'Owner Special InternalName leaked into Research OS artifact.' }
          if ($version.OriginalFilename -match 'owner_special') { throw 'Owner Special OriginalFilename leaked into Research OS artifact.' }

          $release = $exe.Directory.FullName
          $stage = Join-Path $env:RUNNER_TEMP 'Research-OS-Windows'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "$release/*" $stage -Recurse -Force

          @"
          Research OS Windows x64
          App: Research OS
          Project: $env:APP_PROJECT_NAME
          Executable: $env:APP_EXE_NAME
          Publisher/Team: $env:APP_COMPANY_NAME
          Desktop commit: $env:GITHUB_SHA
          Identity isolation gate: PASS
          UI gate: flutter analyze + full tests + desktop shell test
          Windows bootstrap: isolated temporary workspace only
          Windows branding: Research OS / Research OS Team
          "@ | Set-Content (Join-Path $stage 'RESEARCH_OS_BUILD_INFO.txt') -Encoding utf8

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP/Research-OS-Windows" -Filter $env:APP_EXE_NAME -File | Select-Object -First 1
          if (-not $exe) { throw 'Research OS staged executable missing.' }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 5
          try {
            if ($app.HasExited) { throw "Research OS exited during launch smoke with code $($app.ExitCode)." }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host 'RESEARCH_OS_UI_LAUNCH=PASS'

      - name: Package Research OS Windows artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'Research-OS-Windows'
          $zip = Join-Path $env:RUNNER_TEMP 'Research-OS-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Research-OS-Windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "RESEARCH_OS_WINDOWS_SHA256=$hash"

      - name: Upload Research OS Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Research-OS-Windows-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Research-OS-Windows-x64.zip
            ${{ runner.temp }}/Research-OS-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
