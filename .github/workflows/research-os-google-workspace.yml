name: Research OS Google Workspace

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Research OS Windows Desktop
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: research-os-workspace-secondary-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  validate-workspace-foundation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Workspace core and API
        run: |
          python -m py_compile tools/research_os_api/google_workspace.py
          python -m py_compile tools/research_os_api/google_oauth.py
          python -m py_compile tools/research_os_api/server.py

      - name: Test Workspace core and OAuth broker
        working-directory: tools/research_os_api
        run: python -m unittest test_google_workspace.py test_google_oauth.py -v

      - name: Verify service registry
        working-directory: tools/research_os_api
        run: |
          python - <<'PY'
          from google_workspace import WORKSPACE_SERVICES
          expected = {"drive","docs","sheets","calendar","gmail","contacts","tasks","keep","meet","forms","chat"}
          actual = set(WORKSPACE_SERVICES)
          if actual != expected:
              raise SystemExit(f"Workspace registry mismatch: {actual}")
          print("Workspace registry OK:", ", ".join(WORKSPACE_SERVICES))
          PY

      - name: Verify OAuth authorization URL does not expose secret
        working-directory: tools/research_os_api
        env:
          RESEARCH_OS_GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
          RESEARCH_OS_GOOGLE_CLIENT_SECRET: ci-secret-value
          RESEARCH_OS_DATA_DIR: ${{ runner.temp }}/ResearchOSData
        run: |
          python - <<'PY'
          from google_oauth import GoogleOAuthBroker
          result = GoogleOAuthBroker().begin()
          assert "ci-client.apps.googleusercontent.com" in result["authorization_url"]
          assert "ci-secret-value" not in result["authorization_url"]
          print("OAuth URL guard OK")
          PY

      - name: Workspace security guard
        run: |
          if grep -R -n -E "(RESEARCH_OS_GOOGLE_CLIENT_SECRET|GOOGLE_CLIENT_SECRET)[[:space:]]*=[[:space:]]*['\"][^'\"]+" apps/research_os_flutter; then
            echo "Google secret must not be embedded in Flutter"
            exit 1
          fi
          if grep -R -n -E "refresh_token|client_secret" apps/research_os_flutter/lib; then
            echo "Raw Google OAuth credentials must not be represented in Flutter source"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "# Google Workspace Hub — Secondary"
            echo "- Generic Flutter analyze/test removed; owned by main workflow"
            echo "- Workspace core, OAuth, registry and secret guards remain"
          } >> "$GITHUB_STEP_SUMMARY"
