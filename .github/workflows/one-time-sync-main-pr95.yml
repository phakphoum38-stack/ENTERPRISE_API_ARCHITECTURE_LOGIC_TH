name: One-time PR95 main sync

on:
  push:
    branches:
      - agent/v3.5-worker-pool-hardening

permissions:
  contents: write

jobs:
  sync-main:
    if: contains(github.event.head_commit.message, 'resolve generate orchestrator merge conflict using main gate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge --no-commit --no-ff origin/main; then
            echo "MAIN_MERGE=clean"
          else
            echo "MAIN_MERGE=conflicts"
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf '%s\n' "$conflicts"

            allowed='^.github/workflows/(generate-orchestrator|research-os-final-gate|research-os-gate)\.yml$|^v3/research_os_v3/queue\.py$|^v3/worker_pool\.py$'
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if ! printf '%s\n' "$path" | grep -Eq "$allowed"; then
                echo "Unexpected merge conflict: $path"
                exit 1
              fi
            done <<< "$conflicts"

            for path in \
              .github/workflows/generate-orchestrator.yml \
              .github/workflows/research-os-final-gate.yml \
              .github/workflows/research-os-gate.yml; do
              if git ls-files -u -- "$path" | grep -q .; then
                git checkout --theirs -- "$path"
                git add "$path"
              fi
            done

            for path in \
              v3/research_os_v3/queue.py \
              v3/worker_pool.py; do
              if git ls-files -u -- "$path" | grep -q .; then
                git checkout --ours -- "$path"
                git add "$path"
              fi
            done

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved conflicts remain"
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          git add -A
          git rm -f .github/workflows/one-time-sync-main-pr95.yml
          git commit -m "chore(v3.5): sync latest main into worker pool hardening"
          git push origin HEAD:agent/v3.5-worker-pool-hardening
