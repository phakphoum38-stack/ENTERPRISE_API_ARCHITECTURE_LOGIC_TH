name: Research OS Flutter Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/research_os_flutter/**"
      - ".github/workflows/00-flutter-validate.yml"
  pull_request:
    paths:
      - "apps/research_os_flutter/**"
      - ".github/workflows/00-flutter-validate.yml"

permissions:
  contents: read

concurrency:
  group: research-os-flutter-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test Flutter
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/research_os_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze Flutter
        shell: pwsh
        run: flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        run: flutter test
