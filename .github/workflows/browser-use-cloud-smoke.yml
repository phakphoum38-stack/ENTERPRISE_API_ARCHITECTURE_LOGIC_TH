name: Browser Use Cloud Connect Smoke

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate
        required: false
        type: string
      connect_cloud:
        description: Use real Browser Use Cloud instead of the local simulator
        required: false
        default: false
        type: boolean
      proxy_country_code:
        description: Browser Use Cloud proxy country code
        required: false
        default: us
        type: string
  push:
    branches:
      - main
    paths:
      - .github/cloud-smoke-trigger

permissions:
  contents: read

concurrency:
  group: browser-use-cloud-smoke-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  connect-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event_name == 'push' && 'd35b52bfcbe36e96066297068e5386c183f8a44d' || inputs.target_sha || github.sha }}
      RESEARCH_OS_PROVIDER: mock
      RUN_REAL_CLOUD: ${{ github.event_name == 'push' || inputs.connect_cloud == true }}
      PROXY_COUNTRY_CODE: ${{ inputs.proxy_country_code || 'us' }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure runner paths
        shell: bash
        run: |
          echo "RESEARCH_OS_DATA_DIR=$RUNNER_TEMP/ResearchOSData" >> "$GITHUB_ENV"
          echo "RESEARCH_OS_CONVERSATION_STORE=$RUNNER_TEMP/ResearchOSData/sessions/conversations.json" >> "$GITHUB_ENV"

      - name: Require Browser Use Cloud secret for real-cloud mode
        if: ${{ env.RUN_REAL_CLOUD == 'true' }}
        shell: bash
        env:
          REAL_BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
        run: |
          if [ -z "$REAL_BROWSER_USE_API_KEY" ]; then
            echo "BROWSER_USE_API_KEY GitHub Secret is required when real cloud is enabled."
            exit 1
          fi

      - name: Validate backend connector
        working-directory: tools/research_os_api
        run: |
          python -m unittest \
            test_browser_use_cloud \
            test_api.ResearchOSAPITests.test_browser_use_status_is_backend_key_gated

      - name: Start simulated Browser Use Cloud
        if: ${{ env.RUN_REAL_CLOUD != 'true' }}
        run: |
          python tools/research_os_api/browser_use_cloud_simulator.py --host 127.0.0.1 --port 8799 > "$RUNNER_TEMP/browser-use-sim.log" 2>&1 &
          echo "BROWSER_USE_SIM_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8799/health > /tmp/browser-use-sim-health.json; then
              cat /tmp/browser-use-sim-health.json
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/browser-use-sim.log"
          exit 1

      - name: Start Research OS API
        env:
          BROWSER_USE_API_BASE: ${{ env.RUN_REAL_CLOUD == 'true' && 'https://api.browser-use.com' || 'http://127.0.0.1:8799' }}
          BROWSER_USE_API_KEY: ${{ env.RUN_REAL_CLOUD == 'true' && secrets.BROWSER_USE_API_KEY || 'browser-use-ci-simulator-key' }}
        run: |
          python tools/research_os_api/server.py --host 127.0.0.1 --port 8787 > "$RUNNER_TEMP/research-os-api.log" 2>&1 &
          echo "RESEARCH_OS_API_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/research-os-health.json; then
              cat /tmp/research-os-health.json
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/research-os-api.log"
          exit 1

      - name: Verify backend status redaction
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8787/v1/browser-use/status", timeout=5) as response:
              status = json.loads(response.read().decode("utf-8"))

          assert status["provider"] == "browser_use_cloud", status
          assert status["token_storage"] == "backend_env_only", status
          assert "api_key" not in status, status
          assert "cdp_url" not in status, status
          print(
              json.dumps(
                  {
                      "provider": status["provider"],
                      "api_base_host": status["api_base_host"],
                      "api_key_configured": status["api_key_configured"],
                      "connected": status["connected"],
                      "token_storage": status["token_storage"],
                  },
                  ensure_ascii=False,
              )
          )
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter connect UI and client contract
        working-directory: apps/research_os_flutter
        run: |
          flutter pub get
          flutter test test/research_os_api_client_test.dart test/widget_test.dart

      - name: Connect and stop Browser Use session
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          api = "http://127.0.0.1:8787"

          def post(path, payload):
              request = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          connected = False
          try:
              status = post(
                  "/v1/browser-use/connect",
                  {"proxy_country_code": os.environ.get("PROXY_COUNTRY_CODE", "us")},
              )
              assert status["connected"] is True, status
              assert status["cdp_url_available"] is True, status
              assert "cdp_url" not in status, status
              connected = True
              print(
                  json.dumps(
                      {
                          "provider": status["provider"],
                          "browser_id": status["browser_id"],
                          "cdp_host": status["cdp_host"],
                          "connected": status["connected"],
                      },
                      ensure_ascii=False,
                  )
              )
          finally:
              if connected:
                  stopped = post("/v1/browser-use/disconnect", {})
                  assert stopped["connected"] is False, stopped
                  print(json.dumps({"stopped": stopped["stopped"]}, ensure_ascii=False))
          PY

      - name: Stop Research OS API
        if: always()
        run: |
          if [ -n "${RESEARCH_OS_API_PID:-}" ]; then
            kill "$RESEARCH_OS_API_PID" 2>/dev/null || true
          fi

      - name: Stop simulated Browser Use Cloud
        if: always()
        run: |
          if [ -n "${BROWSER_USE_SIM_PID:-}" ]; then
            kill "$BROWSER_USE_SIM_PID" 2>/dev/null || true
          fi

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-use-cloud-smoke-api-log
          path: ${{ runner.temp }}/research-os-api.log

      - name: Upload simulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-use-cloud-smoke-simulator-log
          path: ${{ runner.temp }}/browser-use-sim.log
