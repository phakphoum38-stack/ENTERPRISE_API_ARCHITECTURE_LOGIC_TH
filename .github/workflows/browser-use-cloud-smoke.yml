name: Browser Use Cloud Connect Smoke

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate
        required: false
        type: string
      connect_cloud:
        description: Use real Browser Use Cloud instead of the local simulator
        required: false
        default: false
        type: boolean
      proxy_country_code:
        description: Browser Use Cloud proxy country code
        required: false
        default: us
        type: string

permissions:
  contents: read

concurrency:
  group: browser-use-cloud-smoke-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  connect-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      RESEARCH_OS_PROVIDER: mock
      CONNECT_CLOUD: ${{ inputs.connect_cloud }}
      PROXY_COUNTRY_CODE: ${{ inputs.proxy_country_code || 'us' }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure runner paths
        shell: bash
        run: |
          echo "RESEARCH_OS_DATA_DIR=$RUNNER_TEMP/ResearchOSData" >> "$GITHUB_ENV"
          echo "RESEARCH_OS_CONVERSATION_STORE=$RUNNER_TEMP/ResearchOSData/sessions/conversations.json" >> "$GITHUB_ENV"

      - name: Stage 60 preflight helper
        run: |
          python tools/research_os_api/stage60_preflight.py

      - name: Require Browser Use Cloud secret for real-cloud mode
        if: ${{ inputs.connect_cloud == true }}
        shell: bash
        env:
          REAL_BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
        run: |
          if [ -z "$REAL_BROWSER_USE_API_KEY" ]; then
            echo "BROWSER_USE_API_KEY GitHub Secret is required when connect_cloud=true."
            exit 1
          fi

      - name: Start Research OS API
        env:
          BROWSER_USE_API_BASE: ${{ inputs.connect_cloud == true && 'https://api.browser-use.com' || '' }}
          BROWSER_USE_API_KEY: ${{ inputs.connect_cloud == true && secrets.BROWSER_USE_API_KEY || '' }}
        run: |
          python tools/research_os_api/server.py --host 127.0.0.1 --port 8787 > "$RUNNER_TEMP/research-os-api.log" 2>&1 &
          echo "RESEARCH_OS_API_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/research-os-health.json; then
              cat /tmp/research-os-health.json
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/research-os-api.log"
          exit 1

      - name: Verify backend status contract
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8787/health", timeout=5) as response:
              health = json.loads(response.read().decode("utf-8"))

          assert health["status"] == "ok", health
          assert health["service"] == "research-os-api", health
          assert health["memory"] is True, health
          print(json.dumps(health, ensure_ascii=False))
          PY

      - name: Run Python API tests
        working-directory: tools/research_os_api
        run: |
          python -m unittest discover -p 'test_*.py' -v

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter API and AI conversation contract
        working-directory: apps/research_os_flutter
        run: |
          flutter pub get
          flutter test test/research_os_api_client_test.dart test/widget_test.dart test/chat_flow_test.dart

      - name: Run live AI chat client E2E
        working-directory: apps/research_os_flutter
        env:
          RESEARCH_OS_API_BASE_URL: http://127.0.0.1:8787
        run: |
          dart run tool/chat_service_e2e.dart

      - name: Verify AI chat endpoint directly
        run: |
          python - <<'PY'
          import json
          import urllib.request

          def post(path, payload):
              request = urllib.request.Request(
                  f"http://127.0.0.1:8787{path}",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read().decode())

          generated = post("/v1/ai/generate", {"prompt": "Reply with CHAT-DIRECT-READY"})
          assert str(generated.get("text", "")).strip(), generated

          answer = post(
              "/v1/ai/answer-with-memory",
              {"question": "User: marker DIRECT-KITE-731\nAssistant: acknowledged\nUser: return DIRECT-KITE-731"},
          )
          assert "DIRECT-KITE-731" in str(answer.get("text", "")), answer
          print("AI_CHAT_DIRECT_E2E=PASS")
          PY

      - name: Stop Research OS API
        if: always()
        run: |
          if [ -n "${RESEARCH_OS_API_PID:-}" ]; then
            kill "$RESEARCH_OS_API_PID" 2>/dev/null || true
          fi

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-use-cloud-smoke-api-log
          path: ${{ runner.temp }}/research-os-api.log
