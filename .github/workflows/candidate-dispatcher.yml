name: Research OS Candidate Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - .github/candidate-dispatch-trigger

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical candidate exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_sha=139837110274bcbf326cf23931e7687b18438135
