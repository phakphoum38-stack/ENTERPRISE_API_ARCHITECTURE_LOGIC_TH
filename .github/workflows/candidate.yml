name: Research OS Candidate

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to build and validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: research-os-candidate-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and validate one Windows candidate
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      RESEARCH_OS_PROVIDER: mock
      RESEARCH_OS_SYNC_KEY: candidate-test-key
      RESEARCH_OS_ALLOW_LEGACY_IDENTITY_HEADERS: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: src

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run API compile and tests
        working-directory: src
        shell: pwsh
        run: |
          $env:RESEARCH_OS_DATA_DIR = "$env:RUNNER_TEMP\ResearchOSData"
          $env:RESEARCH_OS_CONVERSATION_STORE = "$env:RUNNER_TEMP\ResearchOSData\sessions\conversations.json"
          python -m compileall -q tools/research_os_api tools/research_curator
          python -m unittest discover -s tools/research_os_api -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "API tests failed" }

      - name: Stage Flutter app at short path
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\apps\research_os_flutter'
          $short = 'D:\w'
          if (Test-Path $short) { Remove-Item $short -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $short | Out-Null
          Copy-Item (Join-Path $source '*') $short -Recurse -Force

      - name: Build and test Windows app
        working-directory: D:\w
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name=research_os_flutter .
          python "$env:GITHUB_WORKSPACE\src\scripts\apply-research-os-branding.py" --app-root "D:\w" --platform windows
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed" }
          if (-not (Test-Path "D:\w\build\windows\x64\runner\Release\research_os_flutter.exe")) {
            throw "Windows app executable is missing"
          }

      - name: Publish ServiceHost
        working-directory: src
        shell: pwsh
        run: |
          dotnet publish tools/research_os_service/ResearchOS.ServiceHost.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -o tools/research_os_service/publish
          if (-not (Test-Path "tools\research_os_service\publish\ResearchOS.ServiceHost.exe")) {
            throw "ServiceHost executable is missing"
          }

      - name: Runtime smoke test
        working-directory: src
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\ResearchOSRuntime"
          .\scripts\setup-research-os-windows.ps1 -Root "$env:RUNNER_TEMP\ResearchOS" -DataDir $data
          .\scripts\start-research-os-local.ps1 -DataDir $data -Provider mock -Port 8787 -Background
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Local API did not become ready" }
          }
          finally {
            .\scripts\stop-research-os-local.ps1 -Port 8787 -PidFile "$data\run\research-os-api.pid" -ErrorAction SilentlyContinue
          }

      - name: Windows Service smoke test
        working-directory: src
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\ResearchOSServiceData"
          try {
            .\scripts\research-os-service.ps1 -Action install -DataDir $data
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Windows Service API did not become ready" }
            $service = Get-CimInstance Win32_Service -Filter "Name='ResearchOSService'"
            if (-not $service -or $service.State -ne 'Running') { throw "ResearchOSService is not running" }
          }
          finally {
            if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) {
              .\scripts\research-os-service.ps1 -Action uninstall -DataDir $data
            }
          }

      - name: Stage one-click installer package
        working-directory: src
        shell: pwsh
        run: |
          $package = Join-Path $PWD "installer\package"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$package\app" | Out-Null
          Copy-Item "D:\w\build\windows\x64\runner\Release\*" "$package\app" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$package\tools\research_os_service\publish" | Out-Null
          Copy-Item "tools\research_os_service\publish\*" "$package\tools\research_os_service\publish" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$package\tools\research_os_api" | Out-Null
          Copy-Item "tools\research_os_api\*.py" "$package\tools\research_os_api" -Force
          New-Item -ItemType Directory -Force -Path "$package\tools\research_curator" | Out-Null
          Copy-Item "tools\research_curator\*" "$package\tools\research_curator" -Recurse -Force
          if (Test-Path "apps\research_os_web") {
            New-Item -ItemType Directory -Force -Path "$package\apps\research_os_web" | Out-Null
            Copy-Item "apps\research_os_web\*" "$package\apps\research_os_web" -Recurse -Force
          }
          if (Test-Path "research\artifacts") {
            New-Item -ItemType Directory -Force -Path "$package\research\artifacts" | Out-Null
            Copy-Item "research\artifacts\*" "$package\research\artifacts" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "$package\scripts" | Out-Null
          Copy-Item "scripts\*research-os*.ps1" "$package\scripts" -Force
          Copy-Item "scripts\v2-data-preservation.ps1" "$package\scripts" -Force -ErrorAction SilentlyContinue
          $pythonRoot = (python -c "import sys; print(sys.base_prefix)").Trim()
          New-Item -ItemType Directory -Force -Path "$package\runtime\python" | Out-Null
          Copy-Item "$pythonRoot\*" "$package\runtime\python" -Recurse -Force
          if (-not (Test-Path "$package\runtime\python\python.exe")) { throw "Bundled Python runtime missing" }

      - name: Generate installer branding
        working-directory: src
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply-research-os-branding.py --app-root apps/research_os_flutter --platform windows
          if (-not (Test-Path "apps\research_os_flutter\assets\branding\research_os.ico")) {
            throw "Installer icon was not generated"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE once
        working-directory: src
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "installer\research-os.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem "installer\output\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE was not produced" }

      - name: Prepare clean installer validation
        working-directory: src
        shell: pwsh
        run: |
          if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) {
            sc.exe stop ResearchOSService | Out-Host
            Start-Sleep -Seconds 2
            sc.exe delete ResearchOSService | Out-Host
            Start-Sleep -Seconds 2
          }
          $listeners = Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue
          foreach ($listener in $listeners) { Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue }
          $root = Join-Path $env:ProgramFiles 'Research OS'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          $data = Join-Path $env:ProgramData 'ResearchOS'
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }
          .\scripts\v2-data-preservation.ps1 -Action Seed -DataDir "$env:ProgramData\ResearchOS"

      - name: Install validate and upgrade candidate
        working-directory: src
        shell: pwsh
        run: |
          $setup = Get-ChildItem "installer\output\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE missing" }
          $log = "$env:RUNNER_TEMP\research-os-install.log"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }

          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
              $v2 = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v2/health/readiness" -TimeoutSec 2
              if ($health.status -eq "ok" -and $v2.ready) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "Installed candidate did not become ready" }

          $listeners = @(Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction Stop)
          $unsafe = @($listeners | Where-Object { $_.LocalAddress -notin @('127.0.0.1', '::1') })
          if ($unsafe) { throw "Research OS API must listen on loopback only" }

          $providers = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v2/brain/providers" -TimeoutSec 5
          $serialized = $providers | ConvertTo-Json -Depth 8 -Compress
          if ($serialized -match '(?i)sk-[A-Za-z0-9_-]{8,}|Bearer\s+[A-Za-z0-9._-]+') {
            throw "Provider status contains credential-like data"
          }

          $serviceLog = Join-Path $env:ProgramData 'ResearchOS\logs\service-api.err.log'
          if (Test-Path $serviceLog) { Clear-Content $serviceLog -ErrorAction SilentlyContinue }
          $installedApp = Join-Path $env:ProgramFiles 'Research OS\app\research_os_flutter.exe'
          if (-not (Test-Path $installedApp)) { throw "Installed Flutter app executable is missing" }

          $app = Start-Process -FilePath $installedApp -PassThru
          try {
            $appConnected = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($app.HasExited) { throw "Installed Flutter app exited before app-to-service E2E completed" }
              if (Test-Path $serviceLog) {
                $requestLog = Get-Content $serviceLog -Raw -ErrorAction SilentlyContinue
                $sawHealth = $requestLog -match '"GET /health HTTP/1\.[01]" 200'
                $sawProviders = $requestLog -match '"GET /v1/providers HTTP/1\.[01]" 200'
                if ($sawHealth -and $sawProviders) {
                  $appConnected = $true
                  break
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $appConnected) {
              if (Test-Path $serviceLog) { Get-Content $serviceLog -Tail 100 | Out-Host }
              throw "Installed Flutter app did not prove app-to-service requests to /health and /v1/providers"
            }
            Write-Host "Installed Flutter app-to-service E2E passed."
          }
          finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }

          $upgradeLog = "$env:RUNNER_TEMP\research-os-upgrade.log"
          $u = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$upgradeLog") -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "In-place upgrade failed with exit code $($u.ExitCode)" }

          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Uninstall candidate and verify data preservation
        working-directory: src
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles 'Research OS'
          $uninstaller = Get-ChildItem $root -Filter 'unins*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller executable was not found" }
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($p.ExitCode)" }
          for ($i = 0; $i -lt 20; $i++) {
            if (-not (Get-Service ResearchOSService -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) { throw "ResearchOSService still exists after uninstall" }
          .\scripts\v2-data-preservation.ps1 -Action Verify -DataDir "$env:ProgramData\ResearchOS"

      - name: Create exact-SHA candidate evidence
        working-directory: src
        shell: pwsh
        run: |
          $out = "candidate-evidence"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $setup = Get-ChildItem "installer\output\Research-OS-Setup-*-x64.exe" | Select-Object -First 1
          Copy-Item $setup.FullName $out -Force
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content "$out\SHA256SUMS.txt" -Encoding utf8
          $manifest = [ordered]@{
            schema_version = 2
            target_sha = "$env:TARGET_SHA"
            candidate_run = "${{ github.run_id }}"
            validation = "passed"
            build_policy = "single-windows-runner"
            app_to_service_e2e = "passed"
            release_created = $false
            tag_created = $false
            artifact = [ordered]@{
              name = $setup.Name
              sha256 = $hash
              size_bytes = $setup.Length
            }
            data_boundary = "C:\ProgramData\ResearchOS"
            upgrade_policy = "preserve-local-data"
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content "$out\candidate-manifest.json" -Encoding utf8

      - name: Upload verified candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-verified-candidate-${{ env.TARGET_SHA }}
          path: src/candidate-evidence/**
          if-no-files-found: error
          retention-days: 30

      - name: Final cleanup
        if: always()
        continue-on-error: true
        working-directory: src
        shell: pwsh
        run: |
          if (Get-Service ResearchOSService -ErrorAction SilentlyContinue) {
            sc.exe stop ResearchOSService | Out-Host
            Start-Sleep -Seconds 1
            sc.exe delete ResearchOSService | Out-Host
          }
          $listeners = Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue
          foreach ($listener in $listeners) { Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue }
          exit 0