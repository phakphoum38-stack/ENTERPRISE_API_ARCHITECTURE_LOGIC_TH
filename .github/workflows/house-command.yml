name: House Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "คำสั่งที่อนุญาตให้บ้านทำงาน"
        required: true
        type: choice
        default: house-status
        options:
          - house-status
          - validate
          - test
          - graph
          - all
      note:
        description: "หมายเหตุจากเจ้าของบ้าน"
        required: false
        type: string
  repository_dispatch:
    types:
      - house-command

permissions:
  contents: read

concurrency:
  group: house-command-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Run allowlisted house command
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_OS_PROVIDER: mock
      MANUAL_COMMAND: ${{ inputs.command }}
      API_COMMAND: ${{ github.event.client_payload.command }}
      OWNER_NOTE: ${{ inputs.note || github.event.client_payload.note }}

    steps:
      - name: Checkout house
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve requested command
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          COMMAND="${MANUAL_COMMAND:-${API_COMMAND:-house-status}}"
          case "$COMMAND" in
            house-status|validate|test|graph|all) ;;
            *)
              echo "Unsupported command: $COMMAND" >&2
              exit 64
              ;;
          esac
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
          echo "## 🏡 House Command" >> "$GITHUB_STEP_SUMMARY"
          echo "- Command: \`$COMMAND\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${OWNER_NOTE:-}" ]; then
            echo "- Owner note: ${OWNER_NOTE}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compile dispatcher
        run: python -m py_compile tools/house_command/dispatcher.py

      - name: Execute command
        run: |
          python tools/house_command/dispatcher.py \
            "${{ steps.resolve.outputs.command }}" \
            --report artifacts/house-command/report.json

      - name: Add result to summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/house-command/report.json ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("artifacts/house-command/report.json").read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write(f"- Result: {'✅ passed' if report['ok'] else '❌ failed'}\n")
              handle.write(f"- Executed at: `{report['executed_at']}`\n")
          PY
          else
            echo "- Result: ❌ no report generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload command report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-command-${{ steps.resolve.outputs.command }}-${{ github.run_number }}
          path: artifacts/house-command/
          if-no-files-found: warn
          retention-days: 14
