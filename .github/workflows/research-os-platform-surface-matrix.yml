name: Research OS Platform Surface Matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/research_os_flutter/**"
      - "packages/research_os_contracts/**"
      - ".github/workflows/research-os-platform-surface-matrix.yml"
      - "current/RESEARCH_OS_PLATFORM_*.json"
      - "current/PLATFORM_PROJECT_SNAPSHOT_CONTRACT.json"
      - "current/PLATFORM_OPERATIONALIZATION_CONTRACT.json"
  push:
    branches:
      - main
    paths:
      - "apps/research_os_flutter/**"
      - "packages/research_os_contracts/**"
      - ".github/workflows/research-os-platform-surface-matrix.yml"
      - "current/RESEARCH_OS_PLATFORM_*.json"
      - "current/PLATFORM_PROJECT_SNAPSHOT_CONTRACT.json"
      - "current/PLATFORM_OPERATIONALIZATION_CONTRACT.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-os-platform-surface-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  shared-source-validation:
    name: "shared Research OS source validation"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap target platform in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          source_repo="$GITHUB_WORKSPACE"
          work="$RUNNER_TEMP/research-os-platform-${{ matrix.platform }}"
          rm -rf "$work"
          mkdir -p "$work"
          cp -R "$source_repo/." "$work/"
          cd "$work/apps/research_os_flutter"
          flutter create --platforms=${{ matrix.platform }} --project-name=research_os_flutter .
          echo "RESEARCH_OS_PLATFORM_WORKSPACE=$work/apps/research_os_flutter" >> "$GITHUB_ENV"

      - name: Build target platform
        shell: bash
        run: |
          set -euo pipefail
          cd "$RESEARCH_OS_PLATFORM_WORKSPACE"
          flutter pub get
          ${{ matrix.build_command }}
          echo "RESEARCH_OS_PLATFORM_BUILD=PASS"
          test -e "${{ matrix.artifact_path }}"

      - name: Verify shared contract remains present
        shell: bash
        run: |
          set -euo pipefail
          cd "$RESEARCH_OS_PLATFORM_WORKSPACE"
          test -f pubspec.yaml
          test -d lib
          test -d test
          echo "RESEARCH_OS_SHARED_SOURCE_CONTRACT=PASS"
