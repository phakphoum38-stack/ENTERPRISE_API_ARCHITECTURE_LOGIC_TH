name: Research OS Performance Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Research OS Windows Desktop
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: research-os-performance-secondary-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast-path:
    name: Backend performance-only checks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEARCH_OS_PROVIDER: mock
      RESEARCH_OS_API_HOST: 127.0.0.1
      RESEARCH_OS_API_PORT: "8787"
      HOST: 127.0.0.1
      PORT: "8787"
      RESEARCH_OS_DATA_DIR: ${{ runner.temp }}/ResearchOSData

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start primary V2-compatible API
        shell: bash
        run: |
          date +%s%3N >/tmp/research-os-start-ms
          python tools/research_os_api/render_server.py >/tmp/research-os-performance.log 2>&1 &
          echo $! >/tmp/research-os-performance.pid

      - name: Measure V2 startup health orchestration and memory baseline
        run: |
          python - <<'PY'
          import json, os, statistics, subprocess, time, urllib.request

          base="http://127.0.0.1:8787"
          health=f"{base}/health"
          readiness=f"{base}/v2/health/readiness"
          start_ms=int(open('/tmp/research-os-start-ms', encoding='utf-8').read().strip())

          for _ in range(50):
              try:
                  with urllib.request.urlopen(health, timeout=2) as r:
                      if json.load(r).get("status") == "ok":
                          break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("API did not start")

          startup_ms=int(time.time()*1000)-start_ms
          print(f"startup_ready_ms={startup_ms}")
          if startup_ms > 10000:
              raise SystemExit(f"Startup readiness too slow: {startup_ms} ms")

          endpoints={"health":health,"v2_readiness":readiness}
          for name, url in endpoints.items():
              samples=[]
              for _ in range(20):
                  started=time.perf_counter()
                  with urllib.request.urlopen(url, timeout=2) as r:
                      payload=json.load(r)
                  assert payload.get("status") == "ok" if name == "health" else payload.get("ready") is True, payload
                  samples.append((time.perf_counter()-started)*1000)
              samples.sort()
              p95=samples[max(0, int(len(samples)*0.95)-1)]
              avg=statistics.mean(samples)
              print(f"{name} avg_ms={avg:.1f} p95_ms={p95:.1f} max_ms={max(samples):.1f}")
              if p95 > 500:
                  raise SystemExit(f"{name} p95 too slow: {p95:.1f} ms")

          orchestration_samples=[]
          for index in range(15):
              create_body=json.dumps({
                  "objective":f"performance baseline {index}",
                  "steps":[{
                      "step_id":"research",
                      "objective":f"research performance baseline {index}",
                      "requested_agent":"research",
                  }],
              }).encode('utf-8')
              request=urllib.request.Request(
                  f"{base}/v2/orchestrations",
                  data=create_body,
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=3) as r:
                  created=json.load(r)
              run_id=created["run"]["run_id"]
              execute=urllib.request.Request(
                  f"{base}/v2/orchestrations/{run_id}/execute",
                  data=b'{}',
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              started=time.perf_counter()
              with urllib.request.urlopen(execute, timeout=3) as r:
                  completed=json.load(r)
              assert completed["run"]["status"] == "completed", completed
              orchestration_samples.append((time.perf_counter()-started)*1000)

          orchestration_samples.sort()
          p95=orchestration_samples[max(0, int(len(orchestration_samples)*0.95)-1)]
          avg=statistics.mean(orchestration_samples)
          print(f"orchestration_execute avg_ms={avg:.1f} p95_ms={p95:.1f} max_ms={max(orchestration_samples):.1f}")
          if p95 > 1000:
              raise SystemExit(f"Orchestration execute p95 too slow: {p95:.1f} ms")

          pid=open('/tmp/research-os-performance.pid', encoding='utf-8').read().strip()
          rss_kb=int(subprocess.check_output(['ps','-o','rss=','-p',pid], text=True).strip())
          print(f"api_rss_kb={rss_kb}")
          if rss_kb > 300000:
              raise SystemExit(f"API RSS exceeds V2 baseline: {rss_kb} KB")
          PY

      - name: Verify retry policy exists
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("tools/research_os_api/providers.py").read_text(encoding="utf-8")
          required=["retryable_statuses", "429", "503", "max_attempts", "time.sleep"]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit(f"Missing resilience markers: {missing}")
          print("Provider retry policy present.")
          PY

      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/research-os-performance.pid ]; then kill "$(cat /tmp/research-os-performance.pid)" 2>/dev/null || true; fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "# Research OS Performance Gate — V2 Secondary"
            echo "- Primary V2-compatible API used"
            echo "- Startup readiness baseline: <= 10s"
            echo "- /health and /v2/health/readiness p95 baseline: <= 500ms"
            echo "- Orchestration execute p95 baseline: <= 1000ms"
            echo "- API RSS baseline: <= 300000 KB"
            echo "- Provider retry policy remains bounded"
          } >> "$GITHUB_STEP_SUMMARY"
