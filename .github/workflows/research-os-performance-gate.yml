name: Research OS Performance Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Research OS Windows Desktop
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: research-os-performance-secondary-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast-path:
    name: Backend performance-only checks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEARCH_OS_PROVIDER: mock
      RESEARCH_OS_API_HOST: 127.0.0.1
      RESEARCH_OS_API_PORT: "8787"
      HOST: 127.0.0.1
      PORT: "8787"
      RESEARCH_OS_DATA_DIR: ${{ runner.temp }}/ResearchOSData

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start primary V2-compatible API
        shell: bash
        run: |
          python tools/research_os_api/render_server.py >/tmp/research-os-performance.log 2>&1 &
          echo $! >/tmp/research-os-performance.pid

      - name: Measure health and V2 readiness latency
        run: |
          python - <<'PY'
          import json, statistics, time, urllib.request

          endpoints = {
              "health": "http://127.0.0.1:8787/health",
              "v2_readiness": "http://127.0.0.1:8787/v2/health/readiness",
          }

          for _ in range(30):
              try:
                  with urllib.request.urlopen(endpoints["health"], timeout=2) as r:
                      if json.load(r).get("status") == "ok":
                          break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("API did not start")

          for name, url in endpoints.items():
              samples=[]
              for _ in range(20):
                  started=time.perf_counter()
                  with urllib.request.urlopen(url, timeout=2) as r:
                      payload=json.load(r)
                  if name == "health":
                      assert payload["status"] == "ok", payload
                  else:
                      assert payload["ready"] is True, payload
                  samples.append((time.perf_counter()-started)*1000)
              samples.sort()
              p95=samples[max(0, int(len(samples)*0.95)-1)]
              avg=statistics.mean(samples)
              print(f"{name} avg_ms={avg:.1f} p95_ms={p95:.1f} max_ms={max(samples):.1f}")
              if p95 > 500:
                  raise SystemExit(f"{name} p95 too slow: {p95:.1f} ms")
          PY

      - name: Verify retry policy exists
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("tools/research_os_api/providers.py").read_text(encoding="utf-8")
          required=["retryable_statuses", "429", "503", "max_attempts", "time.sleep"]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit(f"Missing resilience markers: {missing}")
          print("Provider retry policy present.")
          PY

      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/research-os-performance.pid ]; then kill "$(cat /tmp/research-os-performance.pid)" 2>/dev/null || true; fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "# Research OS Performance Gate — V2 Secondary"
            echo "- Primary V2-compatible API used"
            echo "- /health latency measured"
            echo "- /v2/health/readiness latency measured"
            echo "- Provider retry policy remains bounded"
          } >> "$GITHUB_STEP_SUMMARY"
