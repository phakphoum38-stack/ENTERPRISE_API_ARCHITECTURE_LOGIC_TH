name: Owner Special iOS Reconciliation Guard

# Owner Special has no separate iOS product surface.
# The canonical iOS product is apps/research_os_flutter and is validated by
# .github/workflows/research-os-ios-ipa.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'owner_special/**'
      - 'apps/research_os_flutter/**'
      - '.github/workflows/owner-special-ios-ipa.yml'

permissions:
  contents: read

jobs:
  reconcile-owner-special-ios:
    name: Reconcile Owner Special iOS boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate single canonical iOS surface
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/research_os_flutter
          test -f .github/workflows/research-os-ios-ipa.yml
          if [ -d owner_special/flutter_app/ios ]; then
            echo "Owner Special iOS source must not exist; canonical source is apps/research_os_flutter/ios."
            exit 1
          fi
          if grep -R -n --exclude='owner-special-ios-ipa.yml'             -e 'owner_special/flutter_app/ios'             -e 'working-directory: owner_special/flutter_app'             -e 'flutter build ios'             .github/workflows/owner-special-ios-ipa.yml; then
            echo "Stale Owner Special iOS build authority detected."
            exit 1
          fi
          grep -q 'apps/research_os_flutter' .github/workflows/research-os-ios-ipa.yml
          echo "OWNER_SPECIAL_IOS_RECONCILIATION=PASS"
