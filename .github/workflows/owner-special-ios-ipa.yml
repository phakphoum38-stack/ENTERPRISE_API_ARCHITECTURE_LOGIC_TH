name: Owner Special iOS IPA

on:
  pull_request:
    paths:
      - 'owner_special/flutter_app/**'
      - '.github/workflows/owner-special-ios-ipa.yml'
  push:
    branches:
      - 'copilot/fix-owner-installer-upgrade-check'
    paths:
      - 'owner_special/flutter_app/**'
      - '.github/workflows/owner-special-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS target
        working-directory: owner_special/flutter_app
        run: flutter create . --platforms=ios --org com.phakphoum38 --project-name research_os_owner_special

      - name: Set Research OS iOS identity
        working-directory: owner_special/flutter_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text(encoding='utf-8')
          out = []
          for line in text.splitlines():
              if 'PRODUCT_BUNDLE_IDENTIFIER =' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  current = line.split('=', 1)[1].strip().rstrip(';')
                  if 'RunnerTests' in current:
                      line = f'{indent}PRODUCT_BUNDLE_IDENTIFIER = com.phakphoum38.researchos.RunnerTests;'
                  else:
                      line = f'{indent}PRODUCT_BUNDLE_IDENTIFIER = com.phakphoum38.researchos;'
              out.append(line)
          project.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Research OS" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Research OS" ios/Runner/Info.plist || true
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" ios/Runner/Info.plist

      - name: Flutter analyze and test
        working-directory: owner_special/flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned iOS app
        working-directory: owner_special/flutter_app
        run: flutter build ios --release --no-codesign

      - name: Verify app identity
        working-directory: owner_special/flutter_app
        shell: bash
        run: |
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display name: $DISPLAY_NAME"
          test "$BUNDLE_ID" = "com.phakphoum38.researchos"
          test "$DISPLAY_NAME" = "Research OS"

      - name: Package unsigned IPA
        working-directory: owner_special/flutter_app
        shell: bash
        run: |
          rm -rf build/unsigned_ipa
          mkdir -p build/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/ResearchOS.app
          cd build/unsigned_ipa
          zip -qry ../Research-OS-iOS-unsigned.ipa Payload
          cd ..
          shasum -a 256 Research-OS-iOS-unsigned.ipa | tee Research-OS-iOS-unsigned.ipa.sha256
          test -s Research-OS-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Research-OS-iOS-unsigned-${{ github.sha }}
          path: |
            owner_special/flutter_app/build/Research-OS-iOS-unsigned.ipa
            owner_special/flutter_app/build/Research-OS-iOS-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
