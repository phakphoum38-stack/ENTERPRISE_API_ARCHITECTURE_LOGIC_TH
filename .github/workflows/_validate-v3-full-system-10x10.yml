name: One-shot V3 Full System 10x10 Validation

on:
  push:
    branches:
      - agent/v3-full-system-10x10
    paths:
      - 'v3/**'
      - '.github/workflows/_validate-v3-full-system-10x10.yml'

permissions:
  contents: read

concurrency:
  group: v3-full-system-10x10-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ubuntu-full-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python full system
        working-directory: v3
        run: |
          python -m compileall -q research_os_v3 scripts tests
          python -m unittest discover -s tests -v
          python scripts/provider_smoke.py
          python scripts/service_smoke.py
          python scripts/storage_smoke.py
          python scripts/factory_execution_smoke.py
      - name: Install Flutter Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Flutter full-system workspace
        working-directory: v3/flutter_app
        run: |
          flutter create --platforms=linux --project-name=research_os_v3_flutter .
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release
