name: Research OS Candidate Dispatcher

on:
  push:
    branches:
      - agent/candidate-security-scan-fix
    paths:
      - '.github/workflows/candidate-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-SHA Research OS Candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: eb27e4a3dc82de7db3f72c798e2a36d8d947a95a
        run: |
          gh workflow run candidate.yml \
            --repo "${{ github.repository }}" \
            --ref agent/candidate-security-scan-fix \
            -f target_sha="$TARGET_SHA"
          echo "Dispatched Research OS Candidate for $TARGET_SHA"
