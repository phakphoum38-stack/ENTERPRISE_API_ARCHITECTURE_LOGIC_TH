name: Research OS Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Verified commit SHA
        required: false
        type: string
      source_installer_run:
        description: Installer workflow run ID
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  release:
    name: Publish verified installer artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      SOURCE_INSTALLER_RUN: ${{ inputs.source_installer_run }}
      V1_ROLLBACK_BASELINE: d05189d151b6bfa65938dad7a812ac104db195f4
    steps:
      - name: Checkout candidate metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify rollback baseline exists
        shell: bash
        run: |
          git cat-file -e "$V1_ROLLBACK_BASELINE^{commit}"
          echo "Stable V1 rollback baseline: $V1_ROLLBACK_BASELINE"

      - name: Resolve installer build run
        id: installer-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$SOURCE_INSTALLER_RUN"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "${{ github.repository }}" --workflow "Research OS Build Installer" --commit "$TARGET_SHA" --status success --limit 20 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id" || { echo "No successful installer build found for $TARGET_SHA"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified Setup EXE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verified-installer
          gh run download "${{ steps.installer-run.outputs.run_id }}" --repo "${{ github.repository }}" --name "research-os-installer-$TARGET_SHA" --dir verified-installer
          find verified-installer -maxdepth 1 -name 'Research-OS-Setup-*-x64.exe' -print -quit | grep -q . || { echo "Verified Setup EXE missing"; exit 1; }

      - name: Create verification and component manifest
        shell: bash
        env:
          INSTALLER_RUN: ${{ steps.installer-run.outputs.run_id }}
        run: |
          setup="$(find verified-installer -maxdepth 1 -name 'Research-OS-Setup-*-x64.exe' -print -quit)"
          sha256sum "$setup" | tee verified-installer/SHA256SUMS.txt
          printf 'commit=%s\ninstaller_run=%s\nvalidation=passed\nrollback_baseline=%s\n' "$TARGET_SHA" "$INSTALLER_RUN" "$V1_ROLLBACK_BASELINE" > verified-installer/VERIFIED.txt
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          setup=next(Path('verified-installer').glob('Research-OS-Setup-*-x64.exe'))
          digest=hashlib.sha256(setup.read_bytes()).hexdigest()
          pubspec=Path('apps/research_os_flutter/pubspec.yaml').read_text(encoding='utf-8')
          app_version=re.search(r'^version:\s*(\S+)', pubspec, re.MULTILINE).group(1)
          installer=Path('installer/research-os.iss').read_text(encoding='utf-8')
          installer_version=re.search(r'#define MyAppVersion "([^"]+)"', installer).group(1)
          manifest={
              'schema_version': 1,
              'target_sha': os.environ['TARGET_SHA'],
              'source_installer_run': os.environ['INSTALLER_RUN'],
              'validation': 'passed',
              'components': {
                  'flutter_app': app_version,
                  'installer': installer_version,
                  'api_contract': 'v2-draft' if '/v2/orchestrations:' in Path('tools/research_os_api/openapi.yaml').read_text(encoding='utf-8') else 'v1',
                  'service_host': 'net8.0-windows',
              },
              'artifacts': [{
                  'name': setup.name,
                  'sha256': digest,
                  'size_bytes': setup.stat().st_size,
              }],
              'data_boundary': r'C:\ProgramData\ResearchOS',
              'upgrade_policy': 'preserve-local-data',
              'rollback': {
                  'baseline_version': '1.0.0',
                  'baseline_sha': os.environ['V1_ROLLBACK_BASELINE'],
                  'data_compatibility': 'preserve-local-data-boundary',
              },
          }
          Path('verified-installer/release-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Verify manifest digest matches Setup EXE
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest=json.loads(Path('verified-installer/release-manifest.json').read_text())
          item=manifest['artifacts'][0]
          setup=Path('verified-installer') / item['name']
          actual=hashlib.sha256(setup.read_bytes()).hexdigest()
          assert actual == item['sha256'], (actual, item['sha256'])
          assert manifest['target_sha'] == os.environ['TARGET_SHA']
          assert manifest['validation'] == 'passed'
          assert manifest['rollback']['baseline_sha'] == os.environ['V1_ROLLBACK_BASELINE']
          print('Release manifest digest and rollback baseline verified.')
          PY

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-verified-release-${{ env.TARGET_SHA }}
          path: verified-installer/**
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch compatibility gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research-os-windows-desktop.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f target_sha="$TARGET_SHA" \
            -f source_release_run="${{ github.run_id }}"
