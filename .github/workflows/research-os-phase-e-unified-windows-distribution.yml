name: Research OS Unified Windows Distribution

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact immutable source SHA to build and validate
        required: true
        type: string
  push:
    branches:
      - feat/research-os-phase-e-unified-windows-distribution
    paths:
      - ".github/workflows/research-os-phase-e-unified-windows-distribution.yml"
      - "apps/research_os_flutter/**"
      - "apps/research_os_web/**"
      - "owner_special/**"
      - "tools/**"
      - "v3/**"
      - "current/**"
      - "installer/research-os-unified.iss"
      - "scripts/**"

permissions:
  contents: read

env:
  TARGET_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact target SHA
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - run: python tools/validate_phase_e_unified_windows_distribution.py
      - env:
          PYTHONPATH: .
        run: python -m unittest tools.test_phase_e_unified_windows_distribution -v

  build:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Exact SHA
        shell: pwsh
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Source SHA mismatch.' }

      - name: Python compile
        shell: pwsh
        run: |
          python -m compileall -q tools owner_special v3
          if ($LASTEXITCODE -ne 0) { throw 'Python compile failed.' }

      - name: Build Research OS Flutter
        shell: pwsh
        run: |
          $repoWorkspace = Join-Path $env:RUNNER_TEMP 'research-os-phase-e-windows'
          & "$env:GITHUB_WORKSPACE\tools\ci\prepare_flutter_isolated_workspace.ps1" -RepositoryRoot $env:GITHUB_WORKSPACE -AppRelativePath 'apps/research_os_flutter' -WorkspaceRoot $repoWorkspace
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Flutter workspace preparation failed.' }
          $w = Join-Path $repoWorkspace 'apps\research_os_flutter'
          Set-Location $w
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=research_os_flutter .
          if ($LASTEXITCODE -ne 0) { throw 'Research OS Windows bootstrap failed.' }

          # flutter create regenerates Windows runner metadata, so apply the
          # canonical Research OS identity before the release build.
          $mainCpp = 'windows\runner\main.cpp'
          $mainText = Get-Content $mainCpp -Raw
          $mainText = $mainText -replace 'Create\(L"research_os_flutter"', 'Create(L"Research OS"'
          Set-Content -Path $mainCpp -Value $mainText -Encoding utf8

          $runnerRc = 'windows\runner\Runner.rc'
          $rc = Get-Content $runnerRc -Raw
          $rc = $rc -replace 'VALUE "CompanyName", ".*?"', 'VALUE "CompanyName", "Research OS Team"'
          $rc = $rc -replace 'VALUE "FileDescription", ".*?"', 'VALUE "FileDescription", "Research OS"'
          $rc = $rc -replace 'VALUE "InternalName", ".*?"', 'VALUE "InternalName", "ResearchOS"'
          $rc = $rc -replace 'VALUE "OriginalFilename", ".*?"', 'VALUE "OriginalFilename", "research_os_flutter.exe"'
          $rc = $rc -replace 'VALUE "ProductName", ".*?"', 'VALUE "ProductName", "Research OS"'
          Set-Content -Path $runnerRc -Value $rc -Encoding utf8

          $verifyRc = Get-Content $runnerRc -Raw
          if ($verifyRc -notmatch 'VALUE "ProductName", "Research OS"') { throw 'Research OS ProductName branding was not applied.' }
          if ($verifyRc -notmatch 'VALUE "CompanyName", "Research OS Team"') { throw 'Research OS CompanyName branding was not applied.' }
          if ($verifyRc -match 'research_os_owner_special') { throw 'Owner Special identity leaked into Research OS Runner.rc.' }

          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Research OS Windows build failed.' }
          $exe = "$w\build\windows\x64\runner\Release\research_os_flutter.exe"
          if (-not (Test-Path $exe)) { throw 'Research OS executable missing.' }
          $v = (Get-Item $exe).VersionInfo
          if ($v.ProductName -ne 'Research OS') { throw 'Research OS ProductName mismatch.' }
          if ($v.CompanyName -ne 'Research OS Team') { throw 'Research OS CompanyName mismatch.' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\phase-e\package\app" | Out-Null
          Copy-Item "$w\build\windows\x64\runner\Release\*" "$env:GITHUB_WORKSPACE\phase-e\package\app" -Recurse -Force

      - name: Build Owner Special
        shell: pwsh
        working-directory: owner_special/flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Owner Special Windows build failed.' }
          if (-not (Test-Path 'build\windows\x64\runner\Release\research_os_owner_special.exe')) { throw 'Owner Special executable missing.' }

      - name: Build services
        shell: pwsh
        run: |
          dotnet publish tools/research_os_service/ResearchOS.ServiceHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o phase-e/service
          dotnet publish owner_special/windows_service/ResearchOS.Owner.ServiceHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o phase-e/owner-service
          if ($LASTEXITCODE -ne 0) { throw 'Service publish failed.' }

      - name: Stage unified package
        shell: pwsh
        run: |
          $p = "$env:GITHUB_WORKSPACE\phase-e\package"
          New-Item -ItemType Directory -Force "$p\owner_special\app","$p\owner_special\research_os_friend","$p\owner_special\scripts","$p\tools","$p\v3","$p\current","$p\workflow","$p\platform\research_os_web","$p\assurance\aeos","$p\runtime\python","$p\service_host","$p\scripts" | Out-Null
          Copy-Item "owner_special\flutter_app\build\windows\x64\runner\Release\*" "$p\owner_special\app" -Recurse -Force
          Copy-Item "owner_special\research_os_friend\*" "$p\owner_special\research_os_friend" -Recurse -Force
          Copy-Item "owner_special\scripts\*" "$p\owner_special\scripts" -Recurse -Force
          Copy-Item "owner_special\OWNER_MANIFEST.json" "$p\owner_special\OWNER_MANIFEST.json" -Force
          $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
          & "$env:GITHUB_WORKSPACE\owner_special\scripts\verify-owner-build-identity.ps1" -ExePath "$p\owner_special\app\research_os_owner_special.exe" -ExpectedManifestPath "$p\owner_special\OWNER_MANIFEST.json"
          if ($LASTEXITCODE -ne 0) { throw 'Owner identity gate failed.' }
          Copy-Item "tools\*" "$p\tools" -Recurse -Force
          Copy-Item "v3\*" "$p\v3" -Recurse -Force
          Copy-Item "current\*" "$p\current" -Recurse -Force
          Copy-Item "current\GENERATE_WORKFLOW_REGISTRY.yml","tools\validate_generate_orchestrator.py","tools\validate_v35_contract.py",".github\workflows\research-os-unified-final-gate.yml" "$p\workflow" -Force
          Copy-Item "apps\research_os_web\*" "$p\platform\research_os_web" -Recurse -Force
          Copy-Item "current\RESEARCH_OS_UNIFIED_FINAL_GATE.yml",".github\workflows\research-os-platform-surface-matrix.yml" "$p\platform" -Force
          Copy-Item "tools\aeos\*" "$p\assurance\aeos" -Recurse -Force
          Copy-Item "tools\lifecycle_evidence.py","tools\capability_e2e_binding.py" "$p\assurance" -Force
          Copy-Item "scripts\research-os-service.ps1","scripts\start-research-os-local.ps1" "$p\scripts" -Force
          Copy-Item "phase-e\service\*" "$p\service_host" -Recurse -Force
          Copy-Item "phase-e\owner-service\*" "$p\service_host" -Recurse -Force
          python -m pip install --disable-pip-version-check --quiet "openai-agents>=0.21.0,<1.0"
          if ($LASTEXITCODE -ne 0) { throw 'OpenAI Agents SDK installation failed.' }
          $py = (python -c "import sys; print(sys.base_prefix)").Trim()
          Copy-Item "$py\*" "$p\runtime\python" -Recurse -Force
          if (-not (Test-Path "$p\runtime\python\python.exe")) { throw 'Bundled Python missing.' }

      - name: Manifest and package validation
        shell: pwsh
        run: |
          $p = "$env:GITHUB_WORKSPACE\phase-e\package"
          $required = @(
            "$p\app\research_os_flutter.exe",
            "$p\owner_special\app\research_os_owner_special.exe",
            "$p\owner_special\OWNER_MANIFEST.json",
            "$p\owner_special\research_os_friend",
            "$p\owner_special\scripts",
            "$p\tools",
            "$p\v3",
            "$p\current",
            "$p\workflow",
            "$p\platform\research_os_web",
            "$p\assurance\aeos",
            "$p\runtime\python\python.exe",
            "$p\service_host\ResearchOS.ServiceHost.exe",
            "$p\service_host\ResearchOS.Owner.ServiceHost.exe",
            "$p\scripts\research-os-service.ps1"
          )
          foreach ($x in $required) { if (-not (Test-Path $x)) { throw "Missing distribution component: $x" } }
          $entries = foreach ($f in Get-ChildItem $p -Recurse -File | Sort-Object FullName) {
            [ordered]@{
              path = $f.FullName.Substring($p.Length + 1).Replace('\','/')
              sha256 = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = $f.Length
            }
          }
          [ordered]@{
            schema_version = 1
            distribution = 'Research OS Unified Windows'
            source_sha = (git rev-parse HEAD).Trim()
            product_name = 'Research OS'
            company_name = 'Research OS Team'
            main_executable = 'app/research_os_flutter.exe'
            owner_executable = 'owner_special/app/research_os_owner_special.exe'
            file_count = @($entries).Count
            files = @($entries)
          } | ConvertTo-Json -Depth 8 | Set-Content "$p\DISTRIBUTION_MANIFEST.json" -Encoding utf8
          $mh = (Get-FileHash "$p\DISTRIBUTION_MANIFEST.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$mh  DISTRIBUTION_MANIFEST.json" | Set-Content "$p\DISTRIBUTION_MANIFEST.sha256" -Encoding ascii
          Write-Host 'RESEARCH_OS_UNIFIED_WINDOWS_DISTRIBUTION=PASS'

      - name: Build unified installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $stagingRoot = "$env:GITHUB_WORKSPACE\phase-e\package"
          if (-not (Test-Path $stagingRoot)) { throw "Distribution staging root not found: $stagingRoot" }
          & $iscc "/DPackageRoot=$stagingRoot" "$env:GITHUB_WORKSPACE\installer\research-os-unified.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Unified installer build failed.' }

      - name: Installer install run uninstall E2E
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "$env:GITHUB_WORKSPACE\phase-e\package"
          $setup = Get-ChildItem "$env:GITHUB_WORKSPACE\installer\output\Research-OS-Unified-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Unified installer missing for E2E.' }

          $targetSha = (git rev-parse HEAD).Trim()
          $installRoot = Join-Path $env:ProgramFiles 'Research OS'
          $dataRoot = Join-Path $env:ProgramData 'ResearchOS'
          $ownerDataRoot = Join-Path $env:ProgramData 'ResearchOSOwnerSpecial'
          $manifest = Join-Path $package 'DISTRIBUTION_MANIFEST.json'
          $manifestHash = Join-Path $package 'DISTRIBUTION_MANIFEST.sha256'
          $manifestHashValue = (Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checks = [ordered]@{}

          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS /TASKS="desktopicon"'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }

          foreach ($relative in @(
            'app\research_os_flutter.exe',
            'owner_special\app\research_os_owner_special.exe',
            'owner_special\OWNER_MANIFEST.json',
            'owner_special\research_os_friend',
            'owner_special\scripts',
            'tools',
            'v3',
            'current',
            'workflow',
            'platform\research_os_web',
            'assurance\aeos',
            'runtime\python\python.exe',
            'service_host\ResearchOS.ServiceHost.exe',
            'service_host\ResearchOS.Owner.ServiceHost.exe',
            'scripts\research-os-service.ps1',
            'DISTRIBUTION_MANIFEST.json',
            'DISTRIBUTION_MANIFEST.sha256'
          )) {
            if (-not (Test-Path (Join-Path $installRoot $relative))) {
              throw "Installed distribution component missing: $relative"
            }
          }
          $checks['installed_components'] = $true

          $installedManifest = Get-Content (Join-Path $installRoot 'DISTRIBUTION_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($installedManifest.source_sha -ne $targetSha) { throw 'Installed manifest source SHA mismatch.' }
          if ($installedManifest.product_name -ne 'Research OS') { throw 'Installed manifest product identity mismatch.' }
          if ($installedManifest.company_name -ne 'Research OS Team') { throw 'Installed manifest company identity mismatch.' }
          $installedManifestHash = (Get-FileHash (Join-Path $installRoot 'DISTRIBUTION_MANIFEST.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedManifestHash -ne $manifestHashValue) { throw 'Installed manifest SHA256 mismatch.' }
          $checks['manifest_provenance'] = $true

          $mainService = Get-Service -Name 'ResearchOSService' -ErrorAction SilentlyContinue
          $ownerService = Get-Service -Name 'ResearchOSOwnerFriendService' -ErrorAction SilentlyContinue
          if (-not $mainService -or $mainService.Status -ne 'Running') { throw 'Research OS service is not running after install.' }
          if (-not $ownerService -or $ownerService.Status -ne 'Running') { throw 'Owner Friend service is not running after install.' }
          $checks['services_running'] = $true

          $ownerReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $ownerHealth = Invoke-RestMethod -Uri 'http://127.0.0.1:8790/owner/health' -TimeoutSec 2
              if ($ownerHealth.status -eq 'ok') { $ownerReady = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ownerReady) { throw 'Owner Friend HTTP health check failed.' }
          $checks['owner_http_ready'] = $true

          $apiReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $apiResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:8787/' -TimeoutSec 2 -UseBasicParsing
              if ($apiResponse.StatusCode -ge 200 -and $apiResponse.StatusCode -lt 500) { $apiReady = $true; break }
            } catch {
              if ($_.Exception.Response) { $apiReady = $true; break }
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $apiReady) { throw 'Research OS API HTTP readiness check failed.' }
          $checks['research_os_api_ready'] = $true

          $appPath = Join-Path $installRoot 'app\research_os_flutter.exe'
          $app = Start-Process -FilePath $appPath -WorkingDirectory (Split-Path $appPath) -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "Research OS desktop application exited during smoke test with code $($app.ExitCode)." }
          $checks['desktop_app_launch'] = $true
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Wait-Process -Id $app.Id -Timeout 10 -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $installRoot 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Inno Setup uninstaller missing.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }

          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Test-Path $installRoot)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $installRoot) { throw 'Installation root remained after uninstall.' }
          if (Get-Service -Name 'ResearchOSService' -ErrorAction SilentlyContinue) { throw 'Research OS service remained after uninstall.' }
          if (Get-Service -Name 'ResearchOSOwnerFriendService' -ErrorAction SilentlyContinue) { throw 'Owner Friend service remained after uninstall.' }
          if (Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue) { throw 'Research OS API port remained bound after uninstall.' }
          if (Get-NetTCPConnection -LocalPort 8790 -State Listen -ErrorAction SilentlyContinue) { throw 'Owner Friend port remained bound after uninstall.' }
          $checks['uninstall_clean'] = $true

          [ordered]@{
            schema = 'research-os.windows-installer-e2e.v1'
            source_sha = $targetSha
            installer = $setup.Name
            installer_sha256 = $setupHash
            manifest_sha256 = $manifestHashValue
            manifest_hash_file = (Get-Content $manifestHash -Raw).Trim()
            install_root = $installRoot
            checks = $checks
            release_authority = 'FINAL_GATE'
          } | ConvertTo-Json -Depth 8 | Set-Content "$env:GITHUB_WORKSPACE\phase-e\WINDOWS_INSTALL_E2E_EVIDENCE.json" -Encoding utf8
          Write-Host 'WINDOWS_INSTALL_E2E=PASS'

      - name: Package and hash distribution
        shell: pwsh
        run: |
          $p = "$env:GITHUB_WORKSPACE\phase-e\package"
          $setup = Get-ChildItem "$env:GITHUB_WORKSPACE\installer\output\Research-OS-Unified-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Unified installer missing.' }
          $sha = (git rev-parse HEAD).Trim()
          $zip = "$env:GITHUB_WORKSPACE\phase-e\Research-OS-Unified-Windows-x64-$sha.zip"
          Compress-Archive -Path "$p\*","$($setup.FullName)" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          [ordered]@{source_sha=$sha; artifact=(Split-Path $zip -Leaf); artifact_sha256=$hash; release_authority='FINAL_GATE'} | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\phase-e\RELEASE_EVIDENCE.json" -Encoding utf8

      - uses: actions/upload-artifact@v6
        with:
          name: Research-OS-Unified-Windows-x64-${{ env.TARGET_SHA }}
          path: |
            phase-e/Research-OS-Unified-Windows-x64-*.zip
            phase-e/Research-OS-Unified-Windows-x64-*.zip.sha256
            phase-e/RELEASE_EVIDENCE.json
            phase-e/WINDOWS_INSTALL_E2E_EVIDENCE.json
            phase-e/package/DISTRIBUTION_MANIFEST.json
            phase-e/package/DISTRIBUTION_MANIFEST.sha256
            installer/output/Research-OS-Unified-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30
