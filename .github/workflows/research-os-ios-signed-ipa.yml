name: Research OS iOS Signed IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-os-ios-signed-ipa
  cancel-in-progress: true

jobs:
  build-signed-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    environment: ios-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS target
        working-directory: apps/research_os_flutter
        run: flutter create . --platforms=ios --org com.phakphoum38 --project-name research_os_flutter

      - name: Apply Research OS branding
        run: |
          python3 -m venv "$RUNNER_TEMP/research-os-ios-branding"
          "$RUNNER_TEMP/research-os-ios-branding/bin/python" -m pip install --disable-pip-version-check pillow
          "$RUNNER_TEMP/research-os-ios-branding/bin/python" scripts/apply-research-os-branding.py --app-root apps/research_os_flutter --platform ios

      - name: Configure iOS identity
        working-directory: apps/research_os_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text(encoding='utf-8')
          out = []
          for line in text.splitlines():
              if 'PRODUCT_BUNDLE_IDENTIFIER =' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  current = line.split('=', 1)[1].strip().rstrip(';')
                  if 'RunnerTests' in current:
                      line = f'{indent}PRODUCT_BUNDLE_IDENTIFIER = com.phakphoum38.researchos.RunnerTests;'
                  else:
                      line = f'{indent}PRODUCT_BUNDLE_IDENTIFIER = com.phakphoum38.researchos;'
              out.append(line)
          project.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Research OS" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Research OS" ios/Runner/Info.plist || true

      - name: Import Apple signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/research-os-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          test -n "$UUID"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Verify signing inputs
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_CODE_SIGN_IDENTITY }}
        run: |
          test -n "$TEAM_ID"
          test -n "$CODE_SIGN_IDENTITY"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Flutter analyze and full test
        working-directory: apps/research_os_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter test test/check_in_page_test.dart --reporter expanded

      - name: Create export options
        working-directory: apps/research_os_flutter
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.phakphoum38.researchos</key><string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
          </dict></plist>
          PLIST

      - name: Build signed IPA
        working-directory: apps/research_os_flutter
        run: >-
          flutter build ipa --release
          --export-options-plist=ios/ExportOptions.plist
          --dart-define=RESEARCH_OS_API_BASE_URL=https://research-os-api-phakphoum.onrender.com

      - name: Verify signed IPA
        working-directory: apps/research_os_flutter
        run: |
          test -s build/ios/ipa/research_os_flutter.ipa
          unzip -q build/ios/ipa/research_os_flutter.ipa -d "$RUNNER_TEMP/ipa-check"
          APP="$RUNNER_TEMP/ipa-check/Payload/Runner.app"
          test -d "$APP"
          codesign -dvv "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.phakphoum38.researchos'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'Research OS'

      - name: Hash IPA
        working-directory: apps/research_os_flutter
        run: shasum -a 256 build/ios/ipa/research_os_flutter.ipa | tee build/ios/ipa/research_os_flutter.ipa.sha256

      - name: Upload signed IPA
        uses: actions/upload-artifact@v5
        with:
          name: Research-OS-iOS-signed-${{ github.sha }}
          path: |
            apps/research_os_flutter/build/ios/ipa/research_os_flutter.ipa
            apps/research_os_flutter/build/ios/ipa/research_os_flutter.ipa.sha256
          if-no-files-found: error
          retention-days: 30
