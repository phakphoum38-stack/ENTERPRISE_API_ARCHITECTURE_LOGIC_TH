name: Workflow Intelligence

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Owner Special Friend Complete
      - Owner Special Build Identity Gate
      - Research OS Gate
      - Research OS Final Gate
      - Research OS Unified 10x10 Exact SHA Gate
      - CI Lite
      - Assistant Mesh 30
      - Generate Orchestrator
      - Launch Desk
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: workflow-intelligence-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  audit:
    name: Workflow Intelligence Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run unit tests
        run: python -m unittest discover -s tools -p 'test_workflow_intelligence.py' -v

      - name: Run workflow architecture audit
        run: python tools/audit_workflow_order.py --ref "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: workflow-intelligence-audit-${{ github.run_id }}
          path: reports/
          if-no-files-found: error

  failure-analysis:
    name: Failed Workflow Analysis
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact failed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Download failed workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p reports
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > reports/FAILED_WORKFLOW.log || true
          test -s reports/FAILED_WORKFLOW.log

      - name: Analyze failure
        run: |
          python tools/analyze_workflow_failure.py \
            --log reports/FAILED_WORKFLOW.log \
            --workflow "${{ github.event.workflow_run.name }}" \
            --run-id "${{ github.event.workflow_run.id }}"

      - name: Generate bounded repair plan
        run: python tools/generate_workflow_repair.py --workflow "${{ github.event.workflow_run.name }}"

      - name: Validate repair safety
        run: python tools/validate_workflow_repair.py

      - name: Publish failure analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-failure-analysis-${{ github.event.workflow_run.id }}
          path: reports/
          if-no-files-found: error

      - name: Create investigation issue for non-safe repair
        if: ${{ always() && hashFiles('reports/WORKFLOW_REPAIR_PLAN.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          STATUS=$(python - <<'PY'
          import json
          print(json.load(open('reports/WORKFLOW_REPAIR_PLAN.json', encoding='utf-8'))['status'])
          PY
          )
          if [ "$STATUS" = "BLOCKED" ] || [ "$STATUS" = "ANALYSIS_REQUIRED" ] || [ "$STATUS" = "HUMAN_APPROVAL_REQUIRED" ]; then
            gh issue create --repo "$REPO" \
              --title "Workflow Intelligence: repair required for $WORKFLOW_NAME run $RUN_ID" \
              --body "Automated analysis completed. Safe auto-merge is disabled. See workflow artifacts for WORKFLOW_FAILURE_ANALYSIS.json and WORKFLOW_REPAIR_PLAN.json. Protected gates are never modified automatically."
          fi
