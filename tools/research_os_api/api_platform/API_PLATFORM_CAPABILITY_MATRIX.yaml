version: 1
kind: api_platform_capability_matrix
name: Research OS API Management Platform
contract: API_PLATFORM_CONTRACT.yaml

status_vocabulary:
  - IMPLEMENTED_KERNEL
  - IMPLEMENTED_API
  - PARTIAL
  - CONTRACT_ONLY
  - INTERNAL_ONLY
  - MISSING
  - LEGACY

capabilities:
  identity:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
    note: Principal registration and API-key authentication exist in the existing kernel.
  api_keys:
    status: PARTIAL
    owner: api_management_platform
    dependencies: [resource_control_plane]
    gaps: [durable_store, rotation, management_http]
  organizations:
    status: CONTRACT_ONLY
    owner: api_management_platform
  projects:
    status: CONTRACT_ONLY
    owner: api_management_platform
  applications:
    status: CONTRACT_ONLY
    owner: api_management_platform
  api_catalog:
    status: CONTRACT_ONLY
    owner: api_management_platform
  api_versions:
    status: CONTRACT_ONLY
    owner: api_management_platform
  endpoints:
    status: CONTRACT_ONLY
    owner: api_management_platform
  scopes:
    status: PARTIAL
    owner: api_management_platform
    dependencies: [existing_scope_model]
  plans:
    status: CONTRACT_ONLY
    owner: api_management_platform
  entitlements:
    status: PARTIAL
    owner: resource_control_plane
    note: Entitlement and policy primitives exist; management administration is not complete.
  quotas:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
  rate_limits:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
  budgets:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
  policy:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
  admission:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
  gateway_routing:
    status: PARTIAL
    owner: api_management_platform
    dependencies: [resource_control_plane]
  usage:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
    note: Hash-chained usage ledger exists; management query surface remains to be built.
  cost:
    status: PARTIAL
    owner: resource_control_plane
    note: Runtime accounting exists; productized management query/reporting is missing.
  evidence_audit:
    status: IMPLEMENTED_KERNEL
    owner: resource_control_plane
    note: Evidence chain exists; management audit query surface remains to be built.
  webhooks:
    status: CONTRACT_ONLY
    owner: api_management_platform
  developer_portal:
    status: CONTRACT_ONLY
    owner: api_management_platform
  sdk_metadata:
    status: MISSING
    owner: api_management_platform
  api_products:
    status: CONTRACT_ONLY
    owner: api_management_platform
  production_network_security:
    status: MISSING
    owner: deployment_boundary
    note: Network exposure requires explicit authz, TLS, request limits, audit, and allowlisting.

non_duplication_rules:
  - quota
  - rate_limit
  - budget
  - policy
  - admission
  - runtime_usage_ledger
  - runtime_evidence_chain
  - provider_credentials
