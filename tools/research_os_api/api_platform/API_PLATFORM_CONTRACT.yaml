version: 1
kind: api_platform_contract
name: Research OS API Management Platform
namespace: /platform/v1
status: contract

purpose: >-
  Management-plane contract for creating, publishing, governing and observing
  APIs without replacing the Research OS runtime control-plane kernel.

boundaries:
  runtime_api_contract: tools/research_os_api/openapi.yaml
  execution_kernel: tools/research_os_api/resource_control_plane.py
  management_owns:
    - organization
    - project
    - application
    - api
    - api_version
    - endpoint
    - scope
    - api_key_metadata
    - plan
    - entitlement
    - api_product
    - gateway_route
    - webhook
    - developer_portal_metadata
  runtime_owns:
    - authentication_verification
    - policy_evaluation
    - quota_evaluation
    - budget_evaluation
    - admission
    - routing_execution
    - usage_accounting
    - evidence_chain

resources:
  organizations:
    collection: /platform/v1/organizations
    operations: [create, list, get]
  projects:
    collection: /platform/v1/projects
    operations: [create, list, get, update, disable]
  applications:
    collection: /platform/v1/applications
    operations: [create, list, get, update, disable]
  apis:
    collection: /platform/v1/apis
    operations: [create, list, get, update, publish, disable]
  api_versions:
    collection: /platform/v1/apis/{api_id}/versions
    operations: [create, list, get, update, release, retire]
  endpoints:
    collection: /platform/v1/versions/{version_id}/endpoints
    operations: [create, list, get, update, disable]
  scopes:
    collection: /platform/v1/scopes
    operations: [create, list, get, update, disable]
  api_keys:
    collection: /platform/v1/applications/{application_id}/keys
    operations: [create, list, get, revoke, rotate]
    raw_secret: never_persisted
  plans:
    collection: /platform/v1/plans
    operations: [create, list, get, update, disable]
  entitlements:
    collection: /platform/v1/plans/{plan_id}/entitlements
    operations: [create, list, get, update, disable]
  products:
    collection: /platform/v1/products
    operations: [create, list, get, update, publish, disable]
  gateway_routes:
    collection: /platform/v1/gateway/routes
    operations: [create, list, get, update, enable, disable]
  webhooks:
    collection: /platform/v1/webhooks
    operations: [create, list, get, update, enable, disable]
  developer_portal:
    collection: /platform/v1/developer-portal
    operations: [get, update]
  usage:
    collection: /platform/v1/usage
    operations: [query]
  costs:
    collection: /platform/v1/costs
    operations: [query]
  audit:
    collection: /platform/v1/audit
    operations: [query]

invariants:
  - project_has_exactly_one_organization
  - application_api_plan_webhook_are_project_scoped
  - version_belongs_to_api
  - endpoint_belongs_to_version
  - endpoint_scopes_resolve
  - api_key_scopes_subset_effective_entitlement
  - raw_api_key_is_not_a_management_object
  - provider_credentials_are_separate
  - quota_rate_limit_budget_policy_are_delegated
  - management_state_does_not_authorize_execution

lifecycle:
  management_state_is_not_runtime_admission_state: true
  authority_and_merge_are_out_of_scope: true

integration:
  request_path:
    - management_identity
    - management_registry
    - authentication_authorization
    - resource_control_plane
    - policy
    - quota
    - budget
    - admission
    - routing
    - execution
    - usage_cost
    - evidence_audit
