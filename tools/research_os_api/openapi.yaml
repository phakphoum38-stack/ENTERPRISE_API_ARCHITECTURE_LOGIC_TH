openapi: 3.1.0
info:
  title: Research OS API
  version: 0.9.0-rc.1
  description: Provider-agnostic API for conversation analysis, knowledge access, AI generation, and Multi-Agent orchestration.
servers:
  - url: http://127.0.0.1:8787
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /v1/providers:
    get:
      summary: List supported AI provider adapters
      responses:
        "200":
          description: Provider list
  /v1/ai/generate:
    post:
      summary: Generate text through a selected provider adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                provider:
                  type: string
                model:
                  type: string
                system:
                  type: string
                prompt:
                  type: string
      responses:
        "200":
          description: Generated output
        "502":
          description: Provider failure
  /v1/conversations/analyze:
    post:
      summary: Analyze a conversation and return a preview Research Artifact
      description: This endpoint does not persist or publish the artifact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation]
              properties:
                title:
                  type: string
                conversation:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: object
                status:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                evidence:
                  type: array
                  items:
                    type: string
                relationships:
                  type: array
                  items:
                    type: string
                min_quality:
                  type: integer
      responses:
        "200":
          description: Artifact preview and quality decision
  /v1/knowledge/artifacts:
    get:
      summary: List Research Artifacts
      responses:
        "200":
          description: Artifact index
  /v1/knowledge/graph:
    get:
      summary: Return the current knowledge graph as JSON
      responses:
        "200":
          description: Graph nodes and edges
  /v1/agents/orchestrations:
    get:
      summary: List Multi-Agent orchestration runs
      responses:
        "200":
          description: Orchestration run list
    post:
      summary: Create a Multi-Agent orchestration run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objective, steps]
              properties:
                objective:
                  type: string
                  minLength: 1
                steps:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/DelegatedStepInput'
      responses:
        "201":
          description: Orchestration created
        "400":
          description: Invalid orchestration request
  /v1/agents/orchestrations/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Get one Multi-Agent orchestration run
      responses:
        "200":
          description: Orchestration run
        "404":
          description: Orchestration run not found
  /v1/agents/orchestrations/{run_id}/execute:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Execute all currently runnable orchestration steps
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated orchestration run
        "404":
          description: Orchestration run not found
  /v1/agents/orchestrations/{run_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Confirm write-capable tasks waiting at the governance gate
      responses:
        "200":
          description: Confirmed and updated orchestration run
        "404":
          description: Orchestration run not found
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    DelegatedStepInput:
      type: object
      required: [objective]
      properties:
        step_id:
          type: string
        objective:
          type: string
          minLength: 1
        requested_agent:
          type: string
          nullable: true
        depends_on:
          type: array
          items:
            type: string
        context:
          type: object
          additionalProperties: true
