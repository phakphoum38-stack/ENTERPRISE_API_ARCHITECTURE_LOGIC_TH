openapi: 3.1.0
info:
  title: Research OS API
  version: 1.0.0
  description: Provider-agnostic API for conversation analysis, knowledge access, AI generation, and Multi-Agent orchestration.
servers:
  - url: http://127.0.0.1:8787
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /v1/providers:
    get:
      summary: List supported AI provider adapters
      responses:
        "200":
          description: Provider list
  /v1/ai/generate:
    post:
      summary: Generate text through a selected provider adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                provider:
                  type: string
                model:
                  type: string
                system:
                  type: string
                prompt:
                  type: string
      responses:
        "200":
          description: Generated output
        "502":
          description: Provider failure
  /v1/conversations/analyze:
    post:
      summary: Analyze a conversation and return a preview Research Artifact
      description: This endpoint does not persist or publish the artifact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation]
              properties:
                title:
                  type: string
                conversation:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: object
                status:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                evidence:
                  type: array
                  items:
                    type: string
                relationships:
                  type: array
                  items:
                    type: string
                min_quality:
                  type: integer
      responses:
        "200":
          description: Artifact preview and quality decision
  /v1/knowledge/artifacts:
    get:
      summary: List Research Artifacts
      responses:
        "200":
          description: Artifact index
  /v1/knowledge/graph:
    get:
      summary: Return the current knowledge graph as JSON
      responses:
        "200":
          description: Graph nodes and edges
  /v1/agents/orchestrations:
    get:
      summary: List and filter Multi-Agent orchestration runs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive search over run ID, objective, step ID, and step objective.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Orchestration run list
        "400":
          description: Invalid filter request
    post:
      summary: Create a Multi-Agent orchestration run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objective, steps]
              properties:
                objective:
                  type: string
                  minLength: 1
                steps:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/DelegatedStepInput'
      responses:
        "201":
          description: Orchestration created
        "400":
          description: Invalid orchestration request
  /v1/agents/orchestrations/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Get one Multi-Agent orchestration run
      responses:
        "200":
          description: Orchestration run
        "404":
          description: Orchestration run not found
  /v1/agents/orchestrations/{run_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Get the durable audit timeline for an orchestration run
      responses:
        "200":
          description: Ordered orchestration audit events
        "404":
          description: Orchestration run not found
  /v1/agents/orchestrations/{run_id}/execute:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Execute all currently runnable orchestration steps
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated orchestration run
        "400":
          description: Run cannot be executed in its current state
        "404":
          description: Orchestration run not found
  /v1/agents/orchestrations/{run_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Confirm write-capable tasks waiting at the governance gate
      responses:
        "200":
          description: Confirmed and updated orchestration run
        "400":
          description: Run cannot be confirmed in its current state
        "404":
          description: Orchestration run not found
  /v1/agents/orchestrations/{run_id}/retry:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Retry failed orchestration steps within their bounded attempt policy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                step_id:
                  type: string
                  description: Retry one failed step. Omit to retry all currently retryable failed steps.
      responses:
        "200":
          description: Retried and updated orchestration run
        "400":
          description: No retryable steps or retry limit exhausted
        "404":
          description: Orchestration run not found
  /v1/agents/orchestrations/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Cancel a non-terminal orchestration run and persist the cancellation
      responses:
        "200":
          description: Cancelled orchestration run
        "400":
          description: Terminal orchestration run cannot be cancelled
        "404":
          description: Orchestration run not found
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    DelegatedStepInput:
      type: object
      required: [objective]
      properties:
        step_id:
          type: string
        objective:
          type: string
          minLength: 1
        requested_agent:
          type: string
          nullable: true
        depends_on:
          type: array
          items:
            type: string
        context:
          type: object
          additionalProperties: true
        max_attempts:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: Maximum explicit execution attempts for this delegated step.
