name: research_os_flutter
description: Cross-platform Flutter home for Research OS.
publish_to: "none"
version: 3.0.0+300

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.3
  flutter_tts: ^4.2.5
  http: ^1.2.2
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/research_os_master.webp
