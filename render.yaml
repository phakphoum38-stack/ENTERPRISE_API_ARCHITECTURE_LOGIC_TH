services:
  - type: web
    name: research-os-api-phakphoum
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: python -m unittest discover -s tools/research_os_api -p "test_*.py" -v
    startCommand: cd tools/research_os_api && python render_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RESEARCH_OS_PROVIDER
        value: gemini
      - key: RESEARCH_OS_GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: RESEARCH_OS_ALLOWED_ORIGIN
        value: https://phakphoum38-stack.github.io
      - key: RESEARCH_OS_GITHUB_REPOSITORY
        value: phakphoum38-stack/ENTERPRISE_API_ARCHITECTURE_LOGIC_TH
      - key: RESEARCH_OS_PUBLIC_BASE_URL
        value: https://research-os-api-phakphoum.onrender.com
      - key: RESEARCH_OS_GOOGLE_IDENTITY_REDIRECT_URI
        value: https://research-os-api-phakphoum.onrender.com/v1/auth/google/callback
      - key: RESEARCH_OS_GOOGLE_REDIRECT_URI
        value: https://research-os-api-phakphoum.onrender.com/v1/google-workspace/oauth/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEARCH_OS_SYNC_KEY
        sync: false
      - key: RESEARCH_OS_GOOGLE_CLIENT_ID
        sync: false
      - key: RESEARCH_OS_GOOGLE_CLIENT_SECRET
        sync: false
