# Research OS V2 isolated staging deployment blueprint.
# Blueprint configuration lives on this deploy branch, while both services build
# from candidate/v2-staging-4e25c05 which points exactly at verified candidate
# 4e25c05c9c14a857a21fc639d0bb3467015a1974.
services:
  - type: web
    name: research-os-api-v2-staging
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/phakphoum38-stack/ENTERPRISE_API_ARCHITECTURE_LOGIC_TH
    branch: candidate/v2-staging-4e25c05
    autoDeploy: false
    buildCommand: RESEARCH_OS_ALLOW_LEGACY_IDENTITY_HEADERS=1 python -m unittest discover -s tools/research_os_api -p "test_*.py" -v
    startCommand: cd tools/research_os_api && python render_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RESEARCH_OS_PROVIDER
        value: mock
      - key: RESEARCH_OS_ALLOWED_ORIGIN
        value: https://phakphoum38-stack.github.io
      - key: RESEARCH_OS_DATA_DIR
        value: /tmp/ResearchOSData

  - type: web
    name: research-os-developer-v2-staging
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/phakphoum38-stack/ENTERPRISE_API_ARCHITECTURE_LOGIC_TH
    branch: candidate/v2-staging-4e25c05
    autoDeploy: false
    buildCommand: RESEARCH_OS_ALLOW_LEGACY_IDENTITY_HEADERS=1 python -m unittest tools.research_os_api.test_developer_identity tools.research_os_api.test_developer_access tools.research_os_api.test_developer_server -v
    startCommand: cd tools/research_os_api && RESEARCH_OS_DEVELOPER_PORT=$PORT python developer_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RESEARCH_OS_DEVELOPER_HOST
        value: 0.0.0.0
      - key: RESEARCH_OS_IDENTITY_ASSERTION_MAX_AGE
        value: "120"
      - key: RESEARCH_OS_IDENTITY_PROXY_SECRET
        generateValue: true
      - key: RESEARCH_OS_DEVELOPER_LOGIN_URL
        value: /identity/login
      - key: RESEARCH_OS_DATA_DIR
        value: /tmp/ResearchOSData
      # RESEARCH_OS_ALLOW_LEGACY_IDENTITY_HEADERS is intentionally absent at runtime.
      # Signed HMAC identity assertions are therefore required by default.
